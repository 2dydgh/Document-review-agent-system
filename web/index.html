    /* 머리말과 첫 패널 사이(2026-09-04: 18 → 14). 되돌리기는 18px. */
    .page-stack { display: flex; flex-direction: column; gap: 14px; }
    /* 줌아웃 뒤 업로드 화면의 세로 공백은 카드 늘리기(page-fill)로 채웠다가
       과하다는 피드백(2026-09-01)에 걷었다 — 대신 "최근 검토" 섹션이 쓸모로
       채운다(views.js recentSection). */

    /* 홈은 내용이 화면보다 짧을 때 남는 높이가 전부 아래로 몰리지 않게 한다.
       카드를 억지로 늘리는 대신 콘텐츠 묶음을 살짝 위쪽 중앙에 두고, 내용이
       길어지면 min-height가 자연스럽게 늘어나 평소처럼 위에서 아래로 스크롤된다. */
    .home-scroll { height: 100%; overflow-x: hidden; overflow-y: auto;
                   background: var(--bg); position: relative; }
    .home-layout { position: relative; z-index: 1; min-height: 100%; box-sizing: border-box;
                   /* 36/48 이던 상하 여백을 줄였다 — 검토 방법 섹션까지 한
                      화면(900px 급)에 들어오게(2026-09-01). 최대폭은 1600 콘텐츠
                      + 좌우 패딩 48 = 1648 — border-box 라 1600 만 주면 콘텐츠가
                      1552 가 되어 다른 화면(.page-container 1600)보다 48px 좁았다. */
                   /* 상하 패딩의 합은 그대로 두고 위 8px을 아래로 옮긴다.
                      가운데 정렬된 콘텐츠 높이는 유지하면서 인사말만 8px 올라간다. */
                   max-width: 1648px; margin: 0 auto; padding: 20px 24px 36px;
                   /* 위에서 시작한다 — 가운데 정렬은 검토 방법 타일을 뺀 뒤(2026-09-18) 내용이 짧아져
                      인사말이 다른 화면(.page-shell 20px)보다 아래서 시작했다. */
                   display: flex; flex-direction: column; justify-content: flex-start; }
    /* 홈 인사는 업무 화면의 첫 문장이다. 캐릭터 대신 같은 선형 아이콘 체계의
       작은 펼친 손만 붙여, 단정함을 해치지 않는 정도로 친근함을 남긴다. */
    .home-greeting { margin-bottom: 18px; }
    .home-greeting-copy { min-width: 0; }
    /* 제목 서체는 700 하나만 실려 있어 500 을 적어도 700 으로 그려진다 — 페이지
       제목과 같은 26px·700 으로 맞춘다. 이름은 색(--accent-ink)으로 선다. */
    .home-greeting-title { display: flex; align-items: center; gap: 8px; font-weight: 800;
                           margin: 0 0 4px; font-size: 26px;
                           line-height: 1.2; letter-spacing: var(--tr-title); color: var(--text-title);
                           text-wrap: balance; }
    .home-greeting-name { color: var(--accent-ink); }  /* 굵기는 제목(800)을 그대로 물려받는다 — 색만 다르다 */
    .home-greeting-wave { display: inline-flex; align-items: center; justify-content: center;
                          flex: none; font-size: 22px; }
    /* 인사 손짓은 진입 때 **한 번만** 흔든다 — 손목(우하단)을 축으로 두 번.
       업무 화면의 상시 반복은 금지지만 화면당 1회 첫 등장 연출은 로그인 계열과
       같은 예외다. 재렌더 재생 방지는 음수 지연(views.js)이 막는다. */
    .home-greeting-wave.wave-enter {
      transform-origin: 72% 88%;
      animation: waveHello .6s ease-in-out var(--wave-delay, 400ms) 1 both;
    }
    @keyframes waveHello {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(16deg); }
      65% { transform: rotate(-9deg); }
    }
    /* 손짓에 마우스를 올리면 다시 흔든다 — 같은 동작의 별칭 키프레임이라
       진입 연출과 겹쳐도 재시작이 보장된다. 마우스 환경에서만. */
    @media (hover: hover) and (pointer: fine) {
      .home-greeting-wave:hover {
        transform-origin: 72% 88%;
        animation: waveAgain .6s ease-in-out 1;
      }
    }
    @keyframes waveAgain {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(16deg); }
      65% { transform: rotate(-9deg); }
    }
    /* 포인터 스포트라이트. 새 도식만 두면 빛은 장식이지만, 커서 아래에서만
       흰 선 마스코트가 드러나도록 해 작은 '숨은 캐릭터 찾기'가 된다.
       정보층과 경쟁하지 않게 선화는 배경 z층, 실제 내용은 그 위에 둔다.
       터치·no-hover 환경에는 발견 동작 자체가 없으므로 마크도 내지 않는다. */
    @media (hover: hover) and (pointer: fine) {
      [data-glow] { position: relative; isolation: isolate; }
      [data-glow] > * { position: relative; z-index: 1; }
      [data-glow]::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        z-index: 0; pointer-events: none; opacity: 0;
        transition: opacity .2s var(--ease-out);
        background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%),
                    rgba(255, 255, 255, .15), transparent 60%);
      }
      [data-glow]:hover::after { opacity: 1; }
    }
    .home-greeting-wave svg { overflow: visible; }
    .home-wave-shape { fill: color-mix(in srgb, var(--brand-highlight) 72%, var(--brand-primary));
                       stroke: var(--brand-deep);
                       stroke-width: 6; stroke-linejoin: round; }
    .home-greeting-sub { max-width: 52ch; margin: 0; font-size: 13px; font-weight: 500;
                         line-height: 1.6; color: var(--text-3); text-wrap: pretty; }
    @media (max-height: 760px) {
      .page-shell-primary { padding: 20px 24px; }
      .home-layout { justify-content: flex-start; padding-top: 20px; padding-bottom: 36px; }
    }
    @media (max-width: 720px) {
      .home-layout { padding-left: 16px; padding-right: 16px; }
      .home-greeting-title { font-size: 22px; }
    }

    /* 휴식 상태의 면은 전부 평면 — 선으로만 묶는다. 그림자는 hover(--sh-2) 와
       모달·팝오버·런처(--sh-3) 처럼 "떠 있다"는 신호에만 쓴다(2026-09-04). */
    .setup-panel, .surface-work { background: var(--panel); border: 1px solid var(--line);
                                 border-radius: var(--r-lg); padding: 24px; }
    /* 종이·폴더 글리프의 농도. 값이 SVG 안에 박혀 있으면 테마를 못 따라간다 —
       0.15 채움은 흰 바탕에서는 알맞지만 어두운 바탕에서는 거의 사라져 목록이
       "완전 반투명"으로 보였다(2026-09-01 지적). 다크에서 한 단씩 올린다.
       (SVG 의 opacity="" 속성은 var() 를 못 받는다 — style="opacity:var(…)" 로
        건다. 그래야 CSS 변수가 먹는다.) */
    :root { --glyph-fill: .15; --glyph-fold: .3; --glyph-line: .38; --glyph-mark: .55; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --glyph-fill: .3; --glyph-fold: .48; --glyph-line: .6; --glyph-mark: .8; }
    }
    :root[data-theme="dark"] {
      --glyph-fill: .3; --glyph-fold: .48; --glyph-line: .6; --glyph-mark: .8; }


    /* 홈은 승인된 기존 시안의 곡률·버튼 반응을 유지한다. 서체는 앱과 같은 Wanted Sans 로 통일했다 —
       홈 인사만 NanumSquare 였다(2026-09-16). 인사 제목은 800 으로 굵게. */
    .home-layout { --home-title: #403C38; --r-lg: 14px; }
    :root[data-theme="dark"] .home-layout { --home-title: #DDE2EA; }
    .home-recent-row > span, .home-recent-row > div:not(:first-child) {
      border-left: 1px solid var(--line-2); }
    @media (hover: hover) and (pointer: fine) {
      .home-layout .btn-primary:hover, .home-layout .btn-ghost:hover,
      .home-layout .btn-ghost-accent:hover { transform: translateY(-1px); }
    }
    .home-layout .btn:not(:disabled):active { transform: scale(.97); filter: none; }
    /* 알림 줄의 진행 중 표시. 검토가 5분까지 걸려서, 멈춘 글자만 있으면
       죽은 것처럼 보인다 — 도는 것이 하나 있어야 살아 있다고 읽힌다. */
    /* 알림 행 — 누를 수 있는 행(끝난 것·진행 중)만 hover 면(2026-09-04). */
    .noti-row[data-act]:hover { background: var(--state-hover-neutral); }
    .progress-stopping { font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
    .job-spin { width: 9px; height: 9px; flex: none; border-radius: 50%;
                border: 1.5px solid var(--accent-weak); border-top-color: var(--accent);
                animation: spin .9s linear infinite; }

    .surface-list { background: var(--panel); border: 1px solid var(--line);
                    border-radius: var(--r-lg); box-shadow: none; overflow: hidden; }
    /* 목록 카드 안의 드롭다운은 카드 밖으로 나와야 보인다. overflow:hidden 은
       둥근 모서리에서 행 배경을 자르려고 있는 것인데, 그것이 열린 메뉴까지
       잘라 계정 관리의 권한 선택이 카드에 묻혔다(2026-09-01). 열려 있는 동안만
       잘라내기를 푼다 — 닫히면 다시 모서리를 자른다. */
    .surface-list:has(.sel.open) { overflow: visible; }

    /* 데이터 성격의 목록은 카드 묶음이 아니라 같은 열을 공유하는 레코드 표로
       보인다. 검토 기록·추가 체크리스트·계정 관리가 이 문법을 함께 쓴다. */
    .record-surface { border-radius: var(--r-md); }
    .record-toolbar { min-height: 48px; display: flex; align-items: center; gap: 12px;
                      padding: 6px 12px; border-bottom: 1px solid var(--line); }
    .record-view-name { flex: none; color: var(--text); font-size: 14px; font-weight: 700; }
    .record-view-name b { margin-left: 4px; color: var(--accent-ink);
                          font-variant-numeric: tabular-nums; }
    .record-filters { min-width: 0; display: flex; align-items: center; gap: 4px;
                      overflow-x: auto; }
    .record-filter { flex: none; padding: 6px 10px; border: 1px solid transparent;
                     border-radius: var(--r-sm); background: transparent; color: var(--text-2);
                     font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .record-filter:hover { background: var(--state-hover-neutral); color: var(--text); }
    .record-filter.is-on { border-color: var(--line); background: var(--bg); color: var(--text); }
    .record-filter b { margin-left: 4px; color: inherit; font-variant-numeric: tabular-nums; }
    .record-head, .record-row { display: grid; align-items: center; column-gap: 0; }
    /* 문서명은 남는 폭을 다 먹되 바닥을 낮추고, 유형·결과·일시·작업을 한 단씩 넓힌다 —
       "근거 없음 5건"·"체크리스트 검토" 가 잘리거나 붙어 보였다(2026-09-17). */
    .record-history-grid { grid-template-columns: minmax(220px, 1fr) 136px 184px 112px 80px; }
    .record-recent-grid { grid-template-columns: minmax(260px, 1fr) 160px 110px 76px; }
    .record-checklist-grid { grid-template-columns: minmax(240px, 1fr) minmax(180px, .7fr) 90px 210px; }
    .record-account-grid { grid-template-columns: minmax(240px, 1fr) minmax(180px, .7fr) 150px 90px; }
    .record-criteria-grid { grid-template-columns: minmax(300px, 1fr) 160px 180px 140px 40px; }
    .home-recent-grid { grid-template-columns: minmax(240px, 1fr) 160px 120px 40px; }  /* 타일이 가로 전체가 되며 날짜 칸을 넓혔다(2026-09-18) */
    .record-head { min-height: 36px; background: var(--panel); color: var(--text-2);
                   border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
    .record-head > span, .record-row > span, .record-row > div { min-width: 0;
                                                                 padding: 0 12px; }
    .record-head > span + span, .record-row > span, .record-row > div:not(:first-child) {
      border-left: 0; }
    .record-row { min-height: 58px; border-bottom: 1px solid var(--line-2);
                  background: var(--panel); color: var(--text); font-size: 14px; }
    .record-row:last-child { border-bottom: 0; }
    .record-row[data-act] { cursor: pointer; }
    .record-row[data-act]:hover { background: var(--state-hover-neutral); }
    .record-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .record-primary { display: flex; align-items: center; gap: 10px; }
    .record-primary > span { min-width: 0; }
    .record-primary strong, .record-primary small { display: block; overflow: hidden;
                                                    text-overflow: ellipsis; white-space: nowrap; }
    .record-primary strong { color: var(--text); font-size: 14px; font-weight: 650; }
    .record-primary strong em { margin-left: 4px; color: var(--text-3); font-size: 12px;
                                font-style: normal; font-weight: 600; }
    .record-primary small { margin-top: 2px; color: var(--text-3); font-size: 12px; }
    .record-tag { display: inline-flex; padding: 2px 6px; border-radius: var(--r-sm);
                  background: var(--bg); color: var(--text-2); font-size: 12px;
                  font-weight: 600; white-space: nowrap; }
    .record-result { display: flex; align-items: center; gap: 6px; overflow: hidden;
                     color: var(--text-2); text-overflow: ellipsis; white-space: nowrap; }
    .record-result i { flex: none; width: 8px; height: 8px; border-radius: 999px; }
    .record-muted { overflow: hidden; color: var(--text-3); text-overflow: ellipsis;
                    white-space: nowrap; }
    .record-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
    .viewer-source-note { flex: none; padding: 8px 16px; font-size: 13px; line-height: 1.6;
      color: var(--text-2); background: var(--bg); border-bottom: 1px solid var(--line); }
    .record-tools { display: flex; align-items: center; gap: 12px; }
    .record-search { display: flex; align-items: center; gap: 8px; width: min(380px, 100%);
      padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-md);
      background: var(--panel); color: var(--text-3); }
    .record-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-weak); }
    .record-search > svg { width: 16px; height: 16px; flex: none; }
    .record-search input { flex: 1; min-width: 0; min-height: 38px; padding: 8px 0; border: 0;
      outline: none; font: inherit; font-size: 14px; background: transparent; color: var(--text); }
    .history-search-scope { margin-left: auto; font-size: 12px; color: var(--text-3); }
    .history-result-copy { min-width: 0; white-space: normal; line-height: 1.4; }
    .history-result-copy small { display: block; color: var(--text-3); font-size: 12px; margin-top: 4px; }
    .history-pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
    .history-pagination > div { display: flex; align-items: center; gap: 14px; }
    .history-actions-wrap { position: relative; display: inline-flex; flex: none; }
    .history-more-button { display: inline-flex; justify-content: center; align-items: center;
      width: 32px; height: 32px; padding: 6px; border: 1px solid transparent; border-radius: var(--r-sm);
      color: var(--text-3); background: transparent; cursor: pointer; }
    .history-more-button svg { width: 18px; height: 18px; }
    .history-more-button:hover, .history-more-button[aria-expanded="true"] { color: var(--text);
      background: var(--bg); border-color: var(--line); }
    .history-actions-menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 120;
      display: flex; flex-direction: column; width: max-content; min-width: 140px; padding: 4px;
      border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); box-shadow: var(--sh-2); }
    .history-actions-menu[hidden] { display: none; }
    .history-actions-menu.is-above { top: auto; bottom: calc(100% + 6px); }
    .history-actions-menu button { display: block; min-height: 36px; padding: 8px 10px; border: 0;
      border-radius: var(--r-sm); background: transparent; color: var(--text-2); text-align: left;
      font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
    .history-actions-menu button:hover, .history-actions-menu button:focus-visible { background: var(--bg); }
    .history-delete-confirm { display: flex; flex-direction: column; max-height: calc(100dvh - 48px); }
    .history-delete-confirm > :not(.history-delete-content) { flex: none; }
    .history-delete-content { min-height: 0; overflow-y: auto; margin-bottom: 22px; font-size: 14px; line-height: 1.6; }
    .history-delete-question { margin: 0 0 16px; color: var(--text-2); }
    .history-delete-targets { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
    .history-delete-meta { padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--bg); }
    .history-delete-document { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-top: 1px solid var(--line-2); }
    .history-delete-document > span { flex: none; padding-top: 2px; }
    .history-delete-document > div { min-width: 0; }
    .history-delete-label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--text-2); }
    .history-delete-name { margin: 0; font-size: 14px; font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
    .history-delete-warning { margin: 16px 0 0; color: var(--text); }
    .history-delete-batch { padding: 14px; border: 1px solid var(--line); border-radius: var(--r-md);
      font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
    #historyRecords:has(.history-actions-menu:not([hidden])) { overflow: visible; }
    #historyRecords .sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #historyRecords .record-row:last-child { border-radius: 0 0 var(--r-md) var(--r-md); }
    #historyRecords .record-primary strong { font-size: 14px; font-weight: 600; }
    /* 선택은 옅은 면으로, 키보드 위치는 별도의 외곽선으로 구분한다.
       투명 테두리는 유지해 선택 전후 버튼 크기가 달라지지 않게 한다. */
    #historyRecords .record-filter.is-on, .criteria-scope-tabs .record-filter.is-on {
      color: var(--accent-ink); border-color: transparent; background: var(--accent-weak);
    }
    #historyRecords .record-filter:focus-visible, .criteria-scope-tabs .record-filter:focus-visible {
      outline: 2px solid var(--accent); outline-offset: -2px;
    }
    #historyRecords .record-toolbar { flex-wrap: wrap; }
    /* 행 배경은 이어지되, 작업 셀의 위아래 여백은 결과 이동 영역이 아니다. */
    #historyRecords .record-row > .record-actions {
      align-self: stretch; cursor: default; background: transparent;
    }
    #historyRecords .record-row[data-act="openHistory"]:hover:not(:has(.record-actions:hover)) .record-primary strong,
    #historyRecords .record-row[data-act="openHistory"]:focus-visible .record-primary strong {
      text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
    }
    .history-empty { padding: 40px 20px; text-align: center; font-size: 13px; color: var(--text-2); }
    .history-empty p { margin: 8px 0 16px; font-size: 13px; color: var(--text-2); }
    @media (max-width: 900px) {
      .record-tools { flex-wrap: wrap; }
      .record-search { width: 100%; }
      .history-search-scope { margin-left: 0; flex: 1; }
    }
    .setup-recent-records .record-toolbar { justify-content: space-between; }
    .home-recent-list .record-row { min-height: 52px; background: transparent; }
    .home-recent-list .record-row:last-child { border-bottom: 0; }
    .home-result-label { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                         white-space: nowrap; font-size: 14px; line-height: 1.4; }
    /* 방금 끝난 검토가 홈 목록에 들어온 순간만 강조한다. 데이터가 생겼다는 피드백이지
       장식이 아니므로 반복하지 않고, 약 1초 뒤 평소의 투명한 행으로 돌아온다. */
    .home-recent-row.is-fresh { animation: homeFreshRow 1.1s var(--ease-out) both; }
    .home-recent-row.is-fresh .record-result i {
      animation: homeFreshDot .72s var(--ease-out) both; }
    @keyframes homeFreshRow {
      0% { background: transparent; }
      18% { background: var(--accent-weak); }
      100% { background: transparent; }
    }
    @keyframes homeFreshDot {
      0%, 100% { transform: scale(1); }
      34% { transform: scale(.9); }
      64% { transform: scale(1.1); }
    }
    .home-recent-open { width: 28px; height: 28px; justify-self: center; display: flex;
                        align-items: center; justify-content: center; padding: 0 !important;
                        border: 1px solid transparent; border-radius: 50%;   /* 글자 없는 채운 아이콘 버튼은 원(2026-09-18) */
                        color: var(--text-3); opacity: .55;
                        transition: color .15s ease-out, background .15s ease-out,
                                    border-color .15s ease-out, opacity .15s ease-out,
                                    transform .15s ease-out; }
    .home-recent-open svg { width: 16px; height: 16px; }
    @media (hover: hover) and (pointer: fine) {
      .home-recent-row:hover .home-recent-open { background: var(--accent);
                                                 border-color: var(--accent); color: #fff;
                                                 opacity: 1; transform: translateX(2px); }
    }
    /* 홈 최근 검토는 외부 받침 면 없이, 도형 안쪽에만 옅은 채움이 있는 30px
       기록형 글리프를 쓴다. 맨 선 아이콘보다 덜 밋밋하고 목록을 무겁게 만들지 않는다. */
    .home-recent-glyph { width: 30px; height: 30px; flex: none; display: flex;
                         align-items: center; justify-content: center; }
    .home-recent-glyph > svg { margin: 0 !important; }
    .record-kind-icon { flex: none; width: 30px; height: 30px; display: flex;
                        align-items: center; justify-content: center; border-radius: 50%;
                        background: var(--accent-weak); color: var(--accent-ink); }
    .record-kind-icon svg { width: 16px; height: 16px; }
    .record-avatar { flex: none; width: 30px; height: 30px; display: flex; align-items: center;
                     justify-content: center; border-radius: 999px; background: var(--accent-weak);
                     color: var(--accent-ink); font-size: 12px; font-weight: 700; }
    .record-empty { padding: 40px 16px; color: var(--text-2); font-size: 13px;
                    line-height: 1.6; text-align: center; }
    @media (max-width: 1100px) {
      .record-history-grid { grid-template-columns: minmax(200px, 1fr) 124px 160px 100px 72px; }
      .record-recent-grid { grid-template-columns: minmax(220px, 1fr) 140px 90px 68px; }
      .record-checklist-grid { grid-template-columns: minmax(200px, 1fr) 150px 70px 190px; }
      .record-account-grid { grid-template-columns: minmax(220px, 1fr) 160px 140px 76px; }
      .record-criteria-grid { grid-template-columns: minmax(260px, 1fr) 140px 160px 130px 36px; }
      .home-recent-grid { grid-template-columns: minmax(220px, 1fr) 140px 90px 36px; }
      .record-actions .btn-danger-ghost { display: none; }
    }
    @media (max-width: 720px) {
      .home-recent-grid { grid-template-columns: minmax(0, 1fr) 90px 32px; }
      .home-recent-row > .record-result { display: none; }
    }

    /* 업로드 셋업 세 화면의 공통 작업면. 페이지 제목은 밖에, 실제 선택과 실행은
       이 한 면 안에 둬 카드 제목과 페이지 제목의 위계를 섞지 않는다. */
    .setup-context { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .setup-context-row { display: grid; grid-template-columns: 176px minmax(0, 1fr) auto;
                         gap: 18px; align-items: center; }
    .setup-section-title { margin: 0; font-family: var(--font-body); font-size: 15px;
                           line-height:1.4; font-weight: 600; letter-spacing: var(--tr-body);
                           color: var(--text); }
    .setup-section-sub { margin: 4px 0 0; font-size: 13px; line-height:1.6; color: var(--text-2); }

    /* sidebar nav */
    /* 모서리는 --r-md(10px). 채운 항목은 면적이 있어서 8px 면 각져 보인다 —
       참고안(bentogrid_brown)의 선택 항목도 이 정도로 둥글다. hover 면도 같은
       값을 써야 마우스를 올렸을 때 모양이 안 바뀐다. */
    .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
           width: 100%; border: 0; background: transparent; text-align: left; font-family: inherit;
           border-radius: var(--r-md); cursor: pointer;
           color: var(--text-2); font-size: 13px; font-weight: 500;
           transition: background .15s ease-out, color .15s ease-out; }
    /* 중립 클릭 면의 단일 계약. 프로필·사이드바·문서 행은 같은 색, 같은 속도,
       같은 12px 곡률을 쓴다. 컴포넌트별 규칙에서 배경을 다시 정하지 않는다. */
    /* .nav 는 hover 면이 없다(2026-09-04) — 선택 면이 미끄러져 다니는 사이드바에서
       hover 면까지 있으면 면이 둘이라 어느 게 선택인지 흐려진다. hover 는 글자색만. */
    .header-profile:hover, .header-profile.on,
    .hrow:hover, .hrow-flush:hover { background: var(--state-hover-neutral); }
    /* 현재 메뉴는 공용 메인 버튼과 같은 솔리드 면·흰 글자/아이콘으로 표시한다.
       --accent-surface 는 밝은/어두운 테마 모두 흰 글자를 받는 토큰이다. */
    .nav:hover { color: var(--accent-ink); }
    .nav.on { background: var(--accent-surface); color: #fff; font-weight: 600; }
    .nav:focus-visible { outline-offset: -2px; }
    .nav.on:focus-visible { outline-color: #fff; }

    /* 지적 카드. 인라인 스타일로 두면 :hover 가 인라인에 밀려 안 먹는다 —
       그래서 상태를 클래스로 뺐다(.on = 펼쳐진 카드). app.js 의 select 가
       클래스만 갈아끼워 카드를 갱신하므로 여기 규칙이 곧 카드의 모양이다. */
    .fcard { position: relative; margin-bottom: 8px; border: 1px solid var(--line-2);
             border-radius: var(--r-sm); padding: 14px; cursor: pointer; background: var(--panel);
             transition: border-color .15s var(--ease-out), background .15s var(--ease-out),
                         box-shadow .15s var(--ease-out), transform .15s var(--ease-out); }
    .fcard.on { border-color: rgba(var(--accent-rgb), .42); background: var(--state-hover-brand); }
    /* 손가락은 탭 한 번에 hover 를 흘리고 간다 — 카드가 떠올랐다가 손을 떼면
       그대로 붙어 있어 "눌린 건가" 싶게 만든다. 움직이는 hover 는 마우스에만. */
    @media (hover: hover) and (pointer: fine) {
      .fcard:hover { border-color: rgba(var(--accent-rgb), .42);
                     background: var(--state-hover-brand); }
      /* 고른 카드는 hover 로 배경이 흐려지지 않게 — 어디가 선택됐는지 잃지 않는다. */
      .fcard.on:hover { background: var(--state-hover-brand); transform: none; }
    }
    .finding-card-head { display: flex; justify-content: space-between; align-items: flex-start;
                         gap: 8px; margin-bottom: 10px; }
    .finding-card-tags { min-width: 0; display: flex; flex-wrap: wrap;
                         align-items: center; gap: 6px; }
    /* 검사 분류는 짧은 이름 알약 하나가 말한다(색은 여기만). 종류 이름은 회색 글자 —
       회색 알약으로 두니 심각도 점·번호 칩과 알약이 셋이라 카드 머리가 배지 진열대였다(2026-09-15). */
    .pill-cat { min-height: 20px; padding: 0 6px; font-size: 11px; letter-spacing: var(--tr-caps);
                background: var(--neutral-weak); color: var(--text-2); cursor: default; }
    .pill-cat.cat-form { background: var(--cat-form-bg); color: var(--cat-form-fg); }
    .pill-cat.cat-expr { background: var(--cat-expr-bg); color: var(--cat-expr-fg); }
    .pill-cat.cat-trace { background: var(--cat-trace-bg); color: var(--cat-trace-fg); }
    .pill-cat.cat-process { background: var(--cat-process-bg); color: var(--cat-process-fg); }
    .finding-kind { display: inline-flex; align-items: center; min-height: 22px;
                    color: var(--text-2); font-size: 12px; font-weight: 500; line-height: 1.4; }
    .finding-note-badge { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 8px;
                          border-radius: 999px; border: 1px solid var(--line-2); background: transparent;
                          color: var(--text-3); font-size: 12px; font-weight: 600; line-height: 1.4; }
    .finding-confidence { display: inline-flex; align-items: center; gap: 6px; min-height: 22px;
                          color: var(--text-3); font-size: 12px; font-weight: 600;
                          white-space: nowrap; }
    .finding-confidence i { width: 7px; height: 7px; flex: none; border-radius: 50%; }
    .finding-card-aside { flex: none; display: inline-flex; align-items: center; gap: 6px;
                          color: var(--text-3); font-size: 12px; font-weight: 600;
                          font-variant-numeric: tabular-nums; white-space: nowrap; }
    .finding-card-disclosure { width: 12px; color: var(--text-3); text-align: center; }
    .finding-new { color: var(--accent-ink); font-weight: 600; }
    /* 카드 머리의 "지적 아님 / 되돌리기". 글자만 있는 작은 단추 — 카드 자체가 눌리는
       면이라 면을 채우면 두 단추가 겹쳐 보인다. */
    /* 삭제는 회색 휴지통 하나 — 붉은 테두리 단추는 카드에서 제일 먼저 눈에 띄는 것이 됐다
       (2026-09-15, saas.png 의 연필·휴지통처럼 보조 동작은 회색). 올리면 그때 붉어진다. */
    .finding-dismiss { flex: none; margin-left: auto; margin-right: 6px; border: 0; background: transparent;
                       color: var(--text-3); font: inherit; font-size: 11px; font-weight: 600;
                       min-width: 24px; height: 24px; padding: 0 6px; border-radius: var(--r-sm); cursor: pointer;
                       display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .finding-dismiss svg { width: 13px; height: 13px; }
    .finding-dismiss:hover { background: var(--sev-crit-bg); color: var(--sev-crit-fg); }
    .dismissed-row { margin: 10px 0 6px; }
    /* 기준 판정 탭의 상태 구역. 머리 한 줄은 누르면 접혔다 펴진다. */
    /* 구역 = 상자 하나(아코디언). 머리는 회색 면, 펼친 항목들은 같은 상자 안 흰 면. */
    .criteria-section { margin-bottom: 8px; border: 1px solid var(--line); border-radius: var(--r-md);
                        overflow: hidden; background: var(--panel); }
    .criteria-section:hover { border-color: var(--accent); }
    .criteria-section-head { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
                             text-align: left; border: 0; background: var(--bg); color: var(--text);
                             font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; }
    .criteria-section.is-open .criteria-section-head { border-bottom: 1px solid var(--line); }
    .criteria-section-body { padding: 12px 12px 0; }
    .criteria-section-body .crit-item:last-child { border-bottom: 0; margin-bottom: 0; }
    .criteria-section-body .criteria-group-head:first-child { margin-top: 0; }
    .criteria-section-caret { width: 12px; color: var(--text-3); }
    .criteria-section-head b { font-weight: 600; }
    .criteria-section-count { margin-left: 2px; }
    /* 설명은 제목 아랫줄 전체 폭. 오른쪽에 붙이면 좁은 패널에서 두 줄로 구겨진다. */
    .criteria-section-sub { flex-basis: 100%; padding-left: 20px; font-size: 12px; color: var(--text-3); line-height: 1.4; }
    /* 기준 항목 한 줄: [층][분류] 번호 · 항목 …… 상태 알약 */
    /* 상태 알약은 제목 **바로 뒤** — 오른쪽 끝에 붙이니 넓은 화면에서 제목과 알약 사이가 한참
       벌어져 무엇의 상태인지 눈이 따로 놀았다(2026-09-16). 짧은 항목은 한 줄로 끝난다. */
    .crit-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
    .crit-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .crit-item-title { min-width: 0; font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.6; }
    .crit-item-status { flex: none; display: inline-flex; align-items: center; gap: 8px; }
    .crit-item-status .mut { font-size: 12px; color: var(--text-3); }
    .crit-tag { margin-right: 6px; vertical-align: 1px; }
    .criteria-group-head { margin: 10px 0 4px; font-size: 12px; font-weight: 700; color: var(--text-3); }
    /* 위치 후보 이동(같은 문장이 여러 곳). 카드 아래 한 줄. */
    .cand-nav { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px;
                font-weight: 600; color: var(--text-2); }
    .cand-nav button { border: 1px solid var(--line); background: var(--bg); color: var(--text);
                       font: inherit; font-size: 13px; line-height: 1; padding: 4px 10px;
                       border-radius: var(--r-sm); cursor: pointer; }
    .cand-nav button:hover { border-color: var(--accent); color: var(--accent-ink); }
    .dismissed-row button { border: none; background: none; font: inherit; font-size: 12px;
                            color: var(--text-3); cursor: pointer; padding: 4px 0; }
    .dismissed-row button:hover { color: var(--text); text-decoration: underline; }

    /* 결과 패널의 선택·정렬은 모두 실제 button을 쓰고 같은 높이·테두리를 갖는다.
       확실/확인 필요는 체크박스가 아니라 한 종류를 고르는 보기 전환이다. */
    .result-filter-block { margin-top: 2px; }
    /* 승인된 B안: 단일 결과만 변경. 폴더·비교 결과의 issuesShell은 유지한다. */
    .single-results-head { position: relative; padding: 16px 16px 0; border-bottom: 1px solid var(--line); }
    .single-result-title, .single-result-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .single-result-title h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: var(--tr-title); color: var(--text-title); }
    /* 탭이 넷(반영 확인·수정 사항·검토 상태·기준 판정)이 되면서 14px 은 패널 폭을 넘쳐
       가로 스크롤이 생겼다(2026-09-16). 13px + 12px 간격이면 넷이 한 줄에 선다. */
    .single-result-tabs { display: flex; gap: 12px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
    .single-result-tab { flex: none; min-height: 40px; padding: 8px 0 10px; border: 0;
      border-bottom: 2px solid transparent; color: var(--text-2); background: transparent;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .single-result-tab b { margin-left: 4px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    /* 미검토 경고 표식 — 검토 상태 탭 앞의 작은 삼각형. 색은 미검토 노랑(--sev-min-fg)으로 옛 띠와 같다. */
    .single-result-tab-warn { display: inline-flex; vertical-align: -2px; margin-right: 4px; color: var(--sev-min-fg); }
    .single-result-tab-warn svg { width: 14px; height: 14px; }
    .single-result-tab.has-warn b { color: var(--sev-min-fg); font-weight: 600; }
    .single-result-tab.is-active { color: var(--accent-ink); border-bottom-color: var(--accent); }
    .single-result-tab:hover { color: var(--text); }
    .single-result-tab.is-active:hover { color: var(--accent-ink); }
    .single-result-tab:focus-visible { outline-offset: -3px; }
    .single-result-tools { padding: 10px 16px; border-bottom: 1px solid var(--line); }
    /* 높이는 유지하고 양끝 여백을 늘려 결과 필터의 알약 실루엣을 살린다. */
    .single-result-tools .result-filter { padding-inline: 14px; }
    .single-result-tools .result-filter-group { gap: 6px; }
    .single-result-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
    .single-result-select { display: flex; align-items: center; gap: 6px; min-width: 0;
      color: var(--text-2); font-size: 14px; }
    .single-result-select > span { flex: none; }
    .single-result-select .sel { min-width: 0; max-width: 140px; }
    .single-result-select .sel-btn { min-height: 34px; max-width: 100%; }
    .single-result-select .sel-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .single-result-select .sel .sel-menu { min-width: 180px; }
    #singleResultChecker .sel-menu { left: 0; right: auto; }
    .single-result-select.is-filtered .sel-btn { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-weak); }
    .single-result-shown { margin-left: auto; flex: none; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
    .single-result-note { margin: 10px 16px 0; font-size: 13px; color: var(--text-2); }
    .viewer-source-error { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg);
      color: var(--text-2); font-size: 13px; }
    .single-status-card { padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--r-md);
                          background: var(--panel); }
    .single-status-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
                          gap: 6px 10px; font-size: 12px; color: var(--text-3); }
    .single-status-card p { margin: 10px 0 0; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .single-status-guidance, .single-result-empty-note { font-size: 14px; line-height: 1.6; color: var(--text); margin-top: 10px; }
    .single-result-empty { padding: 28px 4px; text-align: center; color: var(--text-2); font-size: 13px; }
    .single-result-empty p { font-size: 13px; color: var(--text-2); line-height: 1.6; }
    .single-result-empty button { margin-top: 14px; }
    /* 읽는 동안 카드가 움직이지 않는다. 선택은 테두리, 지적은 제목, 근거는 안쪽 면으로 구분한다. */
    #issuesPanel .fcard { padding: 16px; margin-bottom: 10px; border-color: var(--line);
      border-radius: var(--r-md); transform: none; box-shadow: none; }
    #issuesPanel .fcard:hover { border-color: var(--text-3); background: var(--panel); transform: none; }
    #issuesPanel .fcard.on { border-color: var(--accent); background: var(--panel); box-shadow: none; }
    #issuesPanel .fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #issuesPanel .fcard .fmsg { font-size: 14px; line-height: 1.6; font-weight: 600; overflow-wrap: anywhere; }
    #issuesPanel .finding-card-head { margin-bottom: 12px; }
    #issuesPanel .finding-confidence { font-weight: 500; color: var(--text-2); }
    #issuesPanel .finding-card-disclosure svg { display: block; width: 12px; height: 12px; }
    #issuesPanel .fcard.on .finding-card-disclosure svg { transform: rotate(180deg); }
    .single-finding-evidence { margin-top: 14px; padding: 12px; border: 1px solid var(--line-2);
      border-radius: var(--r-sm); background: var(--bg); }
    .single-evidence-label { font-size: 12px; color: var(--text-3); }
    #issuesPanel .single-finding-evidence mark { background: transparent; box-shadow: none; padding: 0; color: var(--text); }
    .single-evidence-quote { margin-top: 8px; font-size: 14px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
    .issues-head { position: relative; padding: 16px; background: var(--panel);
                   border-bottom: 1px solid var(--line); }
    .issues-count { font-size: 22px; font-weight: 700; line-height: 1.2;
                    color: var(--text); font-variant-numeric: tabular-nums; }
    .result-filter-label, .result-control-label { display: block; margin-bottom: 6px;
                                                   color: var(--text-3); font-size: 12px;
                                                   font-weight: 500; }
    .result-filter-group, .result-legend-group { display: flex; flex-wrap: wrap; gap: 6px; }
    /* 결과 보기는 한 번에 하나를 고르는 한 세트라 두 줄로 갈라지면 서로 다른
       필터 묶음처럼 읽힌다. 패널 안에서는 한 줄을 지키고 극단적으로 좁을 때만
       조용히 가로로 넘긴다. */
    .result-filter-group { flex-wrap: nowrap; gap: 4px; overflow-x: auto;
                           scrollbar-width: none; }
    .result-filter-group::-webkit-scrollbar { display: none; }
    .result-filter:focus-visible { outline-offset: -3px; }
    .result-filter, .result-legend, .result-control {
      min-height: 28px; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; margin: 0; padding: 4px 10px; border: 1px solid var(--line);
      border-radius: var(--r-sm); background: var(--panel); color: var(--text-2);
      font: inherit; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
    }
    /* 결과 종류는 목록을 통째로 바꾸는 1차 보기 전환이다. 작은 범례처럼 보이던
       28px 칩에서 공용 버튼과 같은 34px·14px 체계로 올리고, 현재 보기 하나만
       브랜드 솔리드 면으로 채운다. 정렬·검사는 아래의 조용한 보조 컨트롤로 남긴다. */
    /* 규칙 한 줄(2026-09-16): **완전 알약은 읽는 라벨, 모서리 6px 는 누르는 것.** 필터는
       누르는 것이라 각진다 — 라벨 알약과 같은 실루엣이면 어느 쪽이 눌리는지 모양으로 안 갈렸다. */
    .result-filter { min-height: 34px; flex: 0 0 auto; gap: 4px; padding: 6px 10px;
                     border-radius: var(--r-sm); font-size: 14px; font-weight: 600; }
    .result-filter { cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform var(--dur-1) var(--ease-out); }
    .result-filter i, .result-legend i { width: 7px; height: 7px; flex: none; border-radius: 50%; }
    .result-filter b, .result-legend b { color: var(--text-3); font-size: 11px;
                                        font-weight: 600; font-variant-numeric: tabular-nums; }
    .result-filter.is-active { border-color: var(--accent-surface);
                               background: var(--accent-surface); color: #fff; }
    .result-filter.is-active b { color: rgba(255,255,255,.82); }
    .result-control.is-active { border-color: rgba(var(--accent-rgb), .45);
                                background: var(--accent-weak); color: var(--accent-ink); }
    .result-filter:hover, .result-control:hover { border-color: var(--accent); }
    .result-filter.is-active:hover { border-color: var(--accent-strong);
                                     background: var(--accent-strong); }
    .result-toolbar { display: flex; flex-direction: column; gap: 8px; }
    .result-control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .result-control-label { min-width: 28px; width: auto; margin: 0 2px 0 0; }
    .result-control { min-height: 30px; padding: 4px 8px; font-size: 14px; cursor: pointer;
                      transition: border-color .15s, background .15s, color .15s; }
    .result-icon-btn { width: 30px; height: 30px; flex: none; display: inline-flex;
                       align-items: center; justify-content: center; padding: 0;
                       border: 1px solid var(--line); border-radius: var(--r-sm);
                       background: var(--panel); color: var(--text-3); cursor: pointer;
                       transition: border-color .15s, background .15s, color .15s; }
    .result-icon-btn:hover, .result-icon-btn.is-active { border-color: var(--accent);
                                                         background: var(--accent-weak);
                                                         color: var(--accent-ink); }
    /* 카드의 형광펜 번호 칩. 누르면 그 번호 위치로 문서가 움직이는 **버튼**인데,
       모양이 여느 뱃지와 같아 눌린다는 것을 알 길이 없었다 — 클릭되는 것
       ([data-act])만 hover 에서 차오르고 떠올라 버튼임을 말한다. */
    /* 형광펜 번호 — 카드의 번호표. 번호가 하나든 여럿이든 **테두리 상자 하나**로 묶는다.
       번호 칩이 분류 알약과 나란히 흩어져 있으면 태그처럼 읽혔다(2026-09-15) — 상자가
       "이건 번호 묶음"이라고 말한다. 칩 색은 원래대로(연한 파랑). */
    /* 번호 칩은 처음 모양 그대로 — 연한 파란 면에 파란 숫자(2026-09-16 결정). 면이 있어야
       누르는 것으로 보인다. 글자·밑줄·상자를 다 써 봤지만 이게 제일 분명했다. */
    .nchips { display: inline-flex; align-items: center; gap: 4px; margin-right: 2px; }
    .nchip { display: inline-flex; align-items: center; font-variant-numeric: tabular-nums;
             font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: var(--r-sm);
             background: var(--accent-weak); color: var(--accent-ink); }
    /* 형광펜을 못 얹은 인용의 자리 — 번호 대신 "후보 N곳 / 위치 못 찾음". 점선 테두리라
       번호 칩과 안 헷갈린다. 눌러서 후보 자리로 간다. */
    .nchip-miss { background: transparent; color: var(--text-3); border: 1px dashed var(--line-2); }
    .nchip[data-act] { cursor: pointer;
                       transition: background .15s var(--ease-out), color .15s var(--ease-out),
                                   transform .15s var(--ease-out); }
    @media (hover: hover) and (pointer: fine) {
      .nchip[data-act]:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
    }
    .nchip[data-act]:active { background: var(--accent); color: #fff; transform: translateY(0); }
    /* 지적 문장. 정상은 한두 문장이고 그래서 600 이 맞다 — 카드에서 제일 먼저
       읽히는 줄이다. 그런데 모델이 판단 과정을 통째로 쏟을 때가 있다(실제로
       "그러나/하지만/반면" 으로 결론을 네 번 뒤집는 15문장짜리가 나왔다).
       그걸 반굵은 글씨로 전부 펼치면 목록이 무너지고, 옆 카드들이 안 보인다.
       **자르지 않고 접는다** — 접힌 카드는 세 줄만, 누르면 전문이 문단으로
       읽힌다(그래서 펼친 쪽은 500 이다. 문단을 600 으로 두면 눈이 쉴 데가 없다).
       코드로 지우지 않는 이유: 인용이 검증된 진짜 지적일 수 있고, 결론이 뒤에
       올 때가 있어 앞을 자르면 결론이 날아간다. 길이는 화면이 다루고, 길이가
       나오는 원인은 프롬프트가 다룬다(agent_quality/consistency.py). */
    .fmsg { font-size: 14px; line-height: 1.6; color: var(--text); font-weight: 600; }
    .fcard:not(.on) .fmsg { display: -webkit-box; -webkit-box-orient: vertical;
                            -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
    .fcard.on .fmsg { font-weight: 500; }

    /* 카드 안의 텍스트 버튼(수정안 만들기·복사). 테두리가 없어 눌리는 것인지
       읽기 어려우므로 hover 로 눌림을 알린다. */
    .linkbtn { min-height: 28px; font-size: 12px; font-weight: 600; color: var(--text-2);
               background: var(--panel); border: 1px solid var(--line); cursor: pointer;
               padding: 6px 10px; border-radius: var(--r-sm);
               transition: border-color .15s, background .15s, color .15s; }
    .linkbtn:hover { border-color: var(--accent); background: var(--state-hover-brand);
                     color: var(--accent-ink); }
    .linkbtn:active { transform: translateY(1px); }
    .hover-accent { transition: color .2s; }
    .hover-accent:hover { color: var(--accent-ink) !important; }

    /* PDF 뷰어 도구줄 — 조용한 아이콘 버튼(2026-09-08). 테두리·면 없음, 회색.
       올리면 옅은 회색 면. **켜진 것만** 메인색(aria-pressed). 버튼 두 옷과 다른
       종류다: 도구는 문서 위에 떠 있는 것이라 눈에 안 띄어야 맞다. */
    .viewer-tool { height: 28px; min-width: 28px; padding: 0 8px; display: inline-flex; align-items: center;
                   justify-content: center; gap: 6px; border: 0; border-radius: var(--r-sm);
                   background: transparent; color: var(--text-3); font: inherit; font-size: 12px;
                   font-weight: 600; cursor: pointer;
                   transition: background .15s var(--ease-out), color .15s var(--ease-out),
                               transform .1s var(--ease-out); }
    .viewer-tool svg { width: 14px; height: 14px; }
    .viewer-tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .viewer-tool[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-weak); }
    .viewer-tool-group { display: inline-flex; align-items: center; background: var(--bg);
                         border-radius: var(--r-sm); }
    .viewer-tool-group .viewer-tool { min-width: 26px; padding: 0 6px; }
    .viewer-tool-group #pdf-zoom { min-width: 48px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .viewer-where { flex: none; font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
    .viewer-side-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
    @media (hover: hover) and (pointer: fine) {
      .viewer-tool:hover { background: var(--state-hover-neutral); color: var(--text); }
      .viewer-tool[aria-pressed="true"]:hover { background: var(--accent-weak); color: var(--accent-ink); }
    }
    /* hover 와 active 가 동시에 걸리므로 active 를 뒤에 둔다. */
    .viewer-tool:active { transform: translateY(1px); }

    /* 내려받기 드롭다운. 예전엔 항목마다 색이 달라(accent/text-2/text-3) 무엇이
       더 중요한지가 아니라 그냥 들쭉날쭉해 보였고, hover 도 없어 눌리는지 몰랐다.
       색은 하나로 두고, 강조는 아이콘 칩으로만 준다. */
    .mi { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
          font-size: 14px; font-weight: 600; color: var(--text); background: none;
          border: none; cursor: pointer; text-align: left; transition: background .15s; }
    .mi:hover:not(:disabled) { background: var(--state-hover-neutral); }
    .mi:disabled { opacity: .55; cursor: default; }
    /* 아이콘 칩 — 여기만 브랜드색을 쓴다. 어느 항목이 '문서'인지 눈으로 구분된다. */
    .mi-ico { flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex;
              align-items: center; justify-content: center;
              background: var(--accent-weak); color: var(--accent-ink); }
    .mi-sub { font-size: 13px; font-weight: 500; color: var(--text-2); margin-top: 2px; }
    /* 하단 데이터 포맷(JSON·MD·CSV)은 부가 항목이라 한 단계 작게. */
    .mi-mini { flex: 1; padding: 10px 8px; font-size: 14px; font-weight: 600;
               color: var(--text-2); background: none; border: none; cursor: pointer;
               border-radius: var(--r-sm); transition: background .15s, color .15s; }
    .mi-mini:hover { background: var(--state-hover-neutral); color: var(--text); }

    /* 접힌 "검토 결과" 레일. 예전엔 400px 패널의 카드 스타일을 그대로 48px 로
       줄여 써서, 카드 껍데기(사방 둥근 모서리·큰 그림자)만 남아 찌그러진
       카드처럼 보였다. 오른쪽 가장자리에 붙은 탭으로 두면 "패널이 밀려나
       있다"로 읽힌다. */
    .rail { width: 44px; flex: none; cursor: pointer;
            background: var(--panel); border: 1px solid var(--line); border-right: none;
            border-radius: var(--r-md) 0 0 var(--r-md); box-shadow: -4px 0 16px rgba(0,0,0,.05);
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 14px 0; overflow: hidden; transition: background .15s; }
    .rail:hover { background: var(--state-hover-neutral); }
    .rail:hover .rail-ico { color: var(--accent-ink); border-color: var(--accent); }
    .rail-ico { flex: none; width: 26px; height: 26px; display: flex; align-items: center;
                justify-content: center; border: 1px solid var(--line);
                border-radius: 50%; color: var(--text-3);
                transition: color .15s, border-color .15s; }
    /* 세로쓰기에서 text-orientation 기본값(mixed)은 한글만 바로 세우고 숫자·라틴은
       90도 눕힌다. 그래서 "검토 결과 16건"의 16만 옆으로 누워 읽기 어색했다.
       upright 로 두면 숫자도 바로 선다. */
    .rail-label { writing-mode: vertical-rl; text-orientation: upright;
                  font-weight: 700; font-size: 13px;
                  color: var(--text-2); letter-spacing: var(--tr-caps); }

    /* 도움말 문서(introDoc) — 한 열, 제목·본문·그림뿐. 가운데 모달에 들어간다. */
    .idoc { font-size: 14px; line-height: 1.6; color: var(--text); }
    /* 절 — 굵은 구분선 + 머리(아이콘 원 · 제목 · 한 줄). 제목 글자만 굵던 때는 절이 어디서 갈리는지 안 보였다(2026-09-18). */
    .idoc-sec { padding: 24px 0 8px; border-top: 1px solid var(--line); scroll-margin-top: 8px; }
    .idoc-sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .idoc-sec-ico { flex: none; display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center;
                    border-radius: 50%; background: var(--accent-weak); color: var(--accent-ink); font-size: 15px; }
    .idoc-sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
    .idoc-sec-head > div > span { display: block; font-size: 12px; color: var(--text-3); }   /* 아이콘 원(span)은 제외 */
    .idoc p { margin: 0 0 12px; color: var(--text-2); }
    /* 차례 — 절 이름 칩. 누르는 것이라 각진다. */
    .idoc-toc { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 20px; }
    .idoc-toc button { font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-sm);
                       border: 1px solid var(--line); background: var(--panel); color: var(--text-2); cursor: pointer;
                       transition: border-color .2s var(--ease-out), color .2s var(--ease-out), background .2s var(--ease-out); }
    .idoc-toc button:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--state-hover-brand); }
    /* 검토 넷 · 원칙 셋 — 작은 카드 격자 */
    .idoc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .idoc-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .idoc-card { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); }
    .idoc-card b { display: block; font-size: 14px; }
    .idoc-card span:last-child { display: block; font-size: 13px; color: var(--text-2); }
    .idoc-card.is-not { background: var(--bg); border-color: transparent; }
    .idoc-ico { flex: none; display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center;
                border-radius: 50%; background: var(--accent-weak); color: var(--accent-ink); font-size: 14px; }
    @media (max-width: 720px) { .idoc-grid, .idoc-grid-3 { grid-template-columns: 1fr; } }
    .idoc-lead { display: flex; gap: 16px; align-items: center; padding: 4px 0 20px; margin-bottom: 8px;
                 border-bottom: 1px solid var(--line); }
    .idoc-lead img { width: 64px; height: 64px; object-fit: contain; flex: none; }
    .idoc-lead b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.4; margin-bottom: 6px; color: var(--text-title); }
    .idoc-lead span { display: block; font-size: 13px; line-height: 1.6; color: var(--text-2); }
    .idoc-list { margin: 0 0 12px; padding-left: 20px; color: var(--text-2); }
    .idoc-list li { margin-bottom: 6px; }
    .idoc-list b { color: var(--text); }
    .idoc-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .idoc-step { display: flex; gap: 12px; align-items: flex-start; }

                   font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .idoc-step b { display: block; font-size: 14px; }
    .idoc-step > div > span { display: block; color: var(--text-2); }   /* 번호 원(span)은 제외 */
    .idoc-figure { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
    /* 도움말의 연결 그림 — 상자 넷을 화살표로 잇는다. 색은 알약 규칙대로 작은 면에만. */
    .idoc-flow { display: flex; align-items: stretch; gap: 0; margin: 0 0 12px; overflow-x: auto; }
    .idoc-flow-box { flex: 1 1 0; min-width: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md);
                     background: var(--panel); display: flex; flex-direction: column; gap: 2px; position: relative; }
    .idoc-flow-box + .idoc-flow-box { margin-left: 22px; }
    .idoc-flow-box + .idoc-flow-box::before { content: "→"; position: absolute; left: -18px; top: 50%; transform: translateY(-50%);
                                              color: var(--text-3); font-size: 14px; }
    .idoc-flow-box b { font-size: 13px; font-weight: 700; }
    .idoc-flow-box span { font-size: 12px; color: var(--text-2); line-height: 1.4; }
    .idoc-flow-box em { font-style: normal; font-weight: 700; color: var(--sev-min-fg); background: var(--sev-min-bg); padding: 0 4px; border-radius: 4px; }
    .idoc-flow-box.is-doc { border-color: var(--accent); }

    @media (max-width: 720px) { .idoc-flow { flex-direction: column; } .idoc-flow-box + .idoc-flow-box { margin: 18px 0 0; }
      .idoc-flow-box + .idoc-flow-box::before { content: "↓"; left: 50%; top: -18px; transform: translateX(-50%); } }
    .idoc-figure-label { font-size: 12px; font-weight: 600; color: var(--text-3); margin-top: 6px; }
    .idoc-figure .fcard { margin: 0; cursor: default; }
    .idoc-dl { display: grid; grid-template-columns: 72px 1fr; gap: 8px 12px; margin: 0; padding: 14px 16px; background: var(--bg); border-radius: var(--r-md); }
    .idoc-dl dt { font-weight: 600; }
    .idoc-dl dd { margin: 0; color: var(--text-2); }
    .intro-paper { padding: 14px 16px 14px 44px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel);
                   font-size: 13px; line-height: 1.6; color: var(--text); }
    .intro-paper-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-weight: 700; font-size: 14px; }
    .intro-paper-head span { color: var(--accent-ink); font-size: 12px; }
    .intro-paper-head small { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-3); }
    .intro-paper p { margin: 0 0 4px; position: relative; color: var(--text); }
    .intro-paper-no { position: absolute; left: -28px; top: 2px; width: 18px; height: 18px; border-radius: 50%;
                      background: var(--sev-info-solid); color: #fff; font-size: 11px; font-weight: 600;
                      display: inline-flex; align-items: center; justify-content: center; }
    .intro-mock-quote { margin-top: 8px; font-size: 13px; line-height: 1.6; }
    /* 도움말 시트 — 오른쪽에서. 하던 화면은 뒤에 흐리게 남는다. */
    /* 도움말은 가운데 문서 모달 — 아래에서 스르륵 올라오며 나타나고(280ms), 닫을 땐 빨리 내려간다(160ms).
       옆 시트는 "새 창이 그냥 뜬다"로 읽혔다(2026-09-16). 막은 프로필 설정 모달과 같은 문법(어둡게 + 흐림). */
    .help-backdrop { position: fixed; inset: 0; z-index: 990; background: rgba(0,0,0,.28); backdrop-filter: blur(6px);
                     animation: helpFade var(--dur-3) var(--ease-out); }
    .help-sheet { position: fixed; left: 50%; top: 50%; z-index: 991; width: 720px; max-width: calc(100vw - 32px);
                  max-height: calc(100vh - 64px); display: flex; flex-direction: column; background: var(--panel);
                  border-radius: var(--r-lg); box-shadow: var(--sh-3); transform: translate(-50%, -50%);
                  animation: helpIn var(--dur-3) var(--ease-out); }
    .help-sheet.is-closing { animation: helpOut var(--dur-1) var(--ease-out) forwards; }
    .help-backdrop.is-closing { animation: helpFade var(--dur-1) var(--ease-out) reverse forwards; }
    @keyframes helpIn { from { transform: translate(-50%, calc(-50% + 24px)) scale(.98); opacity: 0; }
                        to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes helpOut { from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                         to { transform: translate(-50%, calc(-50% + 16px)) scale(.98); opacity: 0; } }
    @keyframes helpFade { from { opacity: 0; } to { opacity: 1; } }
    .help-sheet-head { border-radius: var(--r-lg) var(--r-lg) 0 0; }
    .help-sheet-head { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px 0 24px;
                       border-bottom: 1px solid var(--line); font-size: 15px; }
    .help-sheet-head b { flex: 1; }
    .help-sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 32px; }

    /* 어시스턴트 — DoSuree 의 얼굴. 참고: brand/source/reference/chat1·2·3.png.
       모서리는 토큰(--r-sm/md/xl)과 알약(999px)만, 글자·행간·자간은 사다리 토큰만 쓴다. */
    .assistant-app { height: 100vh; background: var(--bg); }
    /* 접힘 = 52px 레일(chat4.png). 펼친 내용과 레일이 겹쳐 있고 폭·투명도만 오간다. */
    .assistant-side { position: relative; width: 280px; flex: none; overflow: hidden;
                      background: var(--panel); border-right: 1px solid var(--line);
                      transition: width .24s var(--ease-out); }
    .assistant-side-full { position: absolute; inset: 0; width: 280px; display: flex; flex-direction: column; gap: 6px;
                           padding: 0 16px 16px; transition: opacity .18s var(--ease-out); }
    .assistant-rail { position: absolute; inset: 0; width: 52px; display: flex; flex-direction: column; align-items: center;
                      gap: 4px; padding: 10px 0 16px; opacity: 0; pointer-events: none; transition: opacity .18s var(--ease-out); }
    .side-collapsed .assistant-side { width: 52px; }
    .side-collapsed .assistant-side-full { opacity: 0; pointer-events: none; }
    .side-collapsed .assistant-rail { opacity: 1; pointer-events: auto; }
    .assistant-rail-btn { width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--r-md); background: transparent;
                          color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .assistant-rail-btn:hover { background: var(--bg); color: var(--text); }
    .assistant-rail-foot { margin-top: auto; }
    .assistant-rail-foot .chat-avatar { width: 28px; height: 28px; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { .assistant-side, .assistant-side-full, .assistant-rail { transition: none; } }
    /* 워드마크 줄은 DocSuree 사이드바와 같은 60px. 그 아래 새 대화 버튼까지는 붙인다 — 사이 여백이 뜨면
       버튼이 따로 노는 것처럼 보였다(2026-09-14). */
    .assistant-top { height: 52px; min-height: 52px; display: flex; align-items: center; justify-content: space-between;
                     gap: 8px; padding: 0 2px 0 6px; }
    .assistant-side-toggle { flex: none; }
    .assistant-back { gap: 4px; margin-left: 8px; }
    .assistant-help { margin-left: 8px; }
    .assistant-side-top { padding: 0; }
    .assistant-new { width: 100%; }   /* 명령 버튼 — 알약 아님(읽는 라벨만 알약) */
    .assistant-list-head { font-size: 11px; font-weight: 600; letter-spacing: var(--tr-caps); color: var(--text-3);
                           padding: 6px 6px 0; }
    .assistant-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .assistant-group { font-size: 11px; color: var(--text-3); padding: 12px 6px 4px; }
    .assistant-group:first-child { padding-top: 2px; }
    .assistant-item { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
                      border-radius: var(--r-md); cursor: pointer; color: var(--text); }
    .assistant-item:hover { background: var(--bg); }
    .assistant-item.on { background: var(--accent-weak); color: var(--accent-ink); }
    .assistant-item.missing { opacity: .55; }
    .assistant-item-ico { flex: none; display: flex; color: var(--text-3); }
    .assistant-item.on .assistant-item-ico { color: var(--accent-ink); }
    .assistant-item-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; overflow: hidden;
                            text-overflow: ellipsis; white-space: nowrap; }
    .assistant-item-actions { display: none; flex: none; gap: 2px; }
    .assistant-item:hover .assistant-item-actions, .assistant-item.on .assistant-item-actions { display: flex; }
    .assistant-item-btn { width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--r-sm); background: transparent;
                          color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .assistant-item-btn:hover { background: var(--panel); color: var(--text); }
    .assistant-item-btn svg { width: 14px; height: 14px; }
    .assistant-empty { font-size: 13px; color: var(--text-2); padding: 10px 6px; }
    .assistant-side-foot { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
    .assistant-foot-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line);
                          border-radius: 999px; font-size: 13px; color: var(--text); background: var(--panel); }
    .assistant-foot-row .chat-avatar { width: 24px; height: 24px; font-size: 12px; }
    /* 입력창은 대화 위에 **떠 있다**(ChatGPT 식). 대화가 입력창 뒤로 지나가고, 입력창 위쪽은
       배경색으로 서서히 가려진다. 대화 창 아래 여백(--composer-h)은 app.js 가 입력창 높이에
       맞춰 준다 — 여러 줄 입력해도 마지막 말이 가려지지 않게(2026-09-16). */
    .assistant-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg);
                          position: relative; --composer-h: 112px; }
    .assistant-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                      min-height: 52px; padding: 8px 24px 0; }
    .assistant-head-title { min-width: 0; font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden;
                            text-overflow: ellipsis; white-space: nowrap; }
    .assistant-head-ctx { display: flex; align-items: center; gap: 8px; flex: none; font-size: 13px; color: var(--text-2); }
    .assistant-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
                      background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 500;
                      max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assistant-chip svg { width: 14px; height: 14px; flex: none; }
    .doc-ctx-pair b { font-size: 11px; font-weight: 600; letter-spacing: var(--tr-caps); color: var(--text-3); margin: 0 4px 0 8px; }
    .doc-ctx-pair b:first-child { margin-left: 0; }
    .assistant-chip-open { margin-left: 4px; padding: 0 2px; border: 0; background: none; color: var(--accent-ink);
                           font: inherit; font-size: 12px; font-weight: 600; text-decoration: underline;
                           text-underline-offset: 2px; cursor: pointer; }
    .assistant-ctx-note { color: var(--text-3); }
    .assistant-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; max-width: 720px; }
    .assistant-card { width: 160px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-md);
                      background: var(--panel); cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: inherit; }
    .assistant-card:hover { border-color: var(--accent); }
    .assistant-card strong { font-size: 13px; font-weight: 600; color: var(--text); }
    .assistant-card span { font-size: 12px; color: var(--text-3); line-height: 1.4; }
    /* 대화 — 말풍선 둘(chat3.png). 사람은 오른쪽 짙은 풍선, 답은 왼쪽 연한 풍선. */
    /* 대화 창의 아래 끝은 입력 상자의 **한가운데**다(margin). 말풍선은 거기까지만 뒤로 지나가고 그
       아래로는 못 내려간다 — 반투명·그라데이션이 아니라 그냥 막는다(2026-09-16). 맨 아래로 내리면
       마지막 말이 상자 위에 서도록 안쪽 여백(padding)은 나머지 반절 + 여유. */
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px calc(var(--composer-h) / 2 + 12px);
                margin-bottom: calc(var(--composer-h) / 2); display: flex; flex-direction: column; gap: 16px; }
    .chat-empty { margin: auto; text-align: center; padding: 24px; display: flex; flex-direction: column; align-items: center; }
    /* 마스코트는 원 안에 가두지 않는다 — 투명 PNG 라 흰 면·테두리가 오히려 배지처럼 보였다. */
    .chat-hello-mascot { width: 104px; height: 104px; margin-bottom: 12px; object-fit: contain; }
    .chat-hello { font-size: 28px; font-weight: 800; color: var(--text-title); }  /* 28px 대표 제목 — .headline 과 같은 굵기·잉크 */
    /* 문맥 문서 — 인사 위에 문서 이름 알약. 헤더 칩과 같은 모양이되 한 단계 크다. */
    .chat-hello-doc { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 8px 16px;
                      border-radius: 999px; background: var(--accent-weak); color: var(--accent-ink);
                      font-size: 14px; font-weight: 600; max-width: 560px; }
    .chat-hello-doc svg { flex: none; }
    .chat-hello-doc .doc-ctx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 문서 쌍 — 상위 위, 하위 아래로 쌓는다. 각 이름이 한 줄을 다 써서 안 잘린다. */
    .doc-pair { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .doc-pair-doc { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; line-height: 1.4; }
    .doc-pair-doc b { flex: none; width: 24px; font-size: 11px; font-weight: 600; letter-spacing: var(--tr-caps); opacity: .7; }
    .doc-pair-doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assistant-chip .doc-pair { font-size: 12px; }
    .chat-hello-doc .doc-pair { font-size: 13px; }
    .chat-hello-doc:has(.doc-pair) { border-radius: var(--r-md); text-align: left; }
    .chat-hello-doc .doc-pair-doc b { color: var(--accent-ink); }
    .chat-hello-sub { margin-top: 8px; font-size: 14px; color: var(--text-3); line-height: 1.6; }
    .chat-opening .chat-hello-sub { display: inline-flex; align-items: center; gap: 8px; }
    .chat-opening-spin { display: inline-flex; animation: spin 1.4s linear infinite; }
    .chat-row { display: flex; width: 100%; max-width: 768px; margin: 0 auto; }
    .chat-row-user { justify-content: flex-end; }
    .chat-bubble { font-size: 15px; line-height: 1.6; padding: 12px 16px; border-radius: var(--r-xl); overflow-wrap: anywhere; }
    .chat-bubble-user { max-width: 72%; background: var(--accent-surface); color: #fff; white-space: pre-wrap; font-weight: 500;
                        border-bottom-right-radius: var(--r-sm); }
    .chat-bubble-bot { max-width: 88%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
                       border-bottom-left-radius: var(--r-sm); }
    .chat-avatar { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-weak); color: var(--accent-ink);
                   font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .chat-tool { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .chat-tool-n { color: var(--text-3); opacity: .8; }
    .chat-tool + .chat-md, .chat-tool + .chat-thinking { margin-top: 8px; }
    .chat-thinking { color: var(--text-3); }
    .chat-error { font-size: 13px; color: var(--accent-ink); }
    .chat-actions { display: flex; gap: 4px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line-2); }
    .chat-action { font: inherit; font-size: 12px; color: var(--text-3); background: transparent; border: 0; padding: 2px 6px;
                   border-radius: var(--r-sm); cursor: pointer; }
    .chat-action:hover { color: var(--accent-ink); background: var(--bg); }
    .chat-md > :first-child { margin-top: 0; }
    .chat-md p, .chat-md ul, .chat-md ol, .chat-md blockquote, .chat-md pre, .chat-md table { margin: 0 0 12px; }
    .chat-md h3, .chat-md h4, .chat-md h5 { margin: 16px 0 8px; font-weight: 700; color: var(--text); }
    .chat-md h3 { font-size: 18px; } .chat-md h4 { font-size: 15px; } .chat-md h5 { font-size: 14px; }
    .chat-md ul, .chat-md ol { padding-left: 22px; }
    .chat-md li { margin: 4px 0; }
    /* 코드·코드 블록도 앱 글꼴을 쓴다. 이 앱은 어디에도 고정폭 글꼴이 없는데(.mono 는
       숫자 폭만 맞춘다) 대화만 브라우저 기본 고정폭(Courier)으로 떠서 다른 앱처럼 보였다
       (2026-09-16 지적). 상자와 배경으로만 코드임을 구분한다. */
    .chat-md code { font-family: inherit; font-variant-numeric: tabular-nums; font-size: 13px; padding: 2px 6px;
                    border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--line-2); }
    .chat-md pre { font-family: inherit; font-variant-numeric: tabular-nums; font-size: 13px; line-height: 1.6;
                   padding: 12px 14px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line-2);
                   overflow-x: auto; white-space: pre-wrap; }
    .chat-md pre code { padding: 0; border: 0; background: transparent; }
    .chat-md blockquote { padding: 8px 14px; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--line-2);
                          color: var(--text-2); }
    .chat-md table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--panel); }
    .chat-md th, .chat-md td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .chat-md th { background: var(--bg); font-weight: 600; }
    .chat-md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .chat-composer { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; max-width: 768px; margin: 0 auto;
                     box-sizing: border-box; padding: 0 24px 20px; }

    .chat-composer-box { display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 10px 18px;
                         border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--panel); box-shadow: var(--sh-3); }
    .chat-composer textarea { width: 100%; box-sizing: border-box; resize: none; border: 0; outline: 0; background: transparent;
                              font: inherit; font-size: 15px; line-height: 1.6; color: var(--text); max-height: 200px; padding: 0; }
    .chat-composer-row { display: flex; align-items: center; gap: 8px; }
    .chat-hint { flex: 1; min-width: 0; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 보내기는 참고 화면(chat1)의 큼직한 둥근 버튼 — 입력창 높이에 맞춘 44px, 종이비행기. */
    .chat-send { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; flex: none;
                 display: flex; align-items: center; justify-content: center; box-shadow: var(--sh-2, none);
                 transition: transform .15s var(--ease-out), background .15s; }
    .chat-send:hover:not(:disabled) { transform: translateY(-1px); }
    .chat-send:disabled { opacity: .45; box-shadow: none; }
    .chat-send svg { width: 22px; height: 22px; }

    /* step tabs — active gets a 2px underline.
       탭은 지금 보는 섹션의 제목이기도 하다. 13px·600(활성)은 카드 본문(14px·600)
       보다 약해 제목으로 안 읽혔다 — 굵기 사다리(무게는 크기와 같은 방향)를
       지키며 세우려면 크기부터 올린다: 14px, 활성만 700. */
    .tab { position: relative; font-size: 14px; font-weight: 500; color: var(--text-2); padding: 6px 2px; cursor: pointer;
           border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    .tab:hover { color: var(--text-2); }
    .tab.on { color: var(--accent-ink); font-weight: 700; border-bottom-color: var(--accent-ink); }

    /* interactive card (checklist, compare docs) */
    .pick { cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
    .pick:hover { border-color: var(--accent-ink); box-shadow: var(--sh-2); }

    /* table row */
    .row { cursor: pointer; transition: background .15s; }
    .row:hover { background: var(--state-hover-neutral); }

    /* 폴더 검토의 필드 대조 행. 행 전체가 상세를 여는 손잡이라 hover도 행 전체에
       준다. 펼친 상세는 옅은 하늘색 면으로 묶어, 단순히 다음 행이 이어진 것으로
       보이지 않게 한다. 세로 강조선은 내용보다 먼저 보여 쓰지 않는다. */
    .case-matrix-row { display: flex; align-items: center; cursor: pointer;
                       border-top: 1px solid var(--line-2);
                       transition: background .15s var(--ease-out); }
    .case-matrix-row:focus-visible { outline: 2px solid var(--accent);
                                     outline-offset: -2px; }
    .case-matrix-row.is-open { background: var(--panel); }
    /* 여닫이 표시는 선형 체브런(SVG)이다 — 유니코드 ▸ 는 앱 아이콘과 다른
       세 번째 어휘였다. 열리면 오른쪽 → 아래로 돈다. */
    .case-matrix-disclosure { flex: none; display: inline-flex; color: var(--text-3); }
    .case-matrix-disclosure svg { transition: transform .15s var(--ease-out); }
    .case-matrix-row.is-open .case-matrix-disclosure { color: var(--accent-ink); }
    .case-matrix-row.is-open .case-matrix-disclosure svg { transform: rotate(90deg); }
    @media (hover: hover) and (pointer: fine) {
      .case-matrix-row:hover { background: var(--state-hover-neutral); }
      .case-matrix-row.is-open:hover { background: var(--state-hover-neutral); }
    }
    .case-matrix-detail { margin: 4px 10px 10px; padding: 10px 14px 12px 22px;
                          border: 1px solid var(--line-2);
                          border-radius: var(--r-md);
                          background: var(--accent-weak); font-size: 12px;
                          color: var(--text-2); }
    .case-matrix-detail-head { display: flex; align-items: center; gap: 8px;
                               margin-bottom: 6px; }
    .case-matrix-detail-title { flex: none; font-size: 14px; font-weight: 700;
                                color: var(--text); }
    .case-matrix-detail-reason { min-width: 0; font-size: 13px; line-height: 1.4;
                                 color: var(--text-2); }

    /* small toggle chips */
    .chip { cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .chip:hover { filter: brightness(.985); }

    /* 검토 기준 화면(공통·팀별 층). 접두사가 .crit- 가 아니라 .clay- 인 이유는
       홈의 기준 타일이 이미 .crit-note · .crit-scope 를 쓰고 있어서다 — 같은
       이름을 다시 정의하면 나중 규칙이 이겨 홈 타일의 흰 글씨가 조용히 죽는다.
       (state.clayers 에서 따왔다.)

       예전엔 인라인 스타일뿐이라 hover 가 하나도 없었고, 여닫힘을 "펼치기 ▼"
       라는 **글자로** 적어 뒀다 — 눌리는 줄인지 읽는 줄인지 구별할 길이 없었다.
       상태는 클래스로, 신호는 면과 회전으로 준다(.fcard·.hrow 와 같은 계약). */

    /* 기준 카탈로그. 기존의 큰 카드 묶음을 버리고 검색·필터·기준 세트·세부
       항목을 하나의 데이터 도구 표면으로 묶는다. */
    .criteria-browser { display: flex; flex-direction: column; gap: 10px; }
    .criteria-tools { display: flex; align-items: center; justify-content: space-between;
                      gap: 10px; }
    .criteria-search { flex: 1; max-width: 420px; min-height: 38px; display: flex;
                       align-items: center; gap: 8px; padding: 0 10px;
                       border: 1px solid var(--line); border-radius: var(--r-sm);
                       background: var(--panel); color: var(--text-3); }
    .criteria-search:focus-within { border-color: var(--accent);
                                    box-shadow: 0 0 0 3px var(--accent-weak); }
    .criteria-search svg { flex: none; width: 16px; height: 16px; }
    .criteria-search input { flex: 1; min-width: 0; border: 0; outline: 0;
                             background: transparent; color: var(--text);
                             font: inherit; font-size: 14px; }
    .criteria-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
                        justify-content: flex-end; }
    .criteria-query-result { padding: 2px 2px 0; color: var(--text-3); font-size: 12px; }
    .criteria-query-result b { color: var(--text); font-weight: 700; }
    /* 승인된 기준 작업대: 하나의 목록과 읽기 전용 상세. 입력은 부분 갱신 밖에 둔다. */
    .criteria-workspace { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); }
    .criteria-workspace-tools { flex-wrap: wrap; }
    .criteria-scope-tabs button { font-size: 14px; }
    .criteria-list-tools { flex-wrap: wrap; }
    .criteria-workspace-filters { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .criteria-how-select .sel-btn { min-height: 40px; min-width: 176px; }
    .criteria-workspace-filters .criteria-how-select .sel-menu { min-width: 208px; }
    .criteria-workspace-body { display: grid; grid-template-columns: minmax(0, 1fr) 350px; }
    .criteria-catalog-records { min-width: 0; }
    .criteria-list-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--text-3); }
    .criteria-list-meta button, .criteria-detail-label button { background: transparent; border: 0; padding: 0;
      font: inherit; color: var(--accent-ink); cursor: pointer; }
    /* 부록 B 초안 표. 엑셀과 같은 열이라 항목 원문과 코멘트가 넓어야 한다 —
       나머지 열은 내용에 맞춰 좁게 둔다. 색은 셀 안 알약이 진다. */
    /* 체크리스트 검토 시트 고르기 — 엑셀 통(sheet-book): 위에 고른 시트의 앞 몇 행 격자,
       아래 엑셀 하단 탭. 고른 탭은 격자와 같은 면으로 이어져 "이 시트를 보고 있다"가 읽힌다. */
    .sheet-book { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--panel); }
    .sheet-peek-scroll { overflow: auto; max-height: 240px; }
    .sheet-peek { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px; }
    .sheet-peek th, .sheet-peek td { border: 1px solid var(--line-2); padding: 6px 10px; text-align: left;
      vertical-align: top; line-height: 1.4; color: var(--text); white-space: nowrap; }
    /* 머리행은 스크롤해도 고정. --neutral-weak 는 반투명이라 그대로 깔면 아래 행이 비친다 —
       판 색 위에 한 겹 더 얹어 불투명하게. 접힌 테두리는 sticky 에서 사라지므로 그림자로 선을 긋는다. */
    .sheet-peek th { background: linear-gradient(var(--neutral-weak), var(--neutral-weak)), var(--panel);
      font-weight: 600; color: var(--text-2); position: sticky; top: 0; z-index: 1;
      box-shadow: inset 0 -1px 0 var(--line-2), inset -1px 0 0 var(--line-2); }
    .sheet-peek td:last-child { white-space: normal; min-width: 320px; overflow-wrap: anywhere; }
    .sheet-peek .sheet-peek-no { width: 28px; text-align: center; color: var(--text-3);
      background: linear-gradient(var(--neutral-weak), var(--neutral-weak)), var(--panel);
      font-variant-numeric: tabular-nums; }
    .sheet-peek .sheet-peek-blank { background: var(--panel); }
    .sheet-peek-empty { padding: 28px 16px; font-size: 13px; color: var(--text-3); text-align: center; }
    .sheet-peek-band { padding: 6px 12px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--line);
      background: var(--panel); }
    .sheet-peek-band.is-dead { color: var(--text-3); }
    .sheet-tabs { display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; border-top: 1px solid var(--line);
      background: var(--neutral-weak); }
    .sheet-tab { flex: none; appearance: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--text-2);
      padding: 6px 12px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-sm) var(--r-sm);
      background: var(--panel-2, var(--bg)); cursor: pointer; white-space: nowrap; }
    .sheet-tab.is-on { background: var(--panel); color: var(--text); border-color: var(--accent); border-top: 2px solid var(--accent); margin-top: -1px; }
    .sheet-tab.is-dead { color: var(--text-3); cursor: not-allowed; text-decoration: line-through; opacity: .7; }
    .sheet-tab.is-skel { width: 88px; height: 26px; background: var(--neutral-weak); border-color: transparent; cursor: default; }
    .sheet-book.is-busy .sheet-peek td { border-color: transparent; }
    .sheet-tab:not(.is-on):not(.is-dead):hover { background: var(--state-hover-neutral, var(--panel)); }
    /* 체크리스트 검토 진행 — 작성중 종이. 단계 목록은 다른 검토와 같은
       .progress-stage-row(timelineItem)로 넘어갔다. 여기 있던 .eval-stage* 띠와
       eval-pulse 는 그때 쓰는 곳이 사라졌는데 CSS 만 남아 있었다(2026-09-18 삭제). */
    .draft-skel { display: block; height: 8px; border-radius: 4px; background: var(--neutral-weak); }
    /* 작성중 종이: 부록 B 표 꼴. 끝난 행은 잉크가 다 차고 체크, 지금 행은 커서가 깜빡이며 잉크가 자란다 */
    .draft-paper { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-2);
      padding: 4px 0; font-size: 12px; overflow: hidden; }
    .draft-paper-head, .draft-row { display: grid; grid-template-columns: 36px 1fr 1.4fr; align-items: center; gap: 12px;
      padding: 8px 14px; border-bottom: 1px solid var(--line-2); }
    .draft-paper-head { font-weight: 600; color: var(--text-2); background: var(--neutral-weak); }
    .draft-row:last-child { border-bottom: 0; }
    .draft-cell { min-width: 0; }
    .draft-id { color: var(--text-3); font-variant-numeric: tabular-nums; }
    .draft-comment { position: relative; display: flex; align-items: center; gap: 8px; }
    .draft-ink { display: block; height: 8px; border-radius: 4px; background: var(--accent); width: 0; flex: none; }
    .draft-mark { color: var(--band-good-fg); font-weight: 700; opacity: 0; }
    .draft-row.is-done .draft-ink { width: 82%; background: var(--text-2); opacity: .55; }
    .draft-row.is-done .draft-mark { opacity: 1; }
    .draft-row.is-now { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .draft-row.is-now .draft-ink { animation: draft-write 1.6s steps(22, end) infinite; }
    .draft-row.is-now .draft-comment::after { content: ""; width: 2px; height: 14px; background: var(--accent);
      animation: draft-caret 0.9s steps(1, end) infinite; }
    .draft-row.is-queued .draft-text { min-height: 1em; }
