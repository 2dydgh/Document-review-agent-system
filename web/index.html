    .draft-row.is-queued .draft-text:empty::before { content: "…"; color: var(--text-3); }
    .draft-row.is-todo { opacity: .45; }
    .draft-row.is-todo .draft-ink { width: 0; }
    .draft-row.is-more { display: block; color: var(--text-3); text-align: center; }
    @keyframes draft-write { from { width: 0; } to { width: 82%; } }
    @keyframes draft-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .draft-progress { height: 6px; border-radius: 3px; background: var(--neutral-weak); overflow: hidden; }
    .draft-progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
    @media (prefers-reduced-motion: reduce) {
      .draft-row.is-now .draft-ink, .draft-row.is-now .draft-comment::after { animation: none; }
      .draft-row.is-now .draft-ink { width: 40%; }
      .draft-progress-bar { transition: none; }
    }
    .eval-table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13px; }
    .eval-table th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left;
      padding: 10px 12px; font-size: 12px; font-weight: 700; color: var(--text-2);
      border-bottom: 1px solid var(--line); white-space: nowrap; }
    .eval-table td { padding: 12px; border-bottom: 1px solid var(--line-2);
      vertical-align: top; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
    .eval-table tbody tr:last-child td { border-bottom: 0; }
    .eval-table .eval-col-item { width: 30%; }
    .eval-table .eval-col-comment { width: 34%; }
    .criteria-table-scroll { max-height: min(660px, 65vh); overflow: auto; scrollbar-gutter: stable; }
    .criteria-work-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .criteria-work-table th { text-align: left; position: sticky; top: 0; z-index: 1; background: var(--panel);
      height: 36px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
    .criteria-work-table td { height: 58px; padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
    .criteria-work-table tbody tr:last-child td { border-bottom: 0; }
    .criteria-work-table td:first-child { width: 62%; }
    .criteria-work-table tbody tr { cursor: pointer; }
    /* 호버는 중립 미리 반응, 선택은 지속되는 블루그레이 면. 두 상태를 겹쳐 칠하지 않는다. */
    .criteria-work-table { --criteria-row-hover: var(--state-hover-neutral); --criteria-row-selected: #E7EDF6; }
    [data-theme="dark"] .criteria-work-table {
      --criteria-row-selected: #303C50; }
    .criteria-work-table tbody tr:not(.is-selected):hover td { background: var(--criteria-row-hover); }
    .criteria-work-table tbody tr.criteria-skeleton-row { cursor: default; pointer-events: none; }
    .criteria-work-table tbody tr.criteria-skeleton-row td { background: transparent; }
    .criteria-skeleton-line { display: block; height: 14px; width: 80%; max-width: 100%; border-radius: 4px; }
    .criteria-skeleton-context { display: block; height: 10px; width: 42%; margin-top: 8px; border-radius: 4px; }
    .criteria-work-table tbody tr.is-selected td { background: var(--criteria-row-selected); }
    .criteria-work-table tr.is-selected .criteria-title-button { font-weight: 700; }
    .criteria-title-button { display: block; padding: 0; border: 0; background: transparent; text-align: left;
      font: inherit; font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); cursor: pointer; overflow-wrap: anywhere; }
    .criteria-row-context { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-3); line-height: 1.4; margin-top: 2px; }
    .criteria-scope-label { color: var(--text-2); background: var(--neutral-weak);
      border-radius: 4px; padding: 0 6px; font-size: 12px; line-height: 1.4; }
    .criteria-method { color: var(--text); font-size: 14px; }
    .criteria-preparation { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14px; color: var(--text); }
    .criteria-preparation i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
    .criteria-preparation.needs i { background: currentColor; }
    .criteria-preparation.needs { color: var(--sev-min-fg); }
    .criteria-inspector { min-width: 0; padding: 22px 24px; border-left: 1px solid var(--line);
      max-height: min(720px, 72vh); overflow: auto; scrollbar-gutter: stable; }
    .criteria-detail-label { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 20px; color: var(--text-3); font-size: 12px; }
    .criteria-inspector h2 { font-size: 18px; line-height: 1.6; margin: 0; color: var(--text); overflow-wrap: anywhere; }
    .criteria-reference { font-variant-numeric: tabular-nums; }
    .criteria-inspector-empty h2 { font-size: 14px; font-weight: 600; }
    .criteria-inspector-empty p { margin: 20px 0 6px; font-size: 14px; color: var(--text); }
    .criteria-inspector-empty > span { font-size: 13px; line-height: 1.6; color: var(--text-2); }
    .criteria-detail-context { font-size: 12px; color: var(--text-3); margin: 8px 0 22px; }
    .criteria-inspector section { margin-top: 24px; }
    .criteria-inspector h3, .criteria-readiness-note strong { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
    .criteria-inspector section p, .criteria-readiness-note p { font-size: 14px; line-height: 1.6;
      color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
    .criteria-readiness-note { margin-top: 24px; border: 1px solid var(--line); border-radius: var(--r-sm);
      background: var(--bg); padding: 14px; }
    .criteria-readiness-note strong { display: block; }
    .criteria-inspector dl { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 12px;
      border-top: 1px solid var(--line); padding-top: 20px; margin: 24px 0 0; font-size: 12px; }
    .criteria-inspector dt { color: var(--text-3); }
    .criteria-inspector dd { color: var(--text-2); margin: 0; overflow-wrap: anywhere; }
    .criteria-inspector footer { font-size: 13px; color: var(--text-2); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
    .criteria-inspector-actions { margin-top: 24px; }
    .criteria-inspector-actions p { color: var(--text-2); font-size: 13px; margin: 10px 0; }
    .criteria-set-actions summary { font-size: 14px; color: var(--text-2); cursor: pointer; margin-bottom: 10px; }
    .criteria-catalog-empty { color: var(--text-2); font-size: 13px; padding: 32px 22px; line-height: 1.6; }
    .criteria-catalog-notice { padding: 16px 22px; font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 1200px) {
      .criteria-workspace-body { grid-template-columns: minmax(0, 1fr) 300px; }
      .criteria-inspector { padding: 20px 18px; }
    }
    @media (max-width: 700px) {
      .criteria-workspace-body { grid-template-columns: minmax(0, 1fr); }
      .criteria-inspector { border-left: 0; border-top: 1px solid var(--line); max-height: none; }
      .criteria-workspace-tools { padding: 6px 12px; }
      .criteria-scope-tabs { min-width: 0; }
      .criteria-workspace-filters { flex-wrap: wrap; width: 100%; min-width: 0; }
      .criteria-workspace-filters select { max-width: 100%; }
      .criteria-catalog-search { flex: 1; min-width: 0; max-width: 100%; }
      .criteria-catalog-search input { width: 100%; }
      .criteria-table-scroll { max-height: 400px; }
    }
    .criteria-catalog { overflow: hidden; border: 1px solid var(--line);
                        border-radius: var(--r-md); background: var(--panel); }
    .criteria-layer-headings, .criteria-layer-toggle { display: grid;
      grid-template-columns: 92px minmax(220px, 1fr) 90px 210px 40px; align-items: center; }
    .criteria-layer-headings { min-height: 36px; background: var(--panel);
                               border-bottom: 1px solid var(--line);
                               color: var(--text-3); font-size: 12px; font-weight: 600; }
    .criteria-layer-headings > span, .criteria-layer-toggle > * { min-width: 0;
                                                                  padding: 0 12px; }
    .criteria-layer-headings > span + span, .criteria-layer-toggle > * + * {
      border-left: 1px solid var(--line-2); }
    .criteria-layer { border-bottom: 1px solid var(--line); background: var(--panel); }
    .criteria-layer:last-child { border-bottom: 0; }
    .clay-card { border-radius: 0; }
    .clay-head { min-height: 58px; cursor: pointer; transition: background .15s ease-out; }
    .clay-head:hover { background: var(--state-hover-neutral); }
    .criteria-layer.is-open > .clay-head { background: var(--accent-weak); }
    .clay-head:focus-visible, .criteria-record-row.is-fold:focus-visible {
      position: relative; z-index: 1; outline: 2px solid var(--accent); outline-offset: -2px; }
    .clay-scope { justify-self: start; display: inline-flex; align-items: center;
                  margin-left: 12px; padding: 4px 8px !important;
                  border: 1px solid var(--line); border-radius: 6px;
                  background: var(--panel); color: var(--text-2);
                  font-size: 11px; font-weight: 700; letter-spacing: var(--tr-caps); }
    .criteria-layer-title { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .clay-name { overflow: hidden; color: var(--text); font-size: 13px; font-weight: 700;
                 line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
    .criteria-layer-title small { flex: none; color: var(--text-3); font-size: 12px; }
    .criteria-layer-count { color: var(--text-3); font-size: 12px;
                            font-variant-numeric: tabular-nums; }
    .criteria-layer-count b { color: var(--text); font-size: 13px; }
    .criteria-layer-coverage { display: flex; align-items: center; gap: 14px;
                               color: var(--text-2); font-size: 12px;
                               font-variant-numeric: tabular-nums; white-space: nowrap; }
    .criteria-layer-coverage span { display: inline-flex; align-items: center; gap: 6px; }
    .criteria-layer-coverage i { width: 7px; height: 7px; border-radius: 99px; }
    .criteria-layer-coverage .is-auto { background: var(--accent); }
    .criteria-layer-coverage .is-manual { background: var(--sev-info-fg); }
    .criteria-layer-coverage .is-off { background: var(--sev-maj-fg); }
    .clay-chev { width: 16px; height: 16px; display: flex; align-items: center;
                 justify-content: center; padding: 0 !important; justify-self: center;
                 color: var(--text-3); transition: transform .18s var(--ease-out); }
    .clay-head[aria-expanded="true"] .clay-chev { transform: rotate(180deg); }
    .clay-items { overflow-x: auto; border-top: 1px solid var(--line); }

    /* 펼친 기준도 기록·추가 기준과 같은 레코드 목록이다. 번호는 기준명 옆의
       작은 식별표이고, 검증 대상은 그룹 띠 대신 고정 열로 둔다. */
    .criteria-record-head, .criteria-record-row { min-width: 860px; }
    /* 기준 세트 안에서 다시 회색 띠가 나오면 목록이 둘로 끊겨 보인다. 열 이름은
       유지하되 행과 같은 패널 면에 두고, 아래 경계선만으로 머리임을 구분한다. */
    .criteria-record-head { background: var(--panel); }
    .criteria-record-row.is-fold { cursor: pointer; }
    .criteria-record-row[aria-expanded="true"] { background: var(--state-hover-neutral); }
    .criteria-record-row > .record-primary, .criteria-record-row > span {
      min-height: 48px; display: flex; align-items: center; }
    .criteria-record-main { overflow: hidden; }
    .record-criterion-no { flex: none; max-width: 92px; overflow: hidden;
                           padding: 2px 6px; border-radius: var(--r-sm);
                           background: var(--bg); color: var(--text-3); font-size: 12px;
                           font-variant-numeric: tabular-nums; text-overflow: ellipsis;
                           white-space: nowrap; }
    .criteria-record-check i { width: 7px; height: 7px; }
    .criteria-record-how { overflow: hidden; }
    .criteria-row-chevron { display: flex; justify-content: center; color: var(--text-3);
                            opacity: .55; transition: transform .18s var(--ease-out),
                            opacity .15s ease-out; }
    .criteria-record-row.is-fold:hover .criteria-row-chevron { opacity: 1; }
    .criteria-record-row[aria-expanded="true"] .criteria-row-chevron {
      transform: rotate(180deg); opacity: 1; }
    .clay-note { grid-column: 1 / -1; display: grid; grid-template-columns: 120px 1fr;
                 margin: 0; padding: 0 !important; border-top: 1px solid var(--line-2);
                 border-left: 0 !important; background: var(--panel); color: var(--text-2);
                 white-space: pre-wrap; }
    .criteria-note-label { padding: 14px 12px; color: var(--text-3); font-size: 12px;
                           font-weight: 700; }
    .criteria-note-copy { min-width: 0; padding: 14px 16px;
                          border-left: 1px solid var(--line-2); font-size: 13px;
                          font-weight: 400; line-height: 1.6; white-space: pre-wrap; }
    .criteria-detail-surface { overflow-x: auto; }
    .criteria-empty { padding: 42px 20px; color: var(--text-3); font-size: 12px;
                      text-align: center; }
    @media (max-width: 900px) {
      .criteria-tools { align-items: stretch; flex-direction: column; }
      .criteria-search { max-width: none; }
      .criteria-filters { justify-content: flex-start; }
      .criteria-layer-headings, .criteria-layer-toggle {
        grid-template-columns: 82px minmax(180px, 1fr) 72px 170px 36px; }
    }

    /* ── 담당 요건 범위 짚어 주기 ─────────────────────────────────────
       "공통 앞부분을 적으세요" 만 있던 자리. 어디서 잘라야 하는지는 이 설계서가
       무엇을 맡았는지 알아야 정해지는데, 그걸 알려고 이 도구를 쓴다. 두 문서를
       올렸으니 계산해서 후보로 내민다 — 적는 대신 고르게 한다. */
    .cscope-calc { margin-top: 10px; }
    .cscope-lead { font-size: 13px; font-weight: 600; color: var(--text-2);
                   margin-bottom: 6px; }
    .cscope-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .cscope-chip { display: flex; flex-direction: column; align-items: flex-start;
                   gap: 2px; padding: 6px 10px; cursor: pointer; text-align: left;
                   border: 1px solid var(--line); border-radius: var(--r-sm);
                   background: var(--panel); color: var(--text); }
    .cscope-chip:hover { background: var(--state-hover-neutral); }
    .cscope-chip.on { border-color: var(--accent); background: var(--accent-weak); }
    .cscope-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cscope-chip-p { font-size: 12px; font-weight: 700; }
    /* 숫자는 자릿수가 흔들리면 칩 폭이 들썩인다. */
    .cscope-chip-n { font-size: 12px; color: var(--text-3);
                     font-variant-numeric: tabular-nums; }
    .cscope-chip.on .cscope-chip-n { color: var(--accent-ink); }
    .cscope-now { margin-top: 8px; font-size: 13px; line-height: 1.6;
                  color: var(--text-2); font-variant-numeric: tabular-nums; }
    .cscope-now b { color: var(--text); font-weight: 700; }
    /* 못 읽은 형식을 0건으로 보여 주면 "이 범위엔 요건이 없다" 는 거짓말이 된다. */
    .cscope-now.bad { color: var(--sev-maj-fg); }
    .cscope-note { font-size: 13px; line-height: 1.6; color: var(--text-2); }

    /* ── 추가 기준 직접 작성 카드 ─────────────────────────────────────
       틀을 값이 아니라 클래스가 지게 한다. 예전엔 이 카드가 통째로 인라인
       style 이라 여백 하나를 고치려면 문자열 열 군데를 찾아야 했다. */
    .cdraft { background: var(--panel); border: 1px solid var(--line);
              border-radius: var(--r-lg); padding: 24px 28px; }
    .cdraft-h { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--text-title);
                color: var(--text); letter-spacing: var(--tr-title); }
    .cdraft-sub { margin-top: 6px; font-size: 13px; line-height: 1.6;
                  color: var(--text-3); }
    /* 제목 위가 아래보다 넓다 — 앞 절과 끊고 자기 내용을 끌어안는다. */
    .cdraft-sec { margin-top: 26px; padding-top: 18px;
                  border-top: 1px solid var(--line-2); }
    .cdraft-sec-h { font-size: 13px; font-weight: 700; color: var(--text); }
    .cdraft-sec-sub { margin-top: 4px; font-size: 12px; line-height: 1.6;
                      color: var(--text-3); }
    .cdraft-f { margin-top: 14px; }
    .cdraft-lbl { display: block; font-size: 12px; font-weight: 600;
                  color: var(--text-2); margin-bottom: 6px; }
    .cdraft-in { width: 100%; padding: 8px 12px; font-size: 13px;
                 border: 1px solid var(--line); border-radius: var(--r-sm);
                 background: var(--bg); color: var(--text); box-sizing: border-box; }
    .cdraft-in::placeholder { color: var(--text-3); }
    .cdraft-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px;
                               border-color: var(--accent); }
    .cdraft-help { margin-top: 6px; font-size: 13px; line-height: 1.6;
                   color: var(--text-2); }
    /* 되읽기. 검토자가 적은 예시를 무엇으로 읽었는지 그 자리에서 돌려준다 —
       이 화면엔 문서가 없어 "몇 곳 걸립니다"를 못 세므로, 대신 형식을 사람 말로
       보여 주는 것이 유일한 확인 수단이다. */
    .cdraft-read { margin-top: 8px; padding: 10px 12px; border-radius: var(--r-sm);
                   background: var(--accent-weak); font-size: 12px; line-height: 1.6;
                   color: var(--accent-ink); }
    .cdraft-read b { font-weight: 700; }
    .cdraft-read.off { background: var(--bg); color: var(--text-3); }
    .cdraft-adv { margin-top: 12px; }
    .cdraft-adv > summary { font-size: 12px; color: var(--text-3); cursor: pointer;
                            width: fit-content; }
    .cdraft-adv > summary:focus-visible { outline: 2px solid var(--accent);
                                          outline-offset: 2px; border-radius: 3px; }
    .cdraft-adv[open] > summary { margin-bottom: 4px; color: var(--text-2); }
    .cdraft-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0;
                  border-top: 1px solid var(--line-2); }
    .cdraft-no { flex: none; width: 20px; padding-top: 8px; font-size: 12px;
                 color: var(--text-3); }
    .cdraft-modes { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .cdraft-mode { padding: 4px 10px; font-size: 14px; font-weight: 600;
                   border-radius: var(--r-sm); cursor: pointer; color: var(--text);
                   border: 1px solid var(--line); background: var(--panel);
                   white-space: nowrap; }
    .cdraft-mode.on { border-color: var(--accent); background: var(--accent-weak); }
    .cdraft-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 26px; }
    /* 세부 항목의 검사 방식 뱃지. 자동은 채운 칩, 사람 몫은 빈 칩으로 구분한다. */
    .clay-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
                 font-size: 11px; font-weight: 600; line-height: 1.4; padding: 4px 10px;
                 border: 1px solid transparent; border-radius: var(--r-xl); }
    .clay-chip b { font-variant-numeric: tabular-nums; font-weight: 700; }

    /* 검사 방식 필터. 이 화면의 값어치는 "무엇이 자동이고 무엇이 사람 몫인가"라
       그 축으로 걸러 볼 수 있어야 한다. 고른 칩만 채우고 나머지는 남긴다 —
       숨기면 전체에서 몇 건인지가 사라진다. */
    .clay-fchip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
                  font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.4;
                  color: var(--text-2); background: var(--panel);
                  min-height: 34px; box-sizing: border-box;
                  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px;
                  transition: background .15s var(--ease-out), border-color .15s var(--ease-out),
                              color .15s var(--ease-out); }
    .clay-fchip:hover { border-color: var(--accent); color: var(--text); }
    .clay-fchip.on { border-color: var(--accent); background: var(--accent-weak);
                     color: var(--accent-ink); font-weight: 600; }
    .clay-fchip b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .clay-fchip .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }

    /* buttons */
    /* 버튼 글자는 줄바꿈하지 않는다 — 좁은 타일 안에서 "모두 보기" 가 "모두 보 /
       기" 로 갈리면 손잡이가 고장난 것으로 보인다. 자리가 모자라면 옆 글자가
       줄어들지(ellipsis) 버튼이 두 줄이 되지는 않는다. */
    .btn { min-height: 34px; padding: 8px 14px; display: inline-flex; align-items: center;
           white-space: nowrap;
           justify-content: center; gap: 6px; font-family: inherit; font-size: 14px;
           /* 곡률은 카드(--r-md)와 같은 10px(2026-09-04: 6 → 10). 카드를 둥글리고 버튼만
              6 으로 남기니 버튼이 각져 보였다. 작은 버튼은 8, 큰 버튼은 12. */
           line-height: 1.2; cursor: pointer; font-weight: 600; border-radius: var(--r-md);
           transition: border-color .2s var(--ease-out), background .2s var(--ease-out), color .2s var(--ease-out), box-shadow .2s var(--ease-out), transform .15s var(--ease-out); }
    /* 브랜드 면(.tile.crit 같은 파란 바닥) 위에서는 버튼이 반전된다 —
       흰 채움 + 브랜드 잉크. 파란 면에 파란 버튼은 묻힌다. */
    .btn-sm { min-height: 34px; padding: 6px 12px; font-size: 14px; border-radius: var(--r-sm); }
    /* 인용마다 하나씩 붙는 버튼용. sm 은 줄지어 서면 과했다(2026-09-09). */
    .btn-xs { min-height: 26px; padding: 2px 10px; font-size: 12px; border-radius: var(--r-sm); }
    /* 홈의 솔리드 보조 CTA는 빠른 시작 아이콘과 같은 12px 곡률을 쓴다. */
    /* 홈 타일 머리줄의 "모두 보기". 최근 검토와 적용 중인 기준이 같은 역할의
       손잡이를 달고 있으므로 이름도 생김새도 같다 — 한때 기준 타일 쪽만 이름이
       "전체 보기"였고 인라인으로 22px 높이 · 11px 글자 · 999px 알약이라, 같은
       화면에 다른 버튼 두 종류가 있었다.
       높이·여백·글자 크기·굵기(600)는 .btn / .btn-sm 이 지고, 여기서는 모서리만
       맞춘다. 인라인으로 덮어쓰지 말 것 — 그게 둘이 갈렸던 원인이다. */
    .home-see-all { border-radius: var(--r-md); }
    /* 40px 높이의 주요 실행 버튼은 사이드바 메뉴 면과 같은 --r-md를 쓴다.
       작은 보조 버튼까지 함께 둥글게 만들지 않도록 크기 변형에만 적용한다. */
    .btn-lg { min-height: 40px; padding: 10px 22px; font-size: 14px; border-radius: var(--r-md);
              border-radius: var(--r-md); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; }
    .btn-primary { border: none; background: var(--accent-surface); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); }
    /* 누르는 것은 두 가지뿐(2026-09-08 결정). ① 주 버튼: 메인색 면 + 흰 글자.
       ② 보조 버튼: 흰 면 + 메인색 테두리 + 메인색 글자. 회색 테두리 버튼은 없다 —
       상태 배지(테두리 없음 · 옅은 면 · 색 글자)와 갈라 보이지 않았다. */
    .btn-ghost { background: var(--panel); border: 1px solid var(--accent); color: var(--accent-ink); }
    .btn-ghost:hover { background: var(--accent-weak); border-color: var(--accent); }
    /* 최종 삭제 실행에만 사용. 확인창을 여는 버튼은 btn-primary.
       다크 테마의 연한 오류 글자색과 분리해 흰 글자의 대비를 유지한다. */
    .btn-danger { border: none; background: #B91C1C; color: #fff; }
    .btn-danger:hover { filter: brightness(.9); }
    /* 테두리도 함께 빨강으로 돌린다. .btn-ghost 가 건 파란 테두리를 글자색만
       덮어써서, 평소에는 **파란 테두리에 빨간 글씨**로 떴다 — hover 해야 빨강으로
       맞아떨어지니 가만히 볼 때만 어긋나 보인다(2026-09-09). */
    .btn-danger-ghost { color: var(--sev-crit-fg); border-color: var(--sev-crit-bd); }
    .btn-danger-ghost:hover { color: var(--sev-crit-fg); border-color: var(--sev-crit-fg); background: var(--sev-crit-bg); }
    /* 브랜드색은 버튼에(2026-09-04). 기본 버튼은 파란 면, 옅은 버튼은 평소에도
       파란 글씨 · hover 에 파란 테두리와 옅은 브랜드 면. 사이드바에서 색을 뺀 대신
       누르는 것에는 전부 색이 있다 — 모든 화면에 버튼이 있어 브랜드색이 고르게
       퍼진다. 한때 hover 만 파랗던 것을 회색으로 돌렸다가 "화면이 휑하다"로 되돌렸다. */
    .btn-ghost-accent { color: var(--accent-ink); }
    .btn-ghost-accent:hover { background: var(--accent-weak); border-color: var(--accent); color: var(--accent-ink); }
    /* 버튼의 1px 상승은 마우스에만 — 터치에서는 탭한 버튼이 떠오른 채 붙는다.
       색·그림자 hover 는 위에 남긴다: 짧아서 해가 없고, 게이트에 넣으면 터치가
       hover 신호를 통째로 잃는다. */
    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover, .btn-ghost:hover, .btn-danger:hover,
      .btn-ghost-accent:hover { transform: none; }
    }

    /* 누르는 순간의 반응. hover 는 "여기 눌린다"를 말하고 :active 는 "지금
       눌렀다"를 말한다 — 둘은 다른 질문에 답한다. 이게 없으면 렌더가 끝날
       때까지 사용자가 "먹었나?"를 혼자 판단해야 한다(제일 많이 눌리는 면이
       지적 카드 .fcard 와 최근 검토 행 .hrow 다).
       면에는 배경, 카드에는 축소 — 테두리도 radius 도 없는 행을 축소시키면
       글자만 흔들린다(.hrow 가 .pick 대신 배경을 쓰는 것과 같은 이유).
       .nav.on 과 .fcard.on 은 이미 선택 상태의 면색을 갖고 있어 뺀다. */
    /* .nav 는 누름 면도 없다(2026-09-04) — 눌렀을 때 회색 면이 떴다 사라진 뒤 파란
       선택 면이 미끄러져 오면 면이 두 번 나타난다. 미끄러져 오는 면이 곧 누름 반응이다. */
    .hrow:active, .hrow-flush:active, .row:active,
    .mi:not(:disabled):active, .rail:active { background: var(--line-2); }
    .tile.act:active, .fcard:not(.on):active, .pick:active { transform: scale(.995); }
    .chip:active { filter: brightness(.95); }
    /* .btn 은 여기 있어야 한다. 원래 .btn-primary/-ghost/-danger 의 :hover 보다
       **위에** 있었고, 그 hover 들이 transform: translateY(-1px) 을 같은 특정도로
       덮어서 주요 버튼의 누름 반응이 마우스에서는 한 번도 보인 적이 없다
       (게다가 .btn:active 가 값만 다르게 두 벌 있었다). */
    /* 눌림 스케일 .97 — 버튼 크기에서 눌림이 실제로 보이는 값이다(.98 은
       모니터에 따라 안 보였다). 근거는 emil-design-eng 의 버튼 지침:
       :active 에 scale(0.97), transform 전환 100~160ms ease-out. */
    /* 누르는 느낌 — 0.97 배로 살짝 눌린다(150ms). 밝기만 바뀌던 것은 반응이 안 느껴졌다(2026-09-16). */
    .btn:not(:disabled):active, .result-filter:active, .result-icon-btn:active { transform: scale(.97); }

    @media (max-width: 720px) {
      .page-shell { padding: 16px; }
      .page-stack { gap: 14px; }
    }

    /* 로그인·회원가입·비밀번호찾기의 "돌아가기". 앱 안쪽 뒤로가기(.hover-accent)와
       달리 모달의 맨 위에 홀로 떠 있어서, 색만 바뀌면 눌리는 자리인지 모른다 —
       배경을 깔아 버튼 크기를 눈에 보이게 하고 화살표를 왼쪽으로 민다. */
    .backlink { display: inline-flex; align-items: center; cursor: pointer;
                font-size: 14px; font-weight: 600; color: var(--text-3);
                padding: 8px 12px; margin: 0 0 16px -12px; border-radius: var(--r-sm);
                transition: color .15s, background .15s; }
    .backlink:hover { color: var(--accent-ink); background: var(--state-hover-brand); }
    /* :active 는 자기 :hover 뒤에 와야 이긴다(같은 특정도라 순서가 가른다) —
       그래서 위 누름 반응 블록에 못 넣고 여기 둔다. .sel-opt 도 같다. */
    .backlink:active { background: var(--line-2); }
    .backlink svg { transition: transform .2s var(--ease-out); }
    @media (hover: hover) and (pointer: fine) {
      .backlink:hover svg { transform: translateX(-3px); }
    }

    /* 커스텀 셀렉트(회원가입 부서·팀). 네이티브 <select> 의 펼친 목록은 OS 가
       그리기 때문에 모서리도 hover 색도 앱과 따로 논다 — 내려받기 메뉴(.mi)와
       같은 모양으로 목록을 직접 그린다. 값은 wrapper 의 data-value 에 담는다. */
    .sel { position: relative; }
    .sel-btn { width: 100%; display: flex; align-items: center; justify-content: space-between;
               gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md);
               background: var(--bg); font-family: inherit; font-size: 15px; font-weight: 500;
               color: var(--text); cursor: pointer; text-align: left;
               transition: border-color .15s, background .15s, box-shadow .15s; }
    .sel-btn:hover { border-color: var(--accent); }
    .sel.open .sel-btn { border-color: var(--accent); background: var(--panel);
                         box-shadow: 0 0 0 3px var(--accent-weak); }
    .sel-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 아직 안 고른 상태 = placeholder. <option disabled selected> 자리다. */
    .sel-label[data-ph] { color: var(--text-3); font-weight: 400; }
    .sel-caret { flex: none; color: var(--text-3);
                 transition: transform .2s var(--ease-out), color .15s; }
    .sel.open .sel-caret { transform: rotate(180deg); color: var(--accent-ink); }
    .sel-menu { display: none; position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; right: 0;
                max-height: 264px; overflow: auto; padding: 6px;
                background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
                box-shadow: var(--sh-3); transform-origin: top center;
                animation: popoverIn var(--dur-1) var(--ease-out); }
    .sel.open .sel-menu { display: block; }
    .sel-opt { width: 100%; display: flex; align-items: center; justify-content: space-between;
               gap: 8px; padding: 10px 12px; border: none; border-radius: var(--r-sm); background: none;
               cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
               color: var(--text-2); text-align: left; transition: background .15s, color .15s; }
    .sel-opt:hover { background: var(--state-hover-neutral); color: var(--text); }
    .sel-opt:active { background: var(--line-2); }
    .sel-opt[aria-selected="true"] { background: var(--accent-weak); color: var(--accent-ink); }
    .sel-check { flex: none; visibility: hidden; color: var(--accent-ink); }
    .sel-opt[aria-selected="true"] .sel-check { visibility: visible; }

    /* 목록 행에 얹는 작은 셀렉트(반영 확인 판정). 회원가입 폼 크기 그대로 쓰면
       한 줄에 안 들어간다. 펼친 목록은 같은 것을 쓴다 — 네이티브 <select> 는
       그 목록을 OS 가 그려서 앱과 안 어울린다(그래서 .sel 이 있다). */
    .sel-sm { flex: none; }
    .sel-sm .sel-btn { width: auto; gap: 6px; padding: 6px 10px; border-radius: var(--r-sm);
                       font-size: 14px; font-weight: 600; background: var(--panel); }
    .sel-sm .sel-menu { left: auto; right: 0; min-width: 136px; }
    .sel-sm .sel-opt { padding: 8px 10px; font-size: 14px; }

    ::selection { background: rgba(var(--accent-rgb),.16); }

    /* 키보드 포커스 링. 지적 카드·탭·칩이 tabindex 로 포커스를 받게 되면서
       (views.js + app.js 의 Enter/Space 브리지) 브라우저 기본 링이 처음 보이게
       됐다 — 기본값은 팔레트를 모르니 브랜드색으로 통일한다. 마우스 클릭에는
       안 뜬다(:focus-visible). */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* 로그인·회원가입·비밀번호찾기의 바탕. 앱의 종이색 캔버스(다크는 차콜)를 쓰고
       큰 유기적 도형만 브랜드색으로 흘린다 — 화면 밖으로 잘려 나가야 "배경"으로
       읽히지, 다 보이면 그림 조각이 떠 있는 것처럼 보인다.
       색은 --accent-weak 를 그대로 쓴다. 알파를 따로 곱하면 팔레트에 없는 톤이
       하나 생기는데, 그건 이 화면에서만 통하는 이름 없는 색이다. 이 토큰은
       nav.on·fcard.on 같은 선택 상태가 이미 쓰는 "연한 브랜드 면"이고,
       다크 오버라이드(.1 → .18)도 팔레트가 이미 들고 있다 — 테마별 세기를
       여기서 정하지 않아도 되는 게 핵심이다. 더 진하게 가려면 임의로 곱하지 말고
       팔레트에 토큰을 하나 늘리는 쪽이 맞다.
       (--neutral-strong 은 쓰면 안 된다. 다크 오버라이드가 없어 검정 위에
        흰 덩어리로 뜬다. --bg 는 흰 바탕에서 거의 안 보인다. 둘 다 확인했다.)
       이미지가 아니라 CSS 라 화면이 아무리 커져도 뭉개지지 않는다 — 사진 배경이
       겪던 해상도 문제가 여기선 아예 없다. 크기도 vw/vh 라 비율이 따라온다. */
    .auth-canvas { background-color: var(--bg); }
    .auth-blob { position: absolute; z-index: 0; pointer-events: none;
                 background: var(--accent-weak); }
    /* 모서리마다 다른 곡률을 줘야 원이 아니라 덩어리로 보인다. 비대칭이 약하면
       그냥 찌그러진 타원 넷이 되므로 대각선끼리 크게 벌려 놓는다(72/28, 34/66 처럼).
       종류를 섞지는 않는다 — 링이나 정원을 끼워 넣으면 배경이 아니라 낱개의
       장식물로 읽혀서 흔한 템플릿처럼 보인다. 다양함은 '계열 안에서'만 준다. */
    .auth-blob.b1 { top: -28vh; left: -16vw; width: 50vw; height: 70vh;
                    border-radius: 72% 28% 63% 37% / 66% 40% 60% 34%; transform: rotate(-14deg); }
    .auth-blob.b2 { bottom: -34vh; right: -14vw; width: 54vw; height: 76vh;
                    border-radius: 34% 66% 30% 70% / 58% 36% 64% 42%; transform: rotate(16deg); }
    .auth-blob.b3 { bottom: -16vh; left: 2vw; width: 30vw; height: 38vh;
                    border-radius: 64% 36% 74% 26% / 38% 66% 34% 62%; transform: rotate(-28deg); }
    .auth-blob.b4 { top: 1vh; right: 4vw; width: 22vw; height: 30vh;
                    border-radius: 40% 60% 32% 68% / 70% 30% 70% 30%; transform: rotate(22deg); }

    /* 애니메이션 추가: 부드럽게 호흡하고 미세하게 떠다니는 유기적인 움직임 */
    @keyframes blobFloat {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); }
      33% { transform: scale(1.05) translate(3vw, -2vh) rotate(3deg); }
      66% { transform: scale(0.95) translate(-2vw, 3vh) rotate(-2deg); }
      100% { transform: scale(1) translate(0, 0) rotate(0deg); }
    }
    .auth-blob { animation: blobFloat 24s ease-in-out infinite; }
    /* b1, b2, b3, b4가 서로 다른 타이밍과 리듬으로 움직이게 하여 기계적인 느낌 제거 */
    .auth-blob.b1 { animation-delay: 0s; animation-duration: 28s; }
    .auth-blob.b2 { animation-delay: -5s; animation-duration: 32s; animation-direction: reverse; }
    .auth-blob.b3 { animation-delay: -12s; animation-duration: 22s; }
    .auth-blob.b4 { animation-delay: -8s; animation-duration: 26s; animation-direction: reverse; }

    /* 파란 브랜드 면의 배경. 바깥 캔버스(.auth-blob)는 유기적인 덩어리를 쓰지만
       여기선 **제품의 어휘**를 쓴다 — 돋보기 렌즈와 문서 면이다. 한때 바깥과 같은
       블롭을 흰빛으로 흘리는 .brand-blob 이 있었는데, 화면에 붙인 적이 없다.
       붙였다면 "귀여운 일러스트 로그인 템플릿"이 됐을 것이다: 배경이 제품과 무관한
       장식물이면 어느 서비스에 갖다 붙여도 똑같이 그럴듯하다.

       한 겹이던 135도 그라데이션을 방사형 셋으로 나눠 공간감만 만든다. 색은 있는
       토큰 안에서 쓴다 — 크림 빛(위)·파우더 블루(중앙 렌즈 빛)·짙은 남색(오른쪽
       아래 깊이). 값은 알파를 var 로 빼 놨다: 다크에서 파랑 채도와 흰 장식만
       내리면 되고, 그라데이션 좌표를 두 벌 적지 않아도 된다. */
    .login-brand {
      --bp-cream:  rgba(255,251,244,.20); /* 상단 빛 */
      --bp-powder: rgba(150,200,240,.30); /* 중앙 렌즈 빛 */
      --bp-depth:  rgba(20,44,70,.42);    /* 우하단 깊이 */
      --bp-scrim:  transparent;           /* 다크에서만 채도를 누르는 막 */
      --bp-ink: 1;                        /* 흰 장식 투명도 배율 */
      background:
        radial-gradient(120% 90%  at 18% 6%,   var(--bp-cream)  0%, transparent 55%),
        radial-gradient(78%  62%  at 50% 40%,  var(--bp-powder) 0%, transparent 68%),
        radial-gradient(110% 100% at 84% 104%, var(--bp-depth)  0%, transparent 62%),
        linear-gradient(var(--bp-scrim), var(--bp-scrim)),
        linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-deep) 100%);
    }
    [data-theme="dark"] .login-brand {
      --bp-cream:  rgba(255,251,244,.09);
      --bp-powder: rgba(150,200,240,.14);
      --bp-depth:  rgba(4,12,22,.62);
      --bp-scrim:  rgba(8,17,28,.44);
      --bp-ink: .55;
    }

    /* 여기 한때 배경용 거대 돋보기(테두리 원 + 45도 손잡이)가 있었다. 지웠다 —
       아무도 돋보기로 못 읽고 "저 뒤의 커다란 구가 뭐냐"로 먼저 걸렸다. 배경
       도형이 무엇인지 물어보게 만들면 그 순간 배경이 아니라 내용이다.
       렌즈의 빛만 있으면 된다 — 위 --bp-powder 방사형이 그 일을 이미 한다.
       실물 돋보기는 마스코트가 손에 들고 있고, 그거면 충분하다. */

    /* 가장자리에서 잘려 나가는 문서 면. 히어로의 .hero-doc 과 같은 어휘(종이·본문
       줄·형광펜)를 크게·흐리게 쓴다. 흐리게 하는 게 핵심이다 — 선명하면 배경이
       아니라 "읽어야 할 문서" 가 되어 폼에서 눈을 뺏는다. */
    .bp-doc { position: absolute; z-index: 0; pointer-events: none;
              width: 208px; height: 272px; border-radius: var(--r-lg);
              background: rgba(247,243,239,.10);
              border: 1px solid rgba(255,255,255,.13);
              filter: blur(2.5px); opacity: calc(.6 * var(--bp-ink));
              animation: docDrift 26s ease-in-out infinite; }
    .bp-doc::before { content: ""; position: absolute; inset: 30px 24px auto 24px; height: 132px;
                      background: repeating-linear-gradient(to bottom,
                        rgba(255,255,255,.15) 0 3px, transparent 3px 16px); }
    .bp-doc::after { content: ""; position: absolute; left: 24px; top: 69px;
                     width: 78px; height: 9px; border-radius: 2px;
                     background: rgba(250,190,83,.32); }
    .bp-doc-tl { --bp-rot: -12deg; top: -70px; left: -78px; }
    .bp-doc-br { --bp-rot: 9deg; bottom: -84px; right: -72px; animation-delay: -13s; }
    @keyframes docDrift {
      0%, 100% { transform: rotate(var(--bp-rot)) translateY(0); }
      50%      { transform: rotate(var(--bp-rot)) translateY(-10px); }
    }

    /* 배치 요소(z-index:0)는 흐름 속 글자보다 위에 그려진다 — 워드마크·슬로건이
       도형에 덮이지 않게 명시적으로 올린다. */
    .login-brand h1, .login-brand p, .login-brand .hero-stage { position: relative; z-index: 1; }
    /* 660px 브랜드 면에서 40px 워드마크는 280px 마스코트와 18px 굵은 슬로건
       사이에 묻힌다. 데스크톱만 한 단 올리고, 좁은 화면은 아래에서 40px로
       되돌려 브랜드가 화면을 밀어내지 않게 한다. */
    .login-brand .brand-wordmark { font-size: 48px; }
    /* 오른쪽 폼의 시작점을 분명히 하되, 브랜드 워드마크(48px)보다는 한 단계
       아래에 둔다. 설명·필드 라벨과의 간격은 기존 리듬을 유지한다.
       28px Bold 는 업무 화면에선 소리치지만(그래서 페이지 제목은 22px 이다)
       여기선 맞다 — 로그인은 드문 브랜드 접점이고, 왼쪽 48px 워드마크와
       마주 서는 자리라 Medium 으로는 밀린다. .login-brand 에만 원근을
       허용한 것과 같은 종류의 예외다. */
    .login-form-title { font-size: 28px; }  /* 굵기·색은 .headline(800·--text-title) 그대로 */

    /* 로그인 히어로는 드문 브랜드 접점이라 여기만 3D 깊이를 허용한다.
       마스코트 앞뒤에 문서 두 장을 놓고, 포인터 기울기는 app.js가 최대 2도만
       직접 건다. 로그인 이후 업무 화면에는 이 원근을 가져가지 않는다. */
    .login-brand { perspective: 900px; }
    .hero-stage { position: relative; display: flex; justify-content: center;
                  align-items: flex-end; width: 300px; min-height: 280px;
                  margin-bottom: 36px; transform-style: preserve-3d;
                  will-change: transform; }
    /* 실제 문서 이미지를 추가하지 않고 제품의 종이·형광펜 어휘만 추상화한다.
       두 장 모두 최초 진입 때 한 번 제자리로 앉고 이후에는 정지한다. */
    .hero-doc { position: absolute; z-index: 0; width: 88px; height: 116px;
                border: 1px solid rgba(255,255,255,.52); border-radius: var(--r-md);
                background:
                  linear-gradient(90deg, rgba(250,190,83,.72) 0 30%, transparent 30%) 14px 25px / 38px 4px no-repeat,
                  repeating-linear-gradient(to bottom, rgba(32,70,126,.18) 0 2px, transparent 2px 10px) 14px 44px / 60px 48px no-repeat,
                  rgba(247,243,239,.94);
                box-shadow: 0 16px 30px rgba(2,14,40,.18); opacity: 0;
                backface-visibility: hidden; }
    .hero-doc::after { content:""; position:absolute; right:9px; top:10px;
                       width:14px; height:14px; border-radius:4px;
                       background:rgba(76,151,214,.28); }
    /* 안착 깊이를 -48/-64 → -26/-38 로 당겼다. 뒤로 밀려 있으면 원근 때문에
       작아져서 "마스코트 뒤 얼룩" 이 되는데, 이 두 장은 검토할 문서 그 자체라
       읽혀야 한다. 도착 투명도도 .92 → 1 이다 — 마스코트는 불투명한데 문서만
       비치면 같은 장면에 있는 물건으로 안 보인다. 들어오는 자리(--doc-from)는
       그대로 뒤에 둔다: 뒤에서 앞으로 나오는 거리가 늘어난 만큼 등장이 또렷해진다. */
    .hero-doc-left {
      left: -2px; top: 60px;
      --doc-from: translate3d(34px, 18px, -72px) rotateY(20deg) rotateZ(-13deg);
      --doc-rest: translate3d(0, 0, -26px) rotateY(16deg) rotateZ(-10deg);
      animation: heroDocIn .8s var(--ease-out) .12s both;
    }
    .hero-doc-right {
      right: -4px; top: 35px;
      --doc-from: translate3d(-32px, 20px, -92px) rotateY(-22deg) rotateZ(14deg);
      --doc-rest: translate3d(0, 0, -38px) rotateY(-17deg) rotateZ(10deg);
      animation: heroDocIn .8s var(--ease-out) .2s both;
    }
    @keyframes heroDocIn {
      0% { opacity: 0; transform: var(--doc-from); }
      100% { opacity: 1; transform: var(--doc-rest); }
    }
    /* 발밑 접지 그림자. 배경에 공간감이 생기면서 두 겹으로는 마스코트가 면 위에
       오려 붙인 것처럼 떴다. 가장 넓은 세 번째 겹(200px)을 더해 바닥으로
       잦아들게 한다 — 진하게가 아니라 **넓게** 다. 상자를 300 → 440 으로 키운
       건 그 겹이 잘리지 않게 하려는 것뿐이고, 폭 기준의 -51% 보정도 따라간다.
       bottom 은 눈으로 정하지 말고 계산해서 넣을 것. PNG 아래쪽엔 투명 여백이
       있어서(현 자산 login_hero 는 7.8% · 280px 기준 약 22px) 상자 바닥이 곧
       발바닥이 아니다:
           bottom = -(상자 높이 / 2 - 발바닥 여백)   →  78/2 - 22 = -17
       **PNG 를 갈면 이 값도 다시 재야 한다.** 여백 비율은 자산마다 다르다
       (직전 671×900 자산은 6.0% 였고 -27 이었다). 재는 법:
           ffmpeg -v verbose -i x.png -vf "alphaextract,cropdetect=limit=1:round=1:skip=0" -f null -
       한 번 틀렸다. 상자 높이만 56 → 78 로 키우고 bottom 을 -14 에 두는 바람에
       그림자 중심이 11px 위로 올라가 마스코트 몸통 **뒤에 숨었고**, 발이 뜬 채로
       두 번 넘어갔다. 높이를 건드리면 bottom 도 같이 건드려야 한다.
       그리고 위치를 고친 뒤에도 안 보였다 — 코어 타원이 76px 이라 발 간격
       (≈165px)보다 좁아 두 발 **사이에** 들어가 발등에 가려 있었다. 접지
       그림자는 딛는 폭보다 넓어야 한다. 마스코트만 숨겨 놓고 보면 금방 안다. */
    .hero-stage::after { bottom: -17px; left: 50%; width: 440px; height: 78px;
      content: ""; position: absolute; z-index: 0;
      transform: translateX(-50.7%);
      /* 알파는 히어로를 키운 뒤 다시 잡은 값이다. zoom 은 크기를 끌고 가지만
         **농도는 못 끌고 간다** — 같은 알파가 넓어진 면에 퍼지면서 옅어진다.
         폭(56 → 120)은 위 주석의 발 간격 문제 때문이다. */
      background:
        radial-gradient(ellipse 120px 9px at 50% 50%, rgba(2,14,40,.42) 0%,
                                                      rgba(2,14,40,.20) 54%, transparent 78%),
        radial-gradient(ellipse 150px 19px at 50% 52%, rgba(2,14,40,.15) 0%, transparent 72%),
        radial-gradient(ellipse 210px 30px at 50% 53%, rgba(2,14,40,.08) 0%, transparent 76%); }
    .hero-mascot { position: relative; z-index: 1; height: 280px; width: auto;
                   object-fit: contain;
                   filter: drop-shadow(-4px 10px 16px rgba(3,18,48,.24));
                   animation: heroMascotIn .8s var(--ease-out) .08s both; }
    @keyframes heroMascotIn {
      0% { opacity: 0; transform: translate3d(0, 14px, 18px) scale(.97); }
      100% { opacity: 1; transform: translate3d(0, 0, 18px) scale(1); }
    }
    /* 돋보기 렌즈 위를 한 번만 통과하는 빛. PNG 자체의 반사를 덮지 않도록
       투명도를 낮추고 렌즈 원 안에서만 잘라낸다.
       **이 네 값은 마스코트 PNG 에 종속이다.** 자산을 갈면 다시 재야 한다 —
       안 재면 빛이 유리를 벗어나 얼굴 위로 흐른다(실제로 hero3 로 갈면서
       글린트가 렌즈보다 커지고 14px 밀렸다).
       재는 법: PNG 에서 돋보기 링의 파랑 픽셀 bbox 를 잡아 중심·지름 비율을 얻고,
           이미지폭 = 280 × 종횡비 · 좌여백 = (300 − 이미지폭) / 2
           left = 좌여백 + 중심x비율 × 이미지폭 − 글린트지름/2
           top  = 중심y비율 × 280 − 글린트지름/2
           글린트지름 = 링 바깥지름 × 0.86   (유리는 링 안쪽이라 조금 작게)
       현 자산(login_hero, ar 0.667 · 중심 0.349/0.380 · 지름비 0.495) 기준 값. */
    /* 히어로가 이 면의 주인공이다. 280px 로는 워드마크·슬로건과 셋이 비슷한
       무게로 나란히 서서 "그림 하나 얹은 파란 면" 이 됐다.
       **크기의 상한을 정하는 건 구도가 아니라 원본이다.** 1.35(378px) → 1.15(322px)
       까지 올려 봤는데 둘 다 부담스러웠고, 부담의 정체는 구도가 아니라 화질이었다:
       3D 렌더 특유의 물렁한 가장자리가 키울수록 그대로 드러난다.
       바꾸려면 zoom 을 올릴 게 아니라 **PNG 를 더 큰 걸로 갈아야 한다.**

       1.08 인 이유는 크게 하려는 게 아니라 **되돌리려는** 것이다. login_hero 는
       앞 자산보다 종횡비가 좁고(0.745→0.667) 내용이 프레임을 덜 채운다(93%→86%).
       그래서 같은 height:280px 에서 실효 크기가 8% 작아졌다 — 1.08 은 그 8% 를
       메워 눈으로 합의한 크기로 되돌리는 값이다. 자산을 갈면 다시 계산할 것:
           zoom = (이전 내용충전율 0.933) / (새 자산 내용충전율)
       높이만 키우면 접지 그림자·렌즈 빛·문서 두 장이 전부 280px 기준에 남아
       따로 논다. zoom 이면 그 넷을 한 숫자로 함께 끌고 간다(좁은 화면에서
       .46 으로 줄이는 것과 같은 수법이다). */
    .login-brand .hero-stage { zoom: 1.08; }

    /* 로그인 split 모달: 좁은 화면에서 세로로 쌓기 */
    @media (max-width: 760px) {
      .auth-canvas { align-items: flex-start !important; overflow-y: auto !important; }
      .login-modal { flex-direction: column; min-height: 0; max-width: 420px;
                     margin: 0 auto; flex: none; }
      .login-brand, .login-form { width: 100%; box-sizing: border-box; }
      .login-brand { padding: 32px 28px; }
      /* 히어로는 통째로 줄인다. 마스코트 높이만 줄이면 접지 그림자·빛은 280px
         기준 그대로 남아 발밑을 벗어난다 — 비율을 손으로 다시 맞추지 않도록
         zoom 으로 함께 줄인다(앱 아트보드와 같은 수법). 여백도 zoom 을 타므로
         실제 16px 을 얻으려면 그만큼 키워 적는다. */
      .login-brand .hero-stage { zoom: .46; margin-bottom: 36px; }
      /* 문서 면은 뺀다 — 이 폭에서는 잘린 조각만 보여 얼룩이 된다. */
      .bp-doc { display: none; }
      .login-brand .brand-wordmark { font-size: 40px; }
      .login-form-title { font-size: 22px; }
      .login-form { padding: 32px 28px; }
    }
    /* 진행 레일의 한 줄(.prog-row — 접힌 패널 .rail 과 다른 것이다). 레퍼런스의 오른쪽 목록처럼 체크 + 이름 한 줄이고,
       눌러서 그 요건으로 간다. 목록 안에서만 사는 줄이라 hover 는 조용하다. */
    .prog-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px;
                border-radius: var(--r-sm); cursor: pointer;
                transition: background .15s var(--ease-out); }
    .prog-row:hover { background: var(--state-hover-brand); }
    .prog-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* <details> 로 접는 자리(비교 요약의 "맞댄 문서", 범위 안내). list-style:none
       만으로는 사파리·구형 크롬에서 삼각형이 남으므로 벤더 마커도 함께 지우고,
       접힘 상태는 우리가 그린 v 표시가 말한다 — 브라우저마다 다른 삼각형이
       나오면 같은 화면이 기기마다 다르게 보인다. */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::after {
      content: "⌄"; margin-left: 6px; display: inline-block;
      font-size: 13px; line-height: 1; opacity: .6;
      transition: transform var(--dur-1) var(--ease-out); }
    details[open] > summary::after { transform: rotate(180deg); }
    details > summary:hover { color: var(--accent-ink); }

    /* 비교 결과 위쪽은 설명 카드가 아니라 상태 바다. 검토 방법은 선택한 항목
       안에서 바로 설명하고, 여기서는 남은 일과 문서 쌍만 한 줄로 확인한다. */
    .results-head[data-compare-head] { padding-top: 10px; padding-bottom: 6px; }
    .cmp-statusbar { position: relative; flex: none; min-height: 42px; display: flex;
                     align-items: center; gap: 10px; margin: 0 var(--results-pad) 8px;
                     padding: 6px 10px; box-sizing: border-box; background: var(--panel);
                     border: 1px solid var(--line); border-radius: var(--r-md); }
    .cmp-status-primary { min-width: 0; display: flex; align-items: center; gap: 8px; }
    .cmp-status-label { flex: none; color: var(--accent-ink); font-size: 12px; font-weight: 700; }
    .cmp-status-primary > strong { flex: none; color: var(--text); font-size: 13px; }
    .cmp-overview-docs { display: flex; align-items: center; gap: 8px; min-width: 0;
                         color: var(--text-3); font-size: 12px; }
    .cmp-overview-docs span { min-width: 0; max-width: 180px; overflow: hidden;
                              text-overflow: ellipsis; white-space: nowrap; }
    .cmp-summary-tags { min-width: 0; display: flex; gap: 4px; margin-left: auto; }
    .cmp-summary-tags span { padding: 2px 6px; border-radius: var(--r-sm); white-space: nowrap;
                             background: var(--bg); color: var(--text-2); font-size: 12px; }
    .cmp-summary-tags span.is-alert { background: var(--bg); color: var(--text); font-weight: 600; }
    .cmp-summary-tags b { margin-left: 4px; font-variant-numeric: tabular-nums; }
    .cmp-status-progress { flex: none; color: var(--text-2); font-size: 13px;
                           font-variant-numeric: tabular-nums; }
    .cmp-ai-line { max-width: 180px; overflow: hidden; color: var(--text-2); font-size: 13px;
                   text-overflow: ellipsis; white-space: nowrap; }
    .cmp-scope-warning { position: relative; flex: none; }
    .cmp-scope-warning summary { display: flex; align-items: center; gap: 4px; padding: 4px 8px;
                                 border-radius: var(--r-sm); background: var(--bg);
                                 color: var(--text-2); font-size: 13px; font-weight: 600;
                                 cursor: pointer; white-space: nowrap; }
    .cmp-scope-warning summary svg { width: 14px; height: 14px; }
    .cmp-scope-warning > div { position: absolute; z-index: 30; top: calc(100% + 8px); right: 0;
                               width: 360px; padding: 12px 14px; background: var(--panel);
                               border: 1px solid var(--line); border-radius: var(--r-md);
                               box-shadow: var(--shadow-md); }
    .cmp-scope-warning > div strong, .cmp-scope-warning > div span { display: block; }
    .cmp-scope-warning > div strong { color: var(--text); font-size: 12px; line-height: 1.4; }
    .cmp-scope-warning > div span { margin-top: 4px; color: var(--text-2); font-size: 13px; line-height: 1.6; }
    @media (max-width: 900px) {
      .cmp-ai-line, .cmp-summary-tags { display: none; }
      .cmp-status-progress { margin-left: auto; }
    }

    /* ── 비교 결과: 한 줄 띠 · 목록 · 서술 두 장 · 판정 독 ───────────────
       한 화면의 일은 하나(요건 하나 보고, 근거 보고, 버튼 하나). 점은 항목 상태,
       ⚠ 는 결과에 붙는 주의 — 둘만 쓴다. */
    .cmp-strip { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px;
                 margin: 10px var(--results-pad) 8px; padding: 6px 12px; box-sizing: border-box;
                 background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
                 white-space: nowrap; overflow: hidden; }
    .cmp-strip .grow, .trace-dock .grow, .td-head .grow { flex: 1; }
    .cmp-strip-docs { min-width: 0; display: flex; align-items: center; gap: 6px;
                      color: var(--text-2); font-size: 12px; font-weight: 600; }
    .cmp-strip-docs > span { flex: 0 1 auto; min-width: 110px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
    .cmp-strip-docs { flex: 0 1 auto; min-width: 0; overflow: hidden; }
    .cmp-strip-docs i { display: inline-flex; color: var(--text-3); }
    .cmp-strip-stat { flex: none; margin-left: 6px; font-size: 13px; }
    .cmp-strip-stat b { font-weight: 700; color: var(--text); }
    .cmp-strip-stat em { font-style: normal; margin-left: 4px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .cmp-strip-err { font-size: 12px; font-weight: 600; color: var(--sev-maj-fg); }
    .cmp-strip-kbd { flex: none; font-size: 11px; color: var(--text-3); }
    .cmp-strip > [data-act="newReview"] { flex: none; padding: 4px 8px; font-size: 13px; }
    /* 라벨 알약 한 벌. 어느 화면이든 같은 높이·같은 공식(연한 면 + 진한 글자, 테두리 없음).
       색은 심각도(crit·maj·min·info)·판정(good)·중립뿐 — 새 색을 여기 더하지 않는다. */
    .pill { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 2px 8px;
            border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .pill-crit { background: var(--sev-crit-bg); color: var(--sev-crit-fg); }
    .pill-maj { background: var(--sev-maj-bg); color: var(--sev-maj-fg); }
    .pill-neutral { background: var(--neutral-weak); color: var(--text-2); }
    .pill-outline { background: transparent; border: 1px solid var(--line-2); color: var(--text-3); }
    .pill-min { background: var(--sev-min-bg); color: var(--sev-min-fg); }
    .pill-info { background: var(--sev-info-bg); color: var(--sev-info-fg); }
    .pill-good { background: var(--band-good-bg); color: var(--band-good-fg); }
    .tq-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tq-dot-good { background: var(--band-good-fg); }
    .tq-dot-maj { background: var(--sev-maj-dot); }
    .tq-dot-min { background: var(--sev-min-dot); }
    .trace-queue-head > div { flex-wrap: wrap; }
    .tq-legend { flex-basis: 100%; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
                 color: var(--text-3); font-size: 11px; font-weight: 500; }
    .tq-legend .tq-dot { margin: 0 2px 0 6px; }
    /* 두 줄 행: [점] [ID ……… 판정] / [제목 한 줄]. 판정한 행은 점이 죽어 남은 행만 색으로 튄다. */
    .trace-queue-item { display: grid; grid-template-columns: 8px 1fr auto; grid-template-rows: auto auto;
                        align-items: center; column-gap: 8px; row-gap: 2px; min-height: 40px; }
    .trace-queue-item .tq-dot { grid-row: 1; }
    /* 제목은 두 줄까지 — 한 줄에서 자르니 긴 제목 꼬리가 사라졌다. 전체는 툴팁(title 속성). */
    .trace-queue-item .trace-queue-title { grid-column: 2 / -1; grid-row: 2; -webkit-line-clamp: 2;
                                           font-size: 13px; color: var(--text-2); }
    .trace-queue-item.is-done .trace-queue-id, .trace-queue-item.is-done .trace-queue-title { color: var(--text-3); }
    .trace-queue-item.is-done .tq-dot { background: var(--neutral-dot); }
    /* 판정 직후 한 번 밝아졌다 가라앉는다(app.js setRtmVerdict). 한 번짜리라 keyframes. */
    .trace-queue-item.is-judged { animation: judgedFlash var(--dur-3) var(--ease-out); }
    @keyframes judgedFlash { 0% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
    .tq-verdict { min-height: 20px; padding: 0 6px; font-size: 11px; }
    .trace-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .td-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 8px; }
    .rid-big { font-size: 18px; font-weight: 700; color: var(--text-title); }
    .mut { color: var(--text-3); font-size: 12px; }
    .trace-main .trace-detail { padding: 0 20px 14px; }
    .trace-main .trace-evidence-grid { margin-top: 0; }
    .trace-source .loc { color: var(--text-3); font-size: 12px; font-weight: 600; }
    .trace-main .trace-source-body { max-height: none; min-height: 120px; overflow: visible; }
    .trace-main .trace-source { overflow: visible; }
    .trace-main .trace-evidence-grid { align-items: start; }
    .trace-source .none { font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
    .trace-source .none b { color: var(--text); }
    .trace-source .sub { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 10px 0 6px; }
    .cand { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline;
            margin-bottom: 6px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
            background: var(--panel); color: var(--text); text-align: left; font: inherit; font-size: 13px; cursor: pointer; }
    .cand:hover { border-color: var(--accent); background: var(--state-hover-brand); }
    .cand-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cand .shared { grid-column: 2; font-size: 12px; color: var(--text-3); }
    .ai-block { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm);
                background: var(--bg); border: 1px solid var(--line-2); font-size: 13px; }
    /* 찾은 결과도 흰 면 — 초록은 머리의 알약 하나가 진다. 면을 초록으로 칠하니 카드 안에서 제일 큰 색이 됐다. */
    .ai-block.is-found { background: var(--panel); margin-top: 0; margin-bottom: 12px; }
    .ai-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ai-head > .pill { margin-right: 6px; }
    /* 글자 링크 = 누르는 것. 배지와 갈라 보이게 **밑줄**을 준다 — 색만으로는 상태
       칩과 구별이 안 됐다(2026-09-08). 배지는 알약(999px)·테두리 없음·강조색 없음. */
    .ai-head .lnk, .lnk { padding: 0; border: 0; background: none; color: var(--accent-ink); font: inherit;
                          font-size: 12px; font-weight: 600; cursor: pointer;
                          text-decoration: underline; text-underline-offset: 2px; }
    .lnk:hover { color: var(--accent-strong); }
    .tq-verdict, .vd, .rtm-status, .tq-legend, .cmp-strip .pill { border-radius: 999px; cursor: default; }
    .ai-found-quote { margin-top: 6px; }
    .ai-cells { display: flex; flex-wrap: wrap; gap: 4px 6px; }
