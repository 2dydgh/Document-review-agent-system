<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocSuree · 문서 일관성 검토 Agent</title>
  <link rel="icon" href="favicon.ico?v=20260813-touch-fullbleed" sizes="48x48">
  <link rel="icon" href="favicon-32.png?v=20260813-touch-fullbleed" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16.png?v=20260813-touch-fullbleed" type="image/png" sizes="16x16">
  <!-- iOS 는 홈 화면 아이콘의 알파를 무시하고 검정에 얹는다. 그래서 이 자산만
       투명 실루엣이 아니라 브랜드 파랑 풀블리드다(파비콘은 실루엣 그대로).
       ?v= 는 위 셋과 달리 이 파일만 바뀌어서 따로 간다. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260813-touch-fullbleed">
  <!-- 서체를 **미리 받는다.** 없으면 브라우저가 CSS 를 다 읽고 그 글자를 실제로
       만난 뒤에야 받기 시작해서, 화면이 한 번 그려졌다가 서체가 도착할 때 다시
       그려진다 — 차가운 캐시(Ctrl+Shift+R)에서 "버벅이며 뜬다"의 정체다.
       crossorigin 은 폰트 요청이 익명(CORS)으로 나가기 때문에 필수다. 빼면
       preload 로 받은 것을 CSS 가 못 쓰고 **두 번 받는다.**
       본문 서체가 먼저다 — 화면의 글자 대부분이 그것이고, 제목 서체는 몇 줄뿐이다. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="public/fonts/WantedSansVariable.woff2">
  <style>
    /* 서체는 두 벌뿐이고 전부 로컬(public/fonts/)이다 — 사내망에서 CDN 은 안 뜬다.
       (예전엔 Inter·Pretendard·Spoqa 를 CDN 으로 더 부르고 있었는데 CSS 가 하나도
        안 쓰거나 폴백으로만 걸려 있었다 — 로드만 하는 폰트는 지운다.)
       서체는 Wanted Sans Variable 하나다(위계는 굵기 축으로). 제목 서체를
       따로 두려고 Gmarket → Plex → 나눔스퀘어 → Paperlogy 를 차례로 시험했지만
       매번 "본문과 따로 논다"로 되돌렸다. 2026-09-16 에 한 서체로 확정 —
       제목은 800 으로 세운다(900 은 18px 에서 속이 막힌다). */
    @font-face { font-family:'Wanted Sans Variable'; font-weight:100 900; font-display:swap;
      src:url('public/fonts/WantedSansVariable.woff2') format('woff2-variations'); }
    /* woff2 를 먼저 댄다 — 같은 서체가 woff 로는 1.24MB, woff2 로는 826KB 다.
       woff 는 폴백으로 남긴다: 브라우저는 지원하는 첫 형식 하나만 받으므로
       둘을 적어도 받는 양은 안 늘고, 사내망의 옛 브라우저가 있어도 안 깨진다. */
    :root {
      /* Lexicon Precision — legal-tech, document-first, minimalist-professional
         ─────────────────────────────────────────────────────────────────────
         색은 **역할 셋**으로만 쓴다. 참고안(bentogrid_brown)이 갈색 하나로
         화면을 묶고, 옅은 갈색으로 바탕을 깔고, 옅은 초록 하나만 포인트로
         쓰는 것과 같은 구조다. 토큰은 원래 다 있었는데 이름이 역할이 아니라
         정체(accent·gold·band-good)라서 쓰는 사람마다 다른 것을 골랐다.

           브랜드   --brand-primary / --brand-secondary / --brand-accent
                    마스코트의 딥 블루·깃털 크림·부리 골드. 정체성과 브랜드 장면을 맡는다.
           메인색   --accent / --accent-ink / --accent-strong
                    Primary에서 파생한 동작색. 누를 수 있는 것 · 지금 고른 것 · 진행 중인 것.
                    "이건 앱이 하는 일"이라고 말하는 자리 전부.
           (웜 톤 포인트는 **화면에 안 쓴다.** 크림·탠 받침 면, 브라운·골드
                    숫자까지 한 바퀴 다 대 본 결론이다(2026-08-14) — 화면은 주색
                    톤온톤으로 가고, 크림·골드는 마스코트·워드마크가 진다.)
           배경색   --bg / --panel / --state-hover-neutral
                    브랜드 쪽으로 아주 살짝 기운 중성면. 중립 목록·메뉴의 hover만
                    이 토큰을 쓴다(캔버스 → 카드 → 중립 hover).
           상태색   --state-hover-brand / --accent-weak
                    파란 글자·테두리가 있는 보조 동작의 hover와 선택 상태를 분리한다.
                    hover는 더 옅고, 선택 상태는 오래 남으므로 한 단계 분명하다.
           포인트색 --band-good-fg / --band-good-bg
                    초록. **좋은 소식 하나에만** 쓴다 — "지적 없음".
                    메인색과 안 겹쳐야 "괜찮다"가 "누를 수 있다"로 안 읽힌다.

         이 셋 밖은 신호색이고 뜻이 정해져 있다: 심각도 --sev-*(주황·노랑·회색),
         문서 위 형광펜 --sev-*-hl, 반영 확인 --sev-past-*. 장식으로 쓰지 말 것.
         ───────────────────────────────────────────────────────────────────── */
      /* 앱 캔버스는 브랜드색이 아니라 기존의 조용한 웜 그레이로 둔다.
         Secondary 크림은 로고·로그인처럼 의도적인 브랜드 장면에만 쓴다. */
      --bg: #F5F6F8;
      --panel: #FFFFFF;       /* 면은 순백 — 레퍼런스 세계는 종이가 아니라 화면이다 */
      --panel-glass: rgba(255, 254, 252, 0.55); /* login material */
      /* 경계선은 브랜드 크림과 분리한 기존 웜 그레이 계열이다. 카드가 베이지색
         외곽선으로 둘러싸여 보이지 않도록 색차보다 명도 차이만 작게 둔다. */
      --line: #E4E7EC;
      --line-2: #F0F2F5; /* subtle divider — hover 면과 명확히 분리 */
      /* --line 보다 한 단 또렷한 윤곽. 드롭존 점선과 검토 기준의 빈 체크박스가
         쓴다 — 둘 다 "아직 안 채워진 자리"라 --line 으로는 눈에 안 걸린다. */
      --line-dashed: #C6CDD6;
      /* 공용 hover는 브랜드 크림이 아니라 기존의 옅은 웜 그레이다. 넓은 최근 검토
         행에서도 면이 진하게 솟지 않으면서 사이드바·프로필과 같은 반응을 준다. */
      --state-hover-neutral: #F3F5F8; /* row / nav / menu hover */
      --state-selected-neutral: #E1E5EB; /* 활성 메뉴 — hover(#F3F5F8) 보다 두 단 진한 회색 면. 한 단(#E8EBF0)은 "solid 가 없어졌나" 소리를 들었다 */
      /* 따뜻한 종이색 위에 순검정 대신 갈색 기가 아주 약한 차콜을 쓴다.
         본문 위계도 같은 온도 안에서 명도만 벌린다. */
      --text: #1B1F26;        /* on-surface · 캔버스 위 15.1:1 */
      --text-2: #4A515C;      /* on-surface-variant · 7.7:1 */
      /* 800 제목 전용 잉크(2026-09-16). 800 은 잉크가 많아 --text 그대로면 검정 도장으로
         읽혀, 면 쪽으로 12% 만 섞어 살짝 든다. 새 색이 아니라 --text 의 파생이라
         다크에서는 따로 안 적는다(--text·--panel 이 바뀌면 같이 바뀐다). */
      --text-title: color-mix(in srgb, var(--text) 88%, var(--panel));
      /* 홈 타일 제목 전용 차콜. 본문 검정보다 한 단계 부드럽지만
         --text-2까지 흐려지지 않아 15px 카드 제목의 위계를 지킨다. */
      --home-title: var(--text);
      /* muted meta. 11~12px 라 4.5:1 을 넘겨야 한다. */
      --text-3: #667085;      /* 캔버스 위 5.4:1 · 패널 위 5.8:1 */
      /* 마스코트에서 추출한 공식 색. 돋보기의 진한 블루가 동작과 정밀함,
         깃털 그림자 크림이 종이 바탕을 맡는다. 밝은 렌즈 블루는 글자를 받지
         않는 진행·스캔 그래픽에만 써 두 파랑이 경쟁하지 않게 한다.
         로그인 히어로를 더 선명한 렌더로 갈면서 돋보기 테가 #277EF0(채도 87%)
         으로 왔는데, 그 색은 **되돌렸다.** 화면에서 그것만 발광했다 —
         버튼도 면도 전부 차분한 파랑인데 돋보기 하나가 다른 세계에서 온 물건처럼
         보였다. 지금은 #4C97D6(채도 65%)이다.
         고른 근거는 취향이 아니라 **다른 자산이 이미 정해 놓은 값**이다:
         헤더 로고 #5898D8 · apple-touch-icon #5898D8 · 홈 마스코트 #4898D8.
         로고는 같은 문제(파란 원반 위의 돋보기)를 색상이 아니라 **명도**로
         풀어 놨고, 히어로도 같은 자리에 세운 것이다. 로그인 직후 좌상단에
         그 로고가 붙는다 — 2초 사이에 같은 캐릭터가 도구 색을 바꿔 들면 안 된다.
         참고로 brand/source/logo-mark-legacy-blue-192.png 의 #1878F8 이
         그 쨍한 파랑이다. 파일명이 legacy 인 건 한 번 쓰고 물렸다는 뜻이다. */
      --brand-primary: #356998;
      --brand-secondary: #F2E0D4;
      --brand-highlight: #4C97D6;
      --brand-deep: #284F73;
      /* 마스코트 부리에서 가져온 공식 Accent(전 --brand-wordmark — 브랜드 3색을
         정립하며 역할 이름으로 바꿨다). 큰 `Suree`와 캐릭터에만 쓴다.
         화면 포인트로 꺼내는 실험(골드·브라운 숫자)을 했다가 주색 톤온톤으로
         결론 냈다(2026-08-14) — 버튼·칩·작은 글씨에는 확장하지 않는다. */
      --brand-accent: #FABE53;
      --accent: var(--brand-primary); /* 로고·아이콘·진행·포커스 */
      --accent-ink: var(--brand-primary);/* 밝은 배경 위 링크·활성 글자 · 7.22:1 */
      --accent-strong: var(--brand-deep);/* 브랜드 면 hover / pressed */
      /* --accent 의 RGB 채널. rgba() 는 hex 변수를 못 받아서 그림자·선택색·연한
         배경처럼 알파가 필요한 곳은 이 토큰을 쓴다. --accent 를 바꾸면 같이 바꿀 것. */
      --accent-rgb: 53,105,152;
      --state-hover-brand: rgba(var(--accent-rgb),.065); /* branded tertiary action hover */
      --accent-weak: rgba(var(--accent-rgb),.12); /* selected / persistent blue surface */
      /* Primary는 흰 글자와 5.79:1이라 버튼·활성 나브에 그대로 쓴다. */
      --accent-surface: var(--brand-primary);
      --neutral: #9A8D84;
      --neutral-strong: #E4E7EC;/* 면 전용 */
      --neutral-ink: #5E544D;/* neutral-weak 면 위 글자 */
      --neutral-weak: rgba(122,103,91,.11);
      /* 심각도 — 브랜드색과 분리된 신호색. 주황·빨강은 여기서만 쓴다. */
      --sev-crit-bg: rgba(220, 38, 38, 0.1);
      --sev-crit-fg: #B91C1C;
      --sev-crit-bd: rgba(220, 38, 38, 0.2);
      --sev-maj-bg: rgba(234, 88, 12, 0.1);
      --sev-maj-fg: #C2410C;
      --sev-maj-bd: rgba(234, 88, 12, 0.2);
      --sev-min-bg: rgba(202, 138, 4, 0.1);
      --sev-min-fg: #854D0E;   /* 연한 노랑 면 위 6.21:1 (전 #A16207 은 4.46) */
      --sev-min-bd: rgba(202, 138, 4, 0.2);
      /* Info 는 최하위 등급이라 색을 빼고 슬레이트로 끝맺는다. 예전엔 파랑이었는데
         브랜드가 파랑이 되면서 "정보 등급"과 "브랜드 강조"가 구분되지 않았다. */
      --sev-info-bg: rgba(100, 116, 139, 0.1);
      --sev-info-fg: #475569;
      --sev-info-bd: rgba(100, 116, 139, 0.2);
      --sev-info-solid: #706D68; /* PDF 번호 배지 — 흰 글자 5.12:1 */
      /* **점 전용 색.** dot 은 통짜 색 조각이고 fg 는 연한 면 위 글자라 일이 다르다 —
         한 번 dot 을 fg 로 맞춰 봤더니(2026-08-12) --sev-min-fg 가 갈색이라 노랑
         경고의 점이 갈색이 됐다. fg 는 연한 노랑 면에서 6.21:1 을 내려고 어둡게
         고른 값이지 "노랑"을 뜻하라고 고른 값이 아니다.
         그렇다고 JS 에 hex 를 박으면 다크에서 안 뒤집힌다(views.js SEV·TM 이
         그랬다). 역할이 다르면 토큰을 **하나 더 만드는 것**이 답이다. */
      --sev-crit-dot: #DC2626;
      --sev-maj-dot:  #EA580C;
      --sev-min-dot:  #EAB308;
      --sev-info-dot: #64748B;
      --neutral-dot:  #9CA3AF;  /* 미검토·모름 — 심각도가 아니다 */
      /* PDF 형광펜. --sev-*-bg 와 값이 다른 이유는 **놓이는 바닥이 다르기** 때문이다.
         저쪽은 패널(테마 따라 뒤집힌다) 위의 칩 배경이고, 이쪽은 늘 흰 PDF 페이지
         위에 얹는 반투명 형광펜이다 — pdf.js 는 페이지를 반전하지 않으므로 다크에서도
         바닥이 희다. 그래서 여기엔 다크 오버라이드가 없다.
         예전에는 pdfview.js 에 hex 로 박혀 있었고, info 만 파랑이라 브랜드 강조색과
         구분되지 않았다(위 --sev-info-* 주석에서 이미 파랑을 버렸는데 여기만 남았다). */
      --sev-maj-hl: rgba(234, 88, 12, .30);
      --sev-min-hl: rgba(234, 179, 8, .38);
      --sev-info-hl: rgba(100, 116, 139, .28);
      /* 반영 확인 탭 전용. 거기서는 색이 심각도가 아니라 "지난 지적이 아직
         남아 있다" 한 가지를 말한다 — 심각도 3색 어느 것과도 안 겹쳐야
         두 탭이 다른 것을 말한다는 게 보인다.
         보라를 버리고 그래파이트(Slate 700)로 내렸다 — "지난 것"은 심각도가
         아니라 시간 상태라 유채색을 받을 이유가 없고, 화면의 유채색은
         파랑(브랜드)과 심각도만 남긴다. info 형광펜(Slate 500 · .28)과 톤이
         가깝지만 두 색은 다른 탭에 살고, 이 탭엔 번호 배지·'지난 판정' 라벨이
         같이 붙는다. */
      --sev-past-hl: rgba(51, 65, 85, .35);
      --sev-cand-hl: rgba(53, 105, 152, .16); /* 위치 후보 — 점선 테두리와 함께 */
      /* 번호 배지용 불투명 색(형광펜은 반투명이라 글자가 안 보인다). */
      --sev-past-solid: #334155;
      /* "이상 없음" 칩. 심각도색과 분리된 판정 신호색이고, 색은 테마에 따라
         뒤집힌다(다크 블록 참고).
         warn/bad 는 지웠다 — 점수(양호/개선 필요/위험)를 뺐기 때문이다. 지적이
         0건이라는 것은 검사 결과로 말할 수 있지만 "위험"은 말할 근거가 없었다.
         근거는 CLAUDE.md "기능 방침 — 점수". */
      --band-good-fg: #047857; --band-good-bg: rgba(16,185,129,.12);
      /* 검사 분류 칩(형식·표현·추적·검토 과정). 심각도가 아니라 **종류**라 위계 없이 대등한
         파스텔 — 같은 공식(연한 면 .12 + 같은 색상의 진한 글자)로 넷을 뽑았다. 참고:
         brand/source/reference/saas.png 의 20px 아이콘 칩. 색은 작은 칩 안에만 산다. */
      --cat-form-bg: rgba(37, 99, 235, .12);  --cat-form-fg: #1D4ED8;
      --cat-expr-bg: rgba(124, 58, 237, .12); --cat-expr-fg: #6D28D9;
      --cat-trace-bg: rgba(13, 148, 136, .12); --cat-trace-fg: #0F766E;
      --cat-process-bg: rgba(100, 116, 139, .12); --cat-process-fg: #475569;
      /* 유리 토큰 넷(--glass·-weak·-line·-line-strong)은 검토 진행 화면 전용이었다.
         그 화면이 홈·결과와 같은 불투명 패널로 내려오면서 쓰는 곳이 사라져 지웠다.
         반투명은 이제 로그인 계열의 --panel-glass 하나뿐이다. */
      --shimmer: rgba(255,255,255,0.5);   /* 진행바 반짝임 sweep — 라이트: 흰빛 */
      /* 서체는 Wanted Sans 하나 — 제목도 본문도 같은 서체, 위계는 굵기와 크기로만.
         --font-display 는 본문의 별칭으로 남긴다(제목 자리를 표시하는 이름표).
         Wanted 두께 사다리(축 100~900): 400 본문 · 500 조용한 UI(나브·탭·메타)
         · 600 칩·뱃지·작은 강조(13px 이하의 상한) · 700 카드/섹션 제목
         · 800 은 18px+ 대표 제목·워드마크·22px+ 큰 통계 숫자(.headline·.page-title·
         인사말 — 2026-09-16, 제목을 700 에서 한 단 올렸다. 900 은 18px 에서
         속공간이 막혀 안 쓴다).
         한때 700 의 절반이 11~13px 칩에
         몰려 "제일 작은 글씨가 제일 굵은" 역전이 있었다 — 작은 글씨는 600 에서
         멈추고, 무게는 크기와 같은 방향으로만 는다(design_tokens 테스트가 지킨다).

         크기 사다리 — 11 · 12 · 13 · 14 · 15 · 18 · 22 · 28 · 40.
         한때 실제로 쓰이는 값이 18종이었다(9 · 10 · 12.5 · 13.5 · 16 · 17 · 19 ·
         20 · 24 가 섞여 있었다). 전부 사다리 안으로 접었다. **14 는 없애지 않고
         정식으로 들였다** — 38 회 쓰이고 라벨·본문 문단에 두루 걸려 있어, 오타가
         아니라 이미 자리를 잡은 단이었다. 다만 11~15 다섯 단이 연달아 붙어 있는
         것은 아직 부채다: "13 인가 14 인가"에 답할 규칙이 없다. 줄이려면 자리마다
         눈으로 봐야 한다.
         font-size 로 **아이콘 크기**를 주는 자리(ICONS 는 width:1em 이다)가 여섯
         군데 남아 있다(16 · 20 · 24px — .qs-icon 등). 글자 사다리와 다른 체계라
         접지 않았다. 세는 사람은 이 둘을 구별해야 한다.

         행간 사다리 — 1(큰 숫자·한 줄) · 1.2(큰 제목) · 1.4(작은 제목·조밀한 UI)
         · 1.6(여러 줄로 읽는 본문). 예전엔 14종이었고 1.45·1.5·1.55·1.6·1.65 가
         나란히 있었다 — 아무도 구별 못 하는 차이에 매번 판단 비용만 냈다.
         행간은 크기와 반대로 움직인다: 크면 좁게, 작으면 넓게. */
      --font-display: var(--font-body);
      --font-body: 'Wanted Sans Variable', system-ui, -apple-system, sans-serif;
      /* UI 본문 14–15px / 조작 14px / 설명 13px / 날짜·출처 12px.
         작은 글씨로 공간을 맞추지 않는다. 문서 원문과 아이콘 내부 글자는 별도다. */
      /* 모서리 — 예전엔 6·7·8·10·12·16·20·24 여덟 종류가 한 화면에 섞여 있었다.
         네 단이면 충분하다: 칩 → 카드 → 모달 → 벤토 타일. 값을 고르는 기준은
         "이 면이 얼마나 큰가" 하나다. */
      --r-sm: 6px;    /* 칩·작은 버튼·입력 */
      --r-md: 10px;   /* 카드·패널·드롭다운 */
      --r-lg: 10px;   /* 모달·드롭존·벤토 타일 */
      --r-xl: 16px;   /* 뱃지형 큰 요소 */
      /* 그림자 — 두 단. 인라인 rgba(0,0,0,...) 로 흩어져 있던 것을 모은다.
         다크에서 그림자는 더 진해야 한다(어두운 면 위에서 옅은 검정은 안 보인다)
         — 그래서 토큰이어야 한다. 인라인 값은 테마를 못 따라간다. */
      /* **얼마나 떠 있나**가 곧 그림자다. 값이 아니라 자리로 고른다.
           2  들린 것: 호버·드래그처럼 손이 닿아 잠깐 뜬 것.
           3  떠 있는 것: 팝오버·드롭다운·모달·상주 버튼. 화면 위에 별도로 뜬다.
         페이지에 얹힌 판(작업 패널·목록·타일)은 그림자가 없다 — 선으로만 묶는다.
         한때 1단(거의 안 뜸)이 있었는데 홈 타일만 안 쓰고 있어 화면마다 깊이가
         달랐다. 어차피 4% 라 안 보이던 것이라 통째로 뺐다(2026-09-04).
         그 전엔 3 을 큰 판들이 쓰고 있었다(실측 2026-09-03: 16 곳 중 추적표 판·
         사이드바·뷰어·요약 카드가 전부 3). 페이지에 얹힌 판이 팝오버의 그림자를
         입으니 화면이 통째로 붕 떠 보였다("음영이 어색하다"). */
      --sh-2: 0 2px 6px rgba(16,24,40,.05);
      --sh-3: 0 8px 24px rgba(16,24,40,.10);
      /* 모션 — 이징은 둘이면 충분하다. --ease-out 은 들어오는 것·hover·이동
         전부(빠르게 출발해 부드럽게 안착), --ease-spring 은 방금 끝난 것을
         살짝 튕겨 강조할 때(popIn)만. 지속시간 사다리는 **세 단**이다:
         .15s(hover 색·면) · .2s(transform·등장) · .3s(값이 실제로 이동하는 것 —
         진행바 폭·펼침·완료 강조). 세 번째 단은 원래 문서에 없었는데 코드에는
         .24s·.3s·.4s 로 흩어져 있었다 — 값이 먼 거리를 가는 전환은 hover 와 같은
         박자로 두면 튄다. 있는 것을 이름 붙여 접었지, 새로 만든 게 아니다.
         나가는 것은 이 앱이 렌더로 제거하므로 따로 두지 않는다.
         사다리 밖은 둘뿐이다: 무한 반복(spin·blobFloat 등)과 로그인 계열의
         **첫 등장 연출**(fadeUp .4~.8s + 단계 지연). 후자는 화면당 한 번만
         돌고 상호작용이 아니라, 같은 박자로 맞추면 오히려 급해 보인다.
         transform·opacity 위주로만 움직인다(GPU). */
      /* 움직임 사다리 — 크기·행간·모서리와 같은 이유로 값을 **집합**으로 막는다.
         한때 같은 종류의 등장 연출에 .15 · .2 · .3 · .4 · .6 · .8 여섯 값이
         섞여 있었다(2026-09-02 실측). 다양성이 아니라 표류다: 화면을 옮길 때마다
         감속이 미묘하게 달라 "정돈 안 된 느낌"으로 읽힌다.
           1 — 가까이서 즉시 뜨는 것(팝오버·드롭다운·토스트·모달 배경)
           2 — 화면 전환과 요소 등장. 이 앱의 기본값이다.
           3 — 목록 항목·완료 표시처럼 조금 더 머물러야 읽히는 것
         히어로 아트(.8s)만 예외다 — 그림은 UI 가 아니다(.hero-* 참고). */
      --dur-1: 150ms; --dur-2: 200ms; --dur-3: 300ms;
      --dur-page: 180ms;
      /* 자간 사다리 — 모서리·그림자·지속시간과 **같은 이유**로 값을 집합으로 막는다.
         한때 39곳에 16가지 값이 px·em 섞여 흩어져 있었다(실측 2026-09-03).
         추세는 맞았지만 함수가 아니었다: 같은 22px 에 -.035 · -.023 · -.01 이
         함께 있었고(3.5배), 12px 에서는 부호까지 갈렸다.
         **px 자간은 크기별이 될 수 없다** — 글자가 커져도 그대로라 큰 글자에서
         상대적으로 좁아지지 않는다. 그래서 전부 em 이다.
         가르는 규칙은 둘뿐이다:
           양수는 «의도된 넓은 라벨»(eyebrow·표머리·대문자) → --tr-caps
           음수는 «크기» → 26px↑ display · 17~25 title · 14~16 body · 13↓ meta
         작은 글자를 좁히지 않는 것이 핵심이다. 큰 글자는 자라면서 letter 사이가
         벌어져 보이므로 좁혀야 하지만, 작은 글자는 반대다 — 좁히면 뭉갠다.
         (한글은 특히 그렇다. 12px 에서 -.017em 을 쓰던 곳이 실제로 있었다.) */
      --tr-display: -.035em;  /* 26px↑  — 큰 수·히어로·페이지 제목 */
      --tr-title:   -.02em;   /* 17~25px — 화면·모달 제목 */
      --tr-body:    -.01em;   /* 14~16px — 본문·소제목 */
      --tr-meta:     0;       /* 13px↓  — 메타·설명. 좁히지 않는다 */
      --tr-caps:     .04em;   /* 대문자·eyebrow 라벨 — 일부러 벌린다 */
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --sidebar-shadow: 7px 0 22px rgba(79,56,44,.08);
    }
    /* app.js 의 setTheme 이 <html data-theme="dark"> 를 건다. 표면·글자만 뒤집고
       브랜드 2색은 그대로 둔다 — 로고 색은 테마를 따라 움직이지 않는다. */
    [data-theme="dark"] {
      /* 깃털 크림의 온도를 웜 차콜로 뒤집는다. 캔버스 → 패널 → 호버 → 선이
         모두 같은 갈색 기를 가져 다크 화면에서 청회색 조각이 튀지 않는다.
         캔버스와 패널은 **양쪽으로** 벌렸다(#1F1D1B/#282522 → #191715/#2B2825)
         — 그 간격에서는 카드가 배경과 한 덩어리로 보였다. 패널을 더 밝히는
         쪽으로만 벌리면 파랑 기준 타일이 패널에 묻힌다(≥2.5:1 가드가
         test_채운_면이_패널에_묻히지_않는다 에 있다) — 그래서 캔버스가 내려갔다. */
      --bg: #14161A;
      --panel: #1E2127;
      --panel-glass: rgba(30, 33, 39, 0.62);
      --line: #343943;
      /* 카드 테두리. 패널보다 어두우면 경계가 아예 안 그려진다 — 패널이 밝아진
         만큼 같이 올린다(패널 위 1.16:1 — 은은하지만 실재하는 선). */
      --line-2: #2A2E36;
      --line-dashed: #4A505B;
      --state-hover-neutral: #272B33;
      --state-selected-neutral: #353B47;
      --text: #F2F4F7;
      --text-2: #CDD3DC;
      /* 다크에서는 순백에 가까운 --text의 대비를 한 단계 누그러뜨린다. */
      --home-title: #DDE2EA;
      /* 작은 글씨(11~12px)라 4.5:1 을 넘겨야 한다. Slate 500 은 패널 위
         3.53:1 이라 사이드바의 소속 팀처럼 어두운 상자 위에서 안 읽혔다. */
      --text-3: #A2AAB8;      /* 패널 위 6.4:1 · 캔버스 위 7.1:1 */
      /* 다크의 선·아이콘은 마스코트 렌즈 블루로 밝히고, 흰 글자 채움은 공식
         Primary를 유지한다. 둘 다 마스코트 안의 같은 블루 계열이다. */
      --accent: #4C97D6;
      --accent-rgb: 76,151,214;
      --accent-strong: #284F73;
      --accent-ink: #9CC6E8;
      --state-hover-brand: rgba(var(--accent-rgb),.10);
      --accent-weak: rgba(var(--accent-rgb),.16);
      --accent-surface: #356998;
      --neutral: #A79B91;
      --neutral-strong: #413B36;
      --neutral-weak: rgba(174,162,152,.15);
      --neutral-ink: #D8CEC5;
      --sev-crit-bg: rgba(248, 113, 113, 0.15);
      --sev-crit-fg: #FCA5A5;
      --sev-crit-bd: rgba(248, 113, 113, 0.3);
      --sev-maj-bg: rgba(251, 146, 60, 0.15);
      --sev-maj-fg: #FDBA74;
      --sev-maj-bd: rgba(251, 146, 60, 0.3);
      --sev-min-bg: rgba(250, 204, 21, 0.15);
      --sev-min-fg: #FDE047;
      --sev-min-bd: rgba(250, 204, 21, 0.3);
      --sev-info-bg: rgba(148, 163, 184, 0.15);
      --sev-info-fg: #94A3B8;
      --sev-info-bd: rgba(148, 163, 184, 0.3);
      /* 어두운 바닥에서는 점도 한 단 밝혀야 보인다 — 라이트 값 그대로 두면
         패널(#1E2127) 위에서 진흙색으로 가라앉는다. */
      --sev-crit-dot: #F87171;
      --sev-maj-dot:  #FB923C;
      --sev-min-dot:  #FACC15;
      --sev-info-dot: #94A3B8;
      --neutral-dot:  #6B7280;
      /* "이상 없음" 칩: 어두운 배경 위에서 읽히게 밝은 파스텔로. bg는 살짝 진하게. */
      --band-good-fg: #6EE7B7; --band-good-bg: rgba(16,185,129,.18);
      --cat-form-bg: rgba(96, 165, 250, .16);  --cat-form-fg: #93C5FD;
      --cat-expr-bg: rgba(167, 139, 250, .16); --cat-expr-fg: #C4B5FD;
      --cat-trace-bg: rgba(45, 212, 191, .16); --cat-trace-fg: #5EEAD4;
      --cat-process-bg: rgba(148, 163, 184, .16); --cat-process-fg: #94A3B8;
      --shimmer: rgba(255,255,255,0.14);   /* 다크: 흰 막이 회색 상자로 안 보이게 옅게 */
      /* 어두운 면 위에서는 옅은 검정 그림자가 안 보인다 — 같은 단계라도 더 진하게.
         반경(--r-*)은 테마를 안 탄다: 모서리는 빛이 아니라 형태다. */
      --sh-2: 0 4px 12px rgba(0,0,0,.35);
      --sh-3: 0 8px 30px rgba(0,0,0,.40);
      --sidebar-shadow: 7px 0 22px rgba(0,0,0,.34);
    }
    /* 움직임을 줄여 달라고 한 사람에게는 줄인다. 검토 진행 화면의 장식 모션은
       통째로 걷어냈고, 남아 있는 스켈레톤·실제 진행 바·로딩 회전도 이 설정을
       따른다 — 전정 장애가 있는 사람에게는 느린 반복도 부담이 될 수 있다.
       한 방에 끄는 대신 **회전만 남긴다.** 나머지는 장식이지만 spin 은 정보다:
       "아직 일하는 중"을 그 회전이 혼자 말한다(검토는 최대 5분이다). 멈추면
       멎은 화면과 구별되지 않는다. 대신 느리게 돌려 자극을 낮춘다.
       iteration-count 를 1 로 두는 흔한 방법은 여기서 쓰면 안 된다 — 스피너가
       한 바퀴만 돌고 굳어 버려서, 아예 없는 것보다 나쁘다. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      /* 인라인 style 로 붙는다(views.js). 클래스가 아니라 속성으로 집는 이유다. */
      [style*="animation:spin"] {
        animation: spin 2.4s linear infinite !important;
      }
      /* 기준 타일에 있던 회전 예외 여섯 줄은 사라졌다 — 타일이 이제 안 돈다.
         움직임 줄이기가 층을 펴 주던 일도, 층별 큰 수를 숨기던 일도 필요 없다.
         모두에게 늘 같은 화면이 나가는 것이 이 설정을 가장 잘 지키는 방법이다. */
    }
    /* 투명도를 줄여 달라고 한 사람에게는 줄인다 — 움직임과 같은 판단의 나머지
       절반이다. 반투명 면은 그 뒤가 비쳐야 정보가 아니라 재질이라, 불투명한
       패널로 바꿔도 잃는 게 없다. 남은 반투명은 로그인 계열의 --panel-glass
       하나다(검토 진행 화면의 유리 넷은 아예 지웠다). blur 는 views.js 가
       인라인 style 로 붙이므로 클래스가 아니라 속성으로 집는다(위 spin 과 같은 이유).
       --shimmer 는 건드리지 않는다 — 진행바 sweep 은 재질이 아니라 "일하는 중"
       신호다(reduced-motion 에서 spin 을 남긴 것과 같은 이유). */
    @media (prefers-reduced-transparency: reduce) {
      :root, [data-theme="dark"] { --panel-glass: var(--panel); }
      [style*="backdrop-filter"] { backdrop-filter: none !important; }
    }

    /* 등장 연출 셋(fadeUp · fadeIn · listIn)은 **같은 거리**를 쓴다. fadeUp 만
       30px 였는데, 그건 랜딩 페이지 히어로가 올라오는 거리다 — 드롭다운·팝오버가
       그 거리를 쓰면 "날아 들어오는" 2015 년식 메뉴가 된다. 요즘 UI 등장은
       4~12px 다(2026-09-02). 이제 셋은 지속시간(사다리)으로만 갈린다. */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    /* 화면 전환 전용. fadeIn 과 갈라 놓는 이유는 **시작 투명도** 하나다.
       팝오버·모달은 없던 것이 생기는 거라 0 에서 시작하는 게 맞지만, 화면 전환은
       있던 화면이 다른 화면으로 바뀌는 것이다. 0 에서 시작하면 한 프레임이
       통째로 비어 **깜빡임**으로 읽힌다(2026-09-02 지적: "홈 → 단일 검토가
       깜빡거린다"). 느리게 해도 안 낫는다 — 빈 구간이 길어질 뿐이다.
       .85 에서 짧게 정착시켜 본문 전체가 흐려지는 느낌을 줄인다.

       **이동은 없다.** 위로 올라오는 움직임은 "이게 어딘가에서 왔다"는 말이라
       팝오버·새 목록 항목에는 맞지만, 화면 전체는 어디서 오는 게 아니라 교체되는
       것이다. 게다가 6px 이라도 화면이 통째로 밀리면 그 안의 모든 요소가 같이
       움직여, 작은 값인데도 과하게 읽힌다(2026-09-02 지적). 투명도 정착 하나로
       "바뀌었다"는 충분히 전해진다. */
    @keyframes screenIn {
      0% { opacity: .85; }
      100% { opacity: 1; }
    }
    /* 같은 화면 안의 탭·상세 교체: 주변 조작부와 스크롤 위치는 움직이지 않는다. */
    @keyframes contentIn {
      from { opacity: .65; }
      to { opacity: 1; }
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    /* 팝오버 전용 등장. fadeUp 과 갈라 놓는 이유는 **원점** 하나다.
       팝오버는 «누른 단추에서 나온 것»이다 — 화면 한가운데서 생긴 게 아니다.
       transform-origin 을 트리거 쪽 모서리에 두면 그 관계가 눈에 보인다.
       (모달은 예외다: 트리거가 없어 화면 중앙이 제자리다.)
       0.97 에서 시작한다 — 0 에서 시작하면 없던 것이 «뿅» 나타난다(popIn 주석). */
    @keyframes popoverIn {
      0%   { opacity: 0; transform: translateY(-4px) scale(.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 로그인 계열의 오류·안내는 상자가 아니라 글줄이다. 앱 안의 오류 배너
       (색 면+테두리)를 그대로 쓰니 널찍한 폼에서 혼자 무거웠다(2026-09-01).
       아이콘+색 글자 한 줄 — 필드 옆 인라인 오류의 관례다. */
    .auth-error, .auth-notice { display: flex; gap: 8px; align-items: flex-start;
                                font-size: 13px; line-height: 1.4; font-weight: 500; }
    .auth-error { color: var(--sev-crit-fg); }
    .auth-notice { color: var(--band-good-fg); }
    .auth-error[hidden] { display: none; }
    .auth-error svg, .auth-notice svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }

    /* 인라인 onmouseover 를 걷어낸 공용 hover 클래스들. 화면마다 손으로 색을
       칠하던 13곳이 제각각이라 "같은 앱" 감각이 깨졌다(2026-09-01 지적).
       hover 색은 이 클래스들만 안다 — 인라인으로 되돌아가지 말 것. */
    .icon-btn { display: flex; cursor: pointer; color: var(--text-2);
                background: none; border: none; padding: 0; font-size: 18px;
                transition: color .2s var(--ease-out); }
    .icon-btn:hover, .icon-btn.on { color: var(--accent-ink); }
    .link-accent { color: var(--accent-ink); cursor: pointer; font-weight: 600;
                   transition: opacity .15s var(--ease-out); }
    .link-accent:hover { opacity: .7; text-decoration: underline; }
    .pick-danger { color: var(--sev-crit-fg); }
    .pick-danger:hover { background: var(--sev-crit-bg); }
    /* 점선 카드(업로드·직접 작성 등)의 hover — 브랜드 상태면 한 가지로.
       !important 는 바탕색이 인라인이라 :hover 클래스가 못 이기기 때문이다
       (인라인 style > 모든 셀렉터). 바탕까지 클래스로 옮기는 날 걷는다. */
    .drop-hover { transition: border-color .2s var(--ease-out), background .2s var(--ease-out); }
    .drop-hover:hover { border-color: var(--accent) !important; background: var(--state-hover-brand) !important; }
    /* 검증 안내가 원인 지점을 직접 가리키게 하는 잠깐의 강조. "문서를 먼저
       올려주세요"를 상단 배너로 띄우면 원인(드롭존)과 메시지가 갈라진다 —
       토스트가 말하고, 이 강조가 자리를 짚는다. 두 번 깜빡이고 끝. */
    .drop-attention { animation: dropAttention var(--dur-3) var(--ease-out) 2; }
    @keyframes dropAttention {
      50% { border-color: var(--sev-crit-fg); background: var(--sev-crit-bg); }
    }

    /* 우하단 상주 마스코트 런처(홈). 검토 기준 타일의 숨은 이스터에그를
       승격했다 — 지금은 빠른 시작 메뉴, 나중엔 어시스턴트 채팅 자리다. */
    .home-launcher { position: fixed; right: 24px; bottom: 24px; z-index: 900;
                     width: 56px; height: 56px; border-radius: 50%; padding: 0;
                     border: 1px solid var(--line); background: var(--panel);
                     box-shadow: var(--sh-3); cursor: pointer;
                     display: flex; align-items: center; justify-content: center;
                     transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out); }
    /* 손가락에는 hover 가 없다. 터치로 누르면 hover 가 «켜진 채로 남아» 타일이
       올라간 상태로 굳는다 — 앱의 다른 hover 변형은 전부 이 가드 안에 있는데
       여기 하나만 밖에 있었다. */
    @media (hover: hover) and (pointer: fine) {
      .home-launcher:hover { transform: translateY(-2px); box-shadow: var(--sh-3), 0 6px 16px rgba(var(--accent-rgb), .18); }
    }
    .home-launcher img { width: 40px; height: 40px; object-fit: contain; display: block; }
    /* 마스코트 말풍선 — 런처 바로 위, 오른쪽 아래 꼬리가 마스코트를 가리킨다. */
    .mascot-say { position: fixed; right: 24px; bottom: 92px; z-index: 900; width: 280px;
                  padding: 12px 36px 12px 14px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: var(--r-md); box-shadow: var(--sh-3);
                  animation: fadeUp var(--dur-1) var(--ease-out) forwards; }
    .mascot-say::after { content: ""; position: absolute; right: 22px; bottom: -6px; width: 10px; height: 10px;
                         background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
                         transform: rotate(45deg); }
    .mascot-say-x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; padding: 0; border: 0;
                    border-radius: var(--r-sm); background: transparent; color: var(--text-3); cursor: pointer;
                    display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .mascot-say-x:hover { background: var(--bg); color: var(--text); }
    .mascot-say-text { font-size: 13px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
    .mascot-say-text b { font-weight: 600; }
    .mascot-say-actions { display: flex; gap: 8px; margin-top: 10px; }
    /* 호버 말풍선 — 버튼 뒤 형제라 :hover + 로 켠다. 글 한 줄이라 폭은 내용대로. */
    .mascot-say-hover { width: auto; padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--text);
                        white-space: nowrap; pointer-events: none; opacity: 0; animation: none;
                        transition: opacity .15s var(--ease-out); }
    .home-launcher:hover + .mascot-say-hover { opacity: 1; }
    /* 홈에서는 토스트가 런처 위로 비켜 선다. */

    /* 팝오버 메뉴 항목 — 프로필·알림 등 모든 메뉴가 같은 hover 를 쓴다. */
    .menu-item { padding: 10px 12px; font-size: 13px; font-weight: 500;
                 color: var(--text-2); border-radius: var(--r-sm); cursor: pointer; }
    .menu-item:hover { background: var(--bg); }
    .menu-item.pick-danger:hover { background: var(--sev-crit-bg); }
    /* 고르기 칩(체크리스트 선택 등). 비선택 바탕은 여기(클래스)가 진다 —
       인라인이면 hover 가 못 이긴다. 선택(.on)의 accent-weak 만 인라인이다. */
    .chip-select { background: var(--panel); }
    .chip-select:not(.on):hover { background: var(--state-hover-neutral); }

    /* ── 공용 상호작용 기반 ─────────────────────────────────────────────
       키보드 포커스 링. 마우스 클릭에는 안 뜨고(:focus-visible) 탭 이동에만
       뜬다. 지금까지는 화면마다 몇 군데(.viewer-tool 등)만 갖고 있어서 탭으로
       돌면 어디에 서 있는지 잃는 자리가 많았다 — 상호작용 요소 전부가 같은
       링을 받는다. 개별 규칙(-2px 오프셋 등)은 그대로 이긴다. */
    :is(button, a, input, select, textarea, [role="button"], [tabindex="0"]):focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* 토스트 — 렌더가 못 지우게 #root 밖(body 직속)에 산다. 화면 어디서든
       비동기 결과(복사됨·삭제됨·저장 실패)를 한 줄로 알린다. 배너와 달리
       화면 자리를 안 차지하고, 실패(tone err)는 더 오래 머문다. */
    /* 헤더 바로 아래 가운데. 오른쪽 아래는 DoSuree 런처·말풍선이 사는 자리라 거기 겹치면
       안내가 마스코트 뒤로 숨고, 맨 아래는 시선이 안 가는 자리였다(2026-09-15 지적 둘). */
    #toast-host { position: fixed; left: 50%; transform: translateX(-50%); top: 72px; z-index: 2000;
                  display: flex; flex-direction: column; gap: 8px; align-items: center;
                  pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 8px; max-width: 360px;
             padding: 10px 14px; font-size: 13px; font-weight: 600;
             background: var(--panel); color: var(--text); border: 1px solid var(--line);
             border-radius: var(--r-md); box-shadow: var(--sh-3);
             animation: toastIn var(--dur-2) var(--ease-out) both; }
    .toast.is-err { background: var(--sev-crit-bg); color: var(--sev-crit-fg);
                    border-color: var(--sev-crit-bd); }
    .toast.is-leaving { animation: toastOut var(--dur-2) var(--ease-out) both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

    /* 로딩 스켈레톤 — "불러오는 중…" 글자 대신 곧 올 내용의 뼈대를 보여준다.
       면은 레인과 같은 shimmer 를 쓴다(관용구 하나로). */
    .skel { position: relative; overflow: hidden; background: var(--neutral-weak);
            border-radius: var(--r-sm); }
    .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
                   background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
                   animation: shimmer 1.4s ease-in-out infinite; }
    /* PDF는 로딩 뒤에 `회색 뷰포트 → 가운데 종이 → 문서 블록` 구조로 나타난다.
       기다리는 동안에도 같은 골격을 먼저 잡아, 문서가 뜰 때 면 전체가 바뀌거나
       중앙의 짧은 막대 몇 개만 동떨어져 보이지 않게 한다. */
    .viewer-pending-tools { flex: none; display: flex; align-items: center; gap: 8px; }
    .viewer-pending-tools .skel { flex: none; height: 28px; }
    .pdf-pending { position: relative; flex: 1; min-height: 0; overflow: hidden;
                   box-sizing: border-box; padding: 12px 12px 0; background: var(--bg); }
    .pdf-pending-status { position: absolute; z-index: 2; top: 24px; left: 50%;
                          transform: translateX(-50%); display: flex; align-items: center;
                          gap: 8px; max-width: calc(100% - 48px); padding: 10px 14px;
                          font-size: 14px; font-weight: 600; color: var(--text);
                          border: 1px solid var(--line); border-radius: var(--r-xl);
                          background: var(--panel); color: var(--text-3); font-size: 12px;
                          font-weight: 600; white-space: nowrap; }
    .pdf-pending-status > [aria-hidden="true"] { display: inline-flex; flex: none;
                                                  animation: spin 1.4s linear infinite; }
    .pdf-pending-page { width: min(100%, 760px); height: calc(100% + 160px);
                        min-height: 680px; margin: 0 auto; box-sizing: border-box;
                        padding: 76px clamp(32px, 8%, 64px) 56px;
                        background: var(--panel); border: 1px solid var(--line-2); }
    .pdf-pending-page-head { display: grid; grid-template-columns: minmax(0, 1fr) 88px;
                             align-items: start; gap: 36px; }
    .pdf-pending-block { display: flex; flex-direction: column; gap: 10px; }
    .pdf-pending-rule { height: 1px; margin: 26px 0; background: var(--line-2); }
    .pdf-pending-copy { display: flex; flex-direction: column; gap: 12px; }
    .pdf-pending-section + .pdf-pending-section { margin-top: 30px; }
    .pdf-pending-table { display: grid; grid-template-columns: 1.1fr .8fr .8fr;
                         margin-top: 18px; border: 1px solid var(--line-2); }
    .pdf-pending-cell { min-height: 34px; padding: 10px; box-sizing: border-box;
                        border-right: 1px solid var(--line-2);
                        border-bottom: 1px solid var(--line-2); }
    .pdf-pending-cell:nth-child(3n) { border-right: 0; }
    @media (max-width: 720px) {
      .pdf-pending-page { padding-right: 28px; padding-left: 28px; }
      .pdf-pending-page-head { grid-template-columns: minmax(0, 1fr) 64px; gap: 20px; }
      .viewer-pending-tools .skel:first-child { display: none; }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    /* 단일·비교·폴더 검토가 공유하는 진행 화면. 세 기능의 실제 단계는 달라도
       화면을 읽는 법(상태 → 전체 진행률 → 단계 → 고정 설정)은 하나다. */
    .progress-workspace { width: 100%; margin-inline: auto; background: var(--panel); padding: 30px 32px;
                          display: flex; flex-direction: column;
                          border: 1px solid var(--line); border-radius: var(--r-lg); }
    .progress-summary { display: contents; }
    .progress-summary-row { display: flex; align-items: center; gap: 16px; order: 2;
                            padding: 22px 0; margin-top: 22px; border-top: 1px solid var(--line); }
    /* 머리말은 작업 전체 상태를 아이콘으로, 단계 목록은 현재 위치를 점으로 말한다.
       같은 솔리드 원을 두 층에 반복하지 않는다. */
    .progress-status-mark { width: 40px; height: 40px; flex: none; display: flex;
                            align-items: center; justify-content: center; border-radius: 50%;
                            border: 1px solid rgba(var(--accent-rgb), .2);
                            color: var(--accent-ink); background: var(--accent-weak); }
    .progress-status-mark svg { width: 19px; height: 19px; display: block;
                                stroke-width: 2.15; }
    /* 단일·비교 검토는 준비부터 검사까지 회전하고 완료·중단 때 멈춘다. */
    /* 멈춤 표시 — 완료(강조색 체크)와 달리 무채색. 사람이 멈춘 것은 성공도 실패도 아니다. */
    .progress-status-mark.is-stopped { background: var(--neutral-weak); color: var(--text-2);
                                       animation: fadeIn var(--dur-2) var(--ease-out) both; }
    .progress-status-mark.is-loading svg {
      transform-origin: center;
      animation: hourglassTurn 2.8s ease-in-out infinite;
      animation-delay: var(--progress-motion-delay, 0ms);
    }
    .progress-status-mark.is-loading {
      animation: hourglassEmphasis 2.8s ease-in-out infinite;
      animation-delay: var(--progress-motion-delay, 0ms);
    }
    .progress-status-mark.is-done { border-color: var(--accent); color: #fff;
                                    background: var(--accent); }
    .progress-summary-copy { min-width: 0; flex: 1; }
    .progress-summary-title { margin: 0; font-size: 22px; order: 0; }
    .progress-document { order: 1; color: var(--text-3); font-size: 13px; margin: 8px 0 0; overflow-wrap: anywhere; }
    .progress-document-file { display: flex; align-items: flex-start; gap: 10px; text-align: left;
                              color: var(--text); font-size: 14px; font-weight: 500; line-height: 1.6; }
    .progress-document-icon { display: inline-flex; flex: none; margin-top: 2px; color: var(--text-2); }
    .progress-document-icon svg { width: 18px; height: 18px; }
    .progress-document-name { min-width: 0; overflow-wrap: anywhere; }
    .progress-documents { order: 1; display: grid; grid-template-columns: 64px minmax(0, 1fr);
                          gap: 8px 12px; align-items: baseline; margin: 14px 0 0; }
    .progress-documents dt { margin: 0; color: var(--text-3); font-size: 12px; white-space: nowrap; }
    .progress-documents dd { min-width: 0; margin: 0; color: var(--text-2); font-size: 14px;
                             line-height: 1.6; overflow-wrap: anywhere; }
    .progress-summary-sub { margin: 4px 0 0; color: var(--text-2); font-size: 13px;
                            line-height: 1.6; }
    /* 한두 줄짜리 실행 안내가 바뀌어도 카드 높이가 출렁이지 않는다.
       긴 안내는 자르지 않고 필요한 만큼 늘어난다. */
    .page-shell-progress[data-scroll="progress"] .progress-summary-sub { min-height: 3.2em; }
    .progress-preparation-note { margin-bottom: 0; min-height: 2.8em; }
    .progress-summary-side { flex: none; display: flex; align-items: center; gap: 14px;
                            order: 4; margin-top: 22px; }
    .progress-summary-side > button, .progress-summary-side > .progress-stopping { margin-left: auto; }
    .progress-summary-metric { text-align: left; color: var(--text-3);
                               font-size: 12px; font-variant-numeric: tabular-nums; }
    .progress-summary-metric strong { display: block; margin-bottom: 2px; color: var(--text);
                                      font-size: 12px; line-height: 1.4; }
    .progress-summary-metric:empty { display: none; }
    .progress-elapsed strong { margin-bottom: 0; color: var(--text-2); font-size: 13px; font-weight: 500; }
    /* 내용이 적은 단일·비교 검토까지 폴더 검토 높이에 맞추지 않는다. 각 화면은
       실제 단계 수만큼만 자라고, 공통 껍질은 밀도만 맞춘다. */
    .progress-grid { display: grid; grid-template-columns: minmax(0, 1fr); order: 3; }
    .progress-main { min-width: 0; padding: 0; }
    .progress-settings { min-width: 0; padding: 18px 0 0; background: var(--panel); }
    .progress-settings-disclosure { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
    .progress-settings-disclosure > summary { font-size: 14px; color: var(--text-2); cursor: pointer; }
    .progress-step-guide { display: flex; gap: 20px; flex-wrap: wrap; list-style: none;
                           padding: 18px 0 0; margin: 0; color: var(--text-3); font-size: 12px; }
    .progress-step-guide [aria-current="step"] { color: var(--accent-ink); font-weight: 700; }
    .progress-section-head { display: none; }
    .progress-section-title, .progress-settings-title { margin: 0; color: var(--text);
                                                        font-size: 14px; font-weight: 700; }
    .progress-section-meta { color: var(--text-3); font-size: 12px; }
    .progress-settings-sub { margin: 4px 0 12px; color: var(--text-2); font-size: 13px;
                             line-height: 1.6; }
    .progress-stage-list { border-top: 1px solid var(--line-2); }
    .progress-stage-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto;
                          gap: 10px; align-items: start; min-height: 64px;
                          padding: 14px 4px; border-bottom: 1px solid var(--line-2); }
    .progress-stage-marker { width: 20px; height: 20px; display: flex; align-items: center;
                             justify-content: center; margin-top: 2px; border-radius: 50%;
                             border: 1.5px solid var(--line); color: var(--text-3);
                             background: var(--panel); }
    .progress-stage-marker svg { width: 12px; height: 12px; }
    .progress-stage-row[data-lane-status="run"] .progress-stage-marker,
    .progress-stage-row.is-active .progress-stage-marker { border-color: transparent;
                                                            background: transparent; }
    .progress-stage-row[data-lane-status="run"] .progress-stage-marker::after,
    .progress-stage-row.is-active .progress-stage-marker::after {
      content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    }
    .progress-stage-row[data-lane-status="done"] .progress-stage-marker,
    .progress-stage-row.is-done .progress-stage-marker { border-color: var(--line);
                                                          background: var(--panel); color: var(--text-2); }
    .progress-stage-row[data-lane-status="wait"], .progress-stage-row.is-wait { opacity: .58; }
    /* 단계 전환 연출 셋. 셋 다 상태가 **바뀌는 순간에만** 한 번 일어난다 —
       진행 화면은 폴링마다 다시 그려지므로 노드 생성에 걸면 상시 반복이 된다.
       재생 방지는 views.js 의 fresh 플래그가 진다(app.js 부분 갱신만 true).
       움직임 줄이기는 위 전역 @media 가 duration 을 눌러 그대로 따른다. */
    /* ① 완료 체크 — 짧은 팔(4,12)에서 긴 팔(20,6)로 그어진다. polyline 길이는
       약 22.6 이라 dasharray 24 면 전부 덮는다. 음수 offset 이어야 끝점부터
       드러나 체크를 긋는 방향이 된다(양수면 반대로 긴 팔에서 시작한다).
       단일 검토의 레인(review-lane-check)과 비교·케이스 검토의 단계 목록
       (timelineItem)이 같은 마커를 쓰므로 선택자도 마커 쪽에 건다. 두 화면의
       단계 목록이 똑같이 생겼는데 한쪽만 체크가 툭 나타나면 어긋나 보인다. */
    .progress-stage-marker.is-fresh svg polyline {
      stroke-dasharray: 24; stroke-dashoffset: -24;
      animation: laneCheckDraw var(--dur-3) var(--ease-out) .06s both;
    }
    @keyframes laneCheckDraw { to { stroke-dashoffset: 0; } }
    /* ② 단계가 닫힐 때 행이 살짝 눌렸다 편다. 두 벌인 이유는 화면마다 "끝나는
       순간"을 잡는 방식이 다르기 때문이지 연출이 달라서가 아니다 — 눈에는 같다.
       단일 검토: app.js 가 run→done 사이에 finishing 을 250ms 걸어 두므로 그
       구간을 그대로 쓴다(여태 대응 CSS 가 없어 바만 차고 아무 일도 안 보였다).
       비교·체크리스트: 서버 상태가 곧장 done 으로 튀어 중간 구간이 없다. 눌림을
       done 도착 **뒤**로 옮겨 키프레임 하나로 끝낸다. 이걸 맞추자고 app.js 에
       전환 감지를 두 벌 더 두지 않는다. */
    .progress-stage-row { transition: transform var(--dur-2) var(--ease-out); }
    .progress-stage-row[data-lane-status="finishing"] { transform: scale(.995); }
    .progress-stage-row.is-settling { animation: stageSettle var(--dur-2) var(--ease-out) both; }
    @keyframes stageSettle { 0% { transform: scale(.995); } 100% { transform: scale(1); } }
    /* ③ 다음 단계 열림 — wait→run 으로 바뀐 행의 글이 한 번 올라온다. */
    .progress-stage-copy.is-opening { animation: listIn var(--dur-2) var(--ease-out) both; }
    .progress-stage-copy { min-width: 0; }
    .progress-stage-title { color: var(--text); font-size: 14px; font-weight: 650; line-height: 1.4; }
    .progress-stage-desc { margin-top: 4px; color: var(--text-2); font-size: 13px; line-height: 1.4; }
    .progress-stage-detail { margin-top: 6px; color: var(--text-2); font-size: 13px; line-height: 1.4; }
    .progress-stage-status { padding-top: 2px; color: var(--text-2); font-size: 13px;
                             font-weight: 600; white-space: nowrap; }
    .progress-stage-row[data-lane-status="run"] .progress-stage-status,
    .progress-stage-row.is-active .progress-stage-status { color: var(--accent-ink); }
    .progress-stage-track { --progress-complete: color-mix(in srgb, var(--accent) 65%, var(--panel));
                            grid-column: 2 / 4; height: 6px; overflow: hidden;
                            border-radius: 999px; background: var(--line-2); }
    .progress-stage-track > i { position: relative; display: block; width: 100%; height: 100%;
                                transform-origin: left; border-radius: inherit;
                                transition: transform 250ms var(--ease-out); }
    /* 진행량이 바뀔 때만 채운다. 반복 반짝임으로 진행을 대신하지 않는다. */
    .progress-prep-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto;
                         gap: 10px; align-items: center; padding: 10px 4px;
                         border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
    #pg-preparation:has(.progress-prep-row) + .progress-stage-list { border-top: 0; }
    .progress-warmup { padding: 14px 4px; }
    .progress-warmup-copy { margin-bottom: 14px; color: var(--text-2); font-size: 13px; }
    .progress-warmup-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) 58px;
                           gap: 10px; align-items: center; padding: 12px 0;
                           border-bottom: 1px solid var(--line-2); }
    .progress-footer { display: flex; align-items: center; justify-content: space-between;
                       gap: 14px; margin-top: 14px; color: var(--text-3); font-size: 12px; }
    @media (max-width: 900px) {
      .progress-grid { grid-template-columns: minmax(0, 1fr); }
      .progress-settings { border-left: 0; }
    }
    @media (max-width: 640px) {
      .progress-summary-row { align-items: flex-start; flex-wrap: wrap; }
      .progress-summary-side { width: 100%; justify-content: space-between; }
      .progress-summary-metric { text-align: left; }
      .progress-workspace { padding: 24px 20px; }
    }
    /* 전체 검토 완료 연출. 단계별 완료 체크는 .review-lane-check 쪽에 따로 있다
       (예전엔 단계는 정적인 체크였다 — 2026-09-17 에 1회 그리기로 바꿨다). */
    .review-complete-head { animation: fadeIn var(--dur-3) var(--ease-out) both; }
    .review-complete-check { animation: reviewCompleteCheck var(--dur-3) var(--ease-spring) .08s both; }
    .review-complete-copy { animation: fadeIn var(--dur-3) var(--ease-out) .12s both; }
    @keyframes reviewCompleteCheck {
      0% { opacity: 0; transform: scale(.6); }
      70% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes hourglassTurn {
      0%, 18% { transform: rotate(0deg); }
      42%, 66% { transform: rotate(180deg); }
      90%, 100% { transform: rotate(360deg); }
    }
    @keyframes hourglassEmphasis {
      0%, 18%, 66%, 100% {
        background: var(--accent-weak);
        box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0);
      }
      42%, 90% {
        background: rgba(var(--accent-rgb), .18);
        box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .08);
      }
    }
    /* 결과 목록 진입 — 카드가 순차적으로 채워진다 */
    @keyframes listIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    /* 지적사항 펼침 — 0fr→1fr 로 높이를 실제로 전환한다 */
    @keyframes expandIn {
      0% { grid-template-rows: 0fr; margin-top: 0; opacity: 0; }
      100% { grid-template-rows: 1fr; margin-top: 16px; opacity: 1; }
    }
    /* 단계 완료 체크 — 살짝 튀어나온다.
       0.2 에서 시작하지 않는다: 실물 세계에 «아무것도 없던 자리에서 튀어나오는»
       것은 없다. 거의 0 에서 커지면 풍선이 부풀듯이가 아니라 «뿅» 생긴 것으로
       읽힌다. 크기는 0.9 에서 시작하고, «없다가 생겼다»는 투명도가 맡는다. */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      70% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    .expand { display: grid; grid-template-rows: 1fr; margin-top: 16px; }
    .expand > div { overflow: hidden; min-height: 0; }

    /* 미리보기의 근거 하이라이트. 지적이 들고 온 원문 인용에만 붙는다 —
       verify_quotes가 "이 인용은 원문에 있다"를 이미 보증한 문장이다. */
    mark { color: inherit; border-radius: 3px; padding: 2px 2px; }
    /* 심각도별. 내보내기 리포트(views.js REPORT_CSS)와 같은 규칙이다 — 같은 문서를
       화면에서 볼 때와 내보냈을 때 근거 색이 달라지면 안 된다. 여기는 패널 위라
       --sev-*-bg 를 쓴다(테마 따라 뒤집힌다). PDF 위는 --sev-*-hl 이 따로 있다. */
    mark.sev-major { background: var(--sev-min-bg); box-shadow: 0 0 0 1px var(--sev-min-bd); }
    /* major 도 minor 도 **노랑 형광펜 하나** — 화면이 지적을 한 종류로 보여 주는데(2026-09-14 결정)
       형광펜만 주황·노랑으로 갈리면 "둘의 차이가 뭐냐"가 된다. 노랑인 이유: 형광펜 하면 떠오르는
       색이고, 주황은 경고로 읽혀 인용문까지 위험해 보였다(2026-09-15). 데이터의 sev 는 그대로다. */
    mark.sev-minor { background: var(--sev-min-bg); box-shadow: 0 0 0 1px var(--sev-min-bd); }
    mark.sev-info  { background: var(--sev-info-bg); box-shadow: 0 0 0 1px var(--sev-info-bd); }
    /* 심각도를 모를 때의 기본값(markLine 의 cls 기본). */
    mark.hl { background: rgba(245, 158, 11, .28);
              box-shadow: 0 0 0 1px rgba(245,158,11,.35); }
    [data-theme="dark"] mark.hl { background: rgba(250, 204, 21, .22); }

    /* 최근 검토 목록의 행. 예전엔 카드용 .pick을 썼는데, 그 hover는 box-shadow라
       테두리도 radius도 없는 행에 걸면 각진 사각형이 글자에 딱 붙어 떴다.
       행에는 그림자가 아니라 배경이 맞다 — 좌우로 물려 여백을 준다. */
    /* 클릭 어피던스는 홈(.hrow)과 기록(.hrow-flush)이 같아야 한다 — 홈에서 행을 눌러
       결과로 들어가는 걸 배운 사용자가 기록에서 같은 동작을 하면 통해야 한다.
       여백만 다르다: 홈은 패널 위에 떠 있는 행이라 좌우로 물리고, 기록은 카드에
       꽉 찬 테이블이라 자기 padding 을 그대로 쓴다. */
    .hrow, .hrow-flush { cursor: pointer; transition: background .15s ease-out; }
    /* 홈 행은 두 줄 정보를 유지하되 높이를 줄여 넓은 hover 띠가 무겁게 보이지 않게
       한다. 5×76px 대신 6×60px 안팎이라 카드 전체도 조금 낮아진다. */
    .hrow { border-radius: var(--r-md); padding: 8px; margin: 0 -8px; }
    /* 홈과 기록 화면의 문서 행은 같은 정보 밀도를 쓴다. 15px·700 문서명과
       13px·700 결과 칩은 짧은 타일 제목보다도 커 보여 목록만 튀었다. */
    .history-doc-title { font-size: 14px; line-height: 1.4; font-weight: 600; color: var(--text); }
    .history-doc-meta { font-size: 12px; line-height:1.4; color: var(--text-3); }
    .history-count { font-size: 12px; line-height:1.4; font-weight: 600;
                     padding: 6px 10px; border-radius: var(--r-sm); white-space: nowrap; }
    .hrow .history-count { padding: 4px 8px; }
    /* 최근 검토 행도 빠른 시작 카드와 같은 화살표 문법을 쓴다. 평소에는 조용히
       자리를 지키고, 행 호버 때만 솔리드 브랜드 면으로 클릭 가능성을 말한다. */
    .history-row-arrow { width: 30px; height: 30px; flex: none; border-radius: 10px;
                         display: flex; align-items: center; justify-content: center;
                         border: 1px solid transparent; color: var(--text-3); opacity: .58;
                         transition: opacity .2s ease-out, transform .2s ease-out,
                                     background .2s ease-out, color .2s ease-out,
                                     border-color .2s ease-out; }
    .history-row-arrow svg { margin: 0; }
    .hrow .history-row-arrow { width: 28px; height: 28px; }
    /* 터치에서는 hover 가 손을 뗀 뒤에도 남는다 — 움직이는 hover 는 전부
       마우스에만 건다(.tile.act 와 같은 게이트). */
    @media (hover: hover) and (pointer: fine) {
      .hrow:hover .history-row-arrow { opacity: 1; transform: translateX(2px);
                                       background: var(--accent); border-color: var(--accent);
                                       color: #fff; }
    }

    /* 빠른 시작의 선행 아이콘은 기능을 뜻하는 솔리드 브랜드 면이다. 상태 칩은
       연한 면을 유지해 액션과 결과가 같은 모양으로 읽히지 않게 한다.
       (크림·탠 받침 면으로 바꿔 봤다가 되돌렸다 — 홈은 주색 톤온톤이다.
       2026-08-14) */
    .qs-icon { width: 44px; height: 44px; flex: none; border-radius: 50%;
               display: flex; align-items: center; justify-content: center;
               background: var(--accent); color: #fff; font-size: 16px;
               transition: background .2s ease-out, transform .2s ease-out; }
    /* 세로형(2026-09-18): 아이콘 위, 제목·설명 아래, 화살표는 오른쪽 아래. 홈이 시작 넷 + 최근 검토 +
       기준으로 줄면서 첫 줄이 홈의 얼굴이 됐다 — 가로형 92px 은 납작했다. */
    .tile.qs { min-height: 176px; width: 100%; appearance: none; text-align: left;
               flex-direction: column; align-items: flex-start; gap: 14px; padding: 20px;
               font: inherit; color: inherit; }
    .qs-copy { flex: 1; min-width: 0; width: 100%; position: relative; z-index: 1; }
    .qs-copy .tile-h { font-size: 15px; }
    .qs .qs-arrow { align-self: flex-end; margin-top: auto; position: relative; z-index: 1; }
    /* 유령 아이콘(2026-09-18): 오른쪽 아래에 브랜드색 8% 로 숨어 있다가 올리면 밀려 올라온다.
       transform·opacity 만 움직이고 240ms 안에 끝난다. 뜻은 없고 손맛만 — 매일 보는 화면이라 이 이상은 안 넣는다. */
    .tile.qs { position: relative; overflow: hidden; }
    .qs-ghost { position: absolute; right: 8px; top: 8px; width: 80px; height: 80px; color: var(--accent);
                opacity: 0; transform: translate(12px, -12px) rotate(6deg); pointer-events: none;   /* 오른쪽 위, 안 잘리게 안쪽으로 — 아래는 화살표 자리 */
                transition: opacity .24s var(--ease-out), transform .24s var(--ease-out); }
    .qs-ghost svg { width: 100%; height: 100%; }
    @media (hover: hover) and (pointer: fine) {
      .qs:hover .qs-ghost { opacity: .08; transform: translate(0, 0) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .qs-ghost { transition: opacity .2s ease-out; transform: none; } }
    /* .tile.act 의 떠오름과 같은 게이트를 받는다 — 터치에서는 hover 가 손을 뗀
       뒤에도 남아, 한 번 스친 시작 타일의 그림과 화살표가 눌린 채로 굳는다.
       (그림·화살표 규칙이 파일 안에서 멀리 떨어져 있어 이쪽만 빠져 있었다.) */
    @media (hover: hover) and (pointer: fine) {
      .qs:hover .qs-icon { background: var(--accent-strong); transform: translateY(-1px) scale(1.06); }
    }

    /* 빠른 시작 카드 — 화살표는 아이콘과 같은 원형으로 자리를 지키되
       평소에는 조용히 두고, 호버할 때만 색을 채운다. */
    .qs-arrow { flex: none; width: 32px; height: 32px; border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                border: 1px solid transparent; color: var(--text-3); background: transparent;
                opacity: .58;
                transition: opacity .2s ease-out, transform .2s var(--ease-out),
                            background .2s ease-out, color .2s ease-out,
                            border-color .2s ease-out; }
    .qs-arrow svg { margin: 0; vertical-align: middle; }

    /* 벤토 격자 — 타일 크기를 달리해 무엇이 중요한지 눈으로 먼저 말한다.
       칸 수는 폭에 따라 4 → 2 → 1 로 접히고, 넓은 타일도 같이 줄어든다.
       (인라인 스타일로는 미디어 쿼리를 못 쓴다. 그래서 여기 둔다.) */
    /* 12칸 — 시작 타일이 넷이 되면서(체크리스트 검토, 2026-09-18) 6칸으로는 넷을 한 줄에
       못 놓았다. 비율은 그대로다: 시작 3·3·3·3, 최근 8 + 기준 4, 흐름 12. */
    .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
             gap: 14px; align-items: start; }
    /* 홈은 둘째 줄(최근 검토 + 기준)이 화면 끝까지 늘어난다(2026-09-18) — 아래 섹션을 뺀 뒤 남던
       빈 바닥을 기록 줄로 채운다. 최근 검토 목록은 overflow hidden 이라 안 맞는 줄은 잘린다. */
    /* 홈 벤토(2026-09-18): 시작 넷이 왼쪽 2×2, 그 아래 기준, 오른쪽은 최근 검토 세로 기둥(3줄).
       셋째 줄(기준)이 남는 높이를 받아 기둥이 화면 끝까지 내려간다. 기둥 목록은 안 맞는 줄을 잘라 낸다. */
    .home-layout .bento { flex: 1; min-height: 0; grid-template-rows: auto auto auto; grid-auto-flow: dense; }
    /* 오른쪽 기둥 — 세 줄을 통째로 갖는 세로 묶음. 최근 검토가 남는 높이를 다 쓰고(flex 1),
       물어보기 카드는 제 내용만큼만. 왼쪽 밑선과 안 맞아도 된다. */
    .home-layout .bento > .home-col { grid-column: 7 / span 6; grid-row: 1 / span 3; display: flex; flex-direction: column;
                                      gap: 14px; min-height: 0; align-self: stretch; }   /* 격자 끝까지 — 밑선이 기준 타일과 맞는다 */
    .home-col .home-recent-tile { flex: 1 1 auto; min-height: 0; }
    .home-col .home-ask-tile { flex: none; }
    /* 기둥은 폭이 절반이라 열을 조인다 — 이름이 남는 폭을 다 쓰고, 결과·날짜·화살표는 딱 맞게. */
    .home-col .home-recent-grid { grid-template-columns: minmax(0, 1fr) 128px 108px 44px; }
    .home-col .home-recent-open { width: 28px; height: 28px; margin-right: 8px; }   /* 타일 오른쪽 끝에서 한 숨 띄운다 */
    /* 기준 타일은 기둥 높이를 따라 늘어난다 — 그림이 남는 높이를 먹고 가운데로 내려앉지 않게 위에 붙인다. */
    .home-layout .tile.crit { justify-content: flex-start; }
    /* 기본은 제 높이지만, 한 줄에서 키를 맞춰야 하는 타일은 늘린다. */
    .bento > .grow { align-self: stretch; }
    .bento > .b3 { grid-column: span 3; }
    .bento > .b4 { grid-column: span 4; }
    .bento > .b6 { grid-column: span 6; }
    .bento > .b8 { grid-column: span 8; }
    .bento > .b12 { grid-column: span 12; }
    /* 두 줄을 먹는 타일. **벤토가 벤토인 이유가 이거다** — 폭만 다르고 높이가 다
       같으면 그건 격자가 아니라 줄이다. 옆 칸에 작은 타일 둘이 쌓인다. */
    .bento > .r2 { grid-row: span 2; }
    .bento > .r3 { grid-row: span 3; }
    /* 좁아지면 **세 칸**으로 접는다. 두 칸으로 접었을 때는 폭이 1·1·1·2·1·2 라
       홀수 자리에서 격자가 어긋나 빈 칸이 둘 생겼다 — 시작 타일 셋째 옆과 기준
       타일 옆이 통째로 비어, 벤토가 아니라 "뭔가 안 그려진 화면"으로 읽혔다.
       셋이면 시작 셋이 한 줄에 그대로 남고(1+1+1) 아래 줄이 최근 검토 2 + 기준
       1 로 딱 맞는다. 넓은 화면(6칸)과 같은 자리 배치가 그대로 축소되는 셈이다. */
    @media (max-width: 1100px) {
      /* 네 칸 — 시작 넷이 한 줄(1·1·1·1), 아래 줄이 최근 2 + 기준 2. */
      .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .bento > .b3 { grid-column: span 1; }
      .bento > .b4, .bento > .b8 { grid-column: span 2; }
      .bento > .b6, .bento > .b12 { grid-column: span 4; }
      /* 좁아지면 기둥을 풀고 순서대로 쌓는다: 시작 넷 한 줄 → 최근 검토·물어보기 → 기준 */
      .home-layout .bento { grid-template-rows: none; grid-auto-flow: row; }
      .home-layout .bento > .home-col { grid-column: span 4; grid-row: auto; }
      .bento > .r3 { grid-row: span 1; }
      .bento > .r2 { grid-row: span 1; }
      /* 접히면 세로 span 은 옆에 쌓을 짝이 없어 빈 칸만 만든다. */
      .bento > .r2 { grid-row: span 1; }
    }
    /* 세 칸이 200px 밑으로 떨어지면 가로형 시작 타일(그림 34 + 화살표 36)에
       글자 자리가 안 남는다. 그때는 한 줄씩 세운다. */
    @media (max-width: 900px) {
      .bento { grid-template-columns: minmax(0, 1fr); }
      .bento > .b3, .bento > .b4, .bento > .b6,
      .bento > .b8, .bento > .b12 { grid-column: span 1; }
      .home-layout .bento > .home-col { grid-column: 1; }
    }
    /* 여백은 참고안(bentogrid_brown)에 맞춰 한 단 조였다. 24px 패딩 · 20px
       모서리는 카드 하나만 볼 때는 시원한데, 여섯 개가 격자로 깔리면 내용보다
       빈 자리가 먼저 보인다. */
    .tile { background: var(--panel); border: 1px solid var(--line);
            border-radius: var(--r-lg); padding: 20px; display: flex;
            flex-direction: column; gap: 10px; min-width: 0; overflow: hidden; }
    /* 타일은 다 같은 흰 면이다(예외는 아래 .tile.crit 하나). 무게는 **크기와
       자리**가 말한다 — 그게 벤토다.
       색 면(그라데이션)도 강조 띠도 대봤는데 둘 다 시끄럽기만 했다.
       누를 수 있는 타일은 아이콘 자리에만 브랜드색이 있고, 나머지는 호버가 말한다. */
    /* 숫자 타일은 위에서부터 채운다. 격자가 높이를 늘려도 글자가 가운데로
       떠내려가지 않게 — 가운데 정렬로 덮으면 여백만 커 보인다. */
    .tile.stat { gap: 6px; padding: 18px 20px; justify-content: flex-start; }
    /* 기준 타일 — 흰 면 규칙의 **유일한 예외.** 참고안(bentogrid_green)처럼
       진한 브랜드 면을 주요 지표 하나에만 제한적으로 쓴다. "무엇으로 재는가"는
       이 제품의 약속이라 흰 카드 사이에서 한 번은 서도 된다. 면은
       --accent-surface — 흰 글자 AA 를 두 테마 모두 검사받는 토큰이다. */
    /* 면은 --accent-surface 한 색이었는데, 넓은 단색 면이 화면에서 제일 큰
       유채색 덩어리라 오히려 납작해 보였다. 같은 브랜드 블루 세 값 사이에서만
       도는 사선 그라데이션으로 재질감을 준다 — 밝은 끝(Primary 72%+렌즈 블루)
       위 흰 글자 4.83:1, 어두운 끝은 그보다 높다. 흰 타일의 그라데이션 금지
       판단(위 주석)과 다른 자리다: 여긴 이미 브랜드 면이고 색상이 안 바뀐다. */
    /* 흰 면 규칙의 유일한 예외. 특별한 이유는 **재질이 아니라 색**이다 — 한 장뿐인
       브랜드 면이라는 사실은 그라디언트 없이도 그대로 말한다. 3단 그라디언트였을
       때는 화면의 다른 면이 전부 불투명 단색이라 이 타일만 재질이 달랐고, 그 위에
       얹힌 딥블루 상자가 바닥과 명도차를 잃어 뭉갰다. 같은 판단을 이 저장소가 이미
       두 번 했다: 진행 패널이 유리에서 불투명 면으로 내려왔고, 웜 톤 받침 면도 대
       봤다가 주색 톤온톤으로 되돌렸다(2026-08-14).
       살아 있는 느낌은 hover 스포트라이트([data-glow])와 합류선 펄스가 낸다 —
       둘 다 상호작용·시간이라 바닥에 구워 넣은 그라디언트와 다르다. */
    /* 2026-09-02: 색면을 걷었다. 웜 페이퍼 세계에서는 파란 판 하나가 브랜드
       타일로 읽혔지만, 세계를 차가운 흰 화면으로 옮기자(레퍼런스) 홈에서 이것만
       유일한 대형 색면이라 혼자 소리쳤다. 다른 타일과 같은 흰 면에 두고, 강조색은
       그림의 선과 도착점에만 남긴다 — 레퍼런스도 색은 상태에만 쓴다. */
    .tile.crit { background: var(--panel); border-color: var(--line); color: var(--text); }
    /* 종이 자체가 선택 손잡이다. 옆 메모에 짧은 설명만 보여 주고 목록은 모두 보기에서 읽는다. */
    .tile.crit { container: criteria / inline-size; }
    .crit-editorial { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
    .crit-figure { display: grid; grid-template-columns: 240px minmax(0, 1fr);
                   gap: 16px; align-items: center; min-width: 0; }
    .crit-art { display: flex; justify-content: center; }
    .crit-deck { position: relative; width: 240px; height: 158px; isolation: isolate; }
    .crit-sheet { --sheet-x: 0px; --sheet-y: -6px; --sheet-turn: 0deg;
                  position: absolute; left: 50%; top: 24px; width: 76px; height: 112px;
                  margin-left: -38px; padding: 12px 8px 10px;
                  display: flex; flex-direction: column; gap: 10px;
                  border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
                  border-radius: var(--r-sm) 16px var(--r-sm) var(--r-sm);
                  background: var(--panel); color: var(--text); font: inherit; text-align: left;
                  cursor: pointer; transform-origin: 50% 90%;
                  box-shadow: 0 2px 4px rgba(var(--accent-rgb), .04), 0 8px 16px rgba(var(--accent-rgb), .10);
                  transform: translate(var(--sheet-x), var(--sheet-y)) rotate(var(--sheet-turn));
                  transition: transform 360ms var(--ease-out), border-color var(--dur-2) var(--ease-out),
                              box-shadow var(--dur-2) var(--ease-out); }
    .crit-sheet::after { content: ""; position: absolute; top: -1px; right: -1px; width: 16px; height: 16px;
                         background: linear-gradient(225deg, var(--panel) 49%, color-mix(in srgb, var(--accent) 18%, var(--panel)) 50%);
                         border-bottom-left-radius: 4px; }
    .crit-sheet-name { font-size: 12px; font-weight: 700; line-height: 1.4; color: var(--accent-ink); white-space: nowrap; }
    .crit-sheet-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
    .crit-sheet-lines em { display: block; height: 3px; border-radius: 2px;
                           background: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
    .crit-sheet-lines em:nth-child(2) { width: 82%; }
    .crit-sheet-lines em:nth-child(3) { width: 58%; }
    .crit-sheet-state { display: flex; align-items: center; gap: 4px;
                        font-size: 11px; font-weight: 500; line-height: 1.4; color: var(--text-3); white-space: nowrap; }
    .crit-sheet-state svg { width: 12px; height: 12px; color: var(--accent-ink); flex: none; }
    .crit-sheet.is-off { border-style: dashed; border-color: var(--line-dashed); box-shadow: 0 4px 10px rgba(var(--accent-rgb), .04); }
    .crit-sheet.is-off .crit-sheet-name { color: var(--text-3); }
    .crit-sheet.is-off .crit-sheet-lines em { background: var(--line); }
    .crit-deck .crit-sheet:nth-child(1) { z-index: 3; --sheet-x: -68px; --sheet-y: 4px; --sheet-turn: -8deg; }
    .crit-deck .crit-sheet:nth-child(2) { z-index: 2; --sheet-x: 0px; --sheet-y: -4px; --sheet-turn: 0deg; }
    .crit-deck .crit-sheet:nth-child(3) { z-index: 1; --sheet-x: 68px; --sheet-y: 4px; --sheet-turn: 8deg; }
    /* 포인터와 키보드 탐색 중에는 뒤쪽 종이도 드러나고, 설명 중인 종이가 앞으로 선다. */
    .crit-art:focus-within .crit-sheet:nth-child(1) { --sheet-x: -72px; --sheet-turn: -10deg; }
    .crit-art:focus-within .crit-sheet:nth-child(2) { --sheet-x: 0px; --sheet-y: -14px; --sheet-turn: 0deg; }
    .crit-art:focus-within .crit-sheet:nth-child(3) { --sheet-x: 72px; --sheet-turn: 10deg; }
    @media (hover: hover) and (pointer: fine) {
      .crit-art:hover .crit-sheet:nth-child(1) { --sheet-x: -72px; --sheet-turn: -10deg; }
      .crit-art:hover .crit-sheet:nth-child(2) { --sheet-x: 0px; --sheet-y: -14px; --sheet-turn: 0deg; }
      .crit-art:hover .crit-sheet:nth-child(3) { --sheet-x: 72px; --sheet-turn: 10deg; }
    }
    .crit-art .crit-deck .crit-sheet.is-active { --sheet-y: -12px; --sheet-turn: 0deg; z-index: 4;
                                               border-color: var(--accent); box-shadow: 0 8px 20px rgba(var(--accent-rgb), .16); }
    .crit-sheet:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .crit-info { min-width: 0; }
    .crit-descriptions { --crit-note-bg: color-mix(in srgb, var(--accent) 6%, var(--panel));
                         position: relative; display: grid; padding: 16px; border-radius: var(--r-md);
                         background: var(--crit-note-bg); }
    .crit-descriptions::before { content: ""; position: absolute; top: 28px; left: -6px; width: 12px; height: 12px;
                                background: var(--crit-note-bg); transform: rotate(45deg); }
    /* 같은 칸에 겹쳐 가장 긴 설명의 높이를 확보한다. 선택해도 카드 높이가 바뀌지 않는다.
       숨긴 설명은 visibility로 읽기·포커스 대상에서도 제외한다. */
    .crit-description { grid-area: 1 / 1; min-width: 0; animation: critExplainIn var(--dur-2) var(--ease-out); }
    .crit-description[hidden] { display: block; visibility: hidden; pointer-events: none; animation: none; }
    .crit-description-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .crit-description-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--accent-ink); }
    .crit-description-status { font-size: 11px; font-weight: 500; line-height: 1.6; color: var(--text-3); }
    .crit-description p { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: var(--text-2);
                          word-break: keep-all; overflow-wrap: anywhere; }
    @keyframes critExplainIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    .scope-enter .crit-sheet:nth-child(1) { animation: deckIn var(--dur-3) var(--ease-out) var(--plane-delay, 0ms) backwards; }
    .scope-enter .crit-sheet:nth-child(2) { animation: deckIn var(--dur-3) var(--ease-out) calc(var(--plane-delay, 0ms) + 80ms) backwards; }
    .scope-enter .crit-sheet:nth-child(3) { animation: deckIn var(--dur-3) var(--ease-out) calc(var(--plane-delay, 0ms) + 160ms) backwards; }
    @keyframes deckIn { from { opacity: 0; transform: translate(0, 20px) rotate(0); } }
    @container criteria (max-width: 430px) {
      .crit-figure { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .crit-descriptions::before { top: -6px; left: calc(50% - 6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scope-enter .crit-sheet, .scope-enter.crit-deck { animation: none; }
      .crit-deck.scope-enter .crit-sheet { animation: none; }
      .crit-deck, .crit-sheet { transition: none; }
      .crit-description { animation: none; }
    }
    /* 무엇을 보는가 — 라벨 + 칩 줄. 알약 규칙대로 색은 칩에만(검사 갈래는 결과 화면의 분류 알약과 같은 색). */
    .crit-chips { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: start;
                  margin: 0; max-width: 100%; padding-top: 14px; border-top: 1px solid var(--line-2); }
    .crit-chips dt { font-size: 12px; font-weight: 600; color: var(--text-2); padding-top: 2px; white-space: nowrap; }
    .crit-chips dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .crit-chips .pill-cat i { font-style: normal; font-weight: 500; opacity: .8; }
    /* 홈의 검사 갈래 칩은 결과 화면의 분류색(파랑·보라·청록·회색) 대신 **브랜드색 한 가지의 밝기·채도 네 단**
       (2026-09-18) — 홈은 주색 하나로 간다. 결과 화면의 분류 알약은 그대로다(거기선 갈래를 갈라 봐야 한다). */
    .crit-chips .pill-cat.cat-form    { background: rgba(var(--accent-rgb), .20); color: var(--accent-strong); }
    .crit-chips .pill-cat.cat-expr    { background: rgba(var(--accent-rgb), .13); color: var(--accent-ink); }
    .crit-chips .pill-cat.cat-trace   { background: rgba(var(--accent-rgb), .08); color: #4C8AC0; }
    .crit-chips .pill-cat.cat-process { background: rgba(107, 130, 153, .12); color: #5E7189; }
    :root[data-theme="dark"] .crit-chips .pill-cat.cat-form { color: #BFD9F0; }
    :root[data-theme="dark"] .crit-chips .pill-cat.cat-trace { color: #7FB2DC; }
    :root[data-theme="dark"] .crit-chips .pill-cat.cat-process { color: #A2AAB8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .crit-chips .pill-cat.cat-form { color: #BFD9F0; }
      :root:not([data-theme="light"]) .crit-chips .pill-cat.cat-trace { color: #7FB2DC; }
      :root:not([data-theme="light"]) .crit-chips .pill-cat.cat-process { color: #A2AAB8; } }
    .crit-loading { flex: 1; min-height: 238px; display: flex; align-items: center;
                    font-size: 13px; font-weight: 600; line-height: 1.6;
                    color: var(--text-3); }
    /* 누를 수 있는 타일만 들린다 — 읽기만 하는 타일은 가만히 있어야 한다. */
    .tile.act { cursor: pointer;
                transition: border-color .2s var(--ease-out), background .2s var(--ease-out),
                            box-shadow .2s var(--ease-out), transform .15s var(--ease-out); }
    /* 바로 위 기준 타일의 회전 정지는 포인터로 게이트했으면서, 정작 타일이
       2px 떠오르는 것은 안 했다 — 터치에서 홈 타일이 한 번 스치면 떠오른 채
       붙어 있었다. 같은 판단은 같은 게이트를 받아야 한다. */
    @media (hover: hover) and (pointer: fine) {
      .tile.act:hover { border-color: var(--accent); transform: translateY(-2px);
                        box-shadow: 0 10px 28px rgba(var(--accent-rgb), .10); }
    }
    /* 공용 타일 제목은 Wanted Sans다. 홈은 아래에서 색만 다르게 잠근다. */
    .tile-h { font-family: var(--font-body); font-size: 15px; font-weight: 700;
              line-height: 1.4; color: var(--text); letter-spacing: var(--tr-body); }
    /* 홈 타일 제목도 Wanted 다. 제목 서체는 700 한 굵기만 싣고 18px 이상에만
       쓴다 — 15px 타일 제목에 얹으면 작은 UI 까지 번진다(2026-09-04). */
    .home-layout .tile-h { color: var(--home-title); }
    .home-tile-head { min-height: 30px; display: flex; align-items: center;
                      justify-content: space-between; gap: 12px; }
    .home-tile-actions { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .home-tile-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                      font-size: 12px; font-weight: 600; line-height: 1.4;
                      color: var(--text-3); font-variant-numeric: tabular-nums; }
    .home-recent-list { display: flex; flex-direction: column; overflow: hidden;
                        border-top: 1px solid var(--line-2); }
    .home-empty { padding: 48px 0; text-align: center; color: var(--text-2); }
    .home-empty-icon { width: 52px; height: 52px; margin: 0 auto 14px;
                       border-radius: 50%; background: var(--accent-weak);
                       color: var(--accent-ink); display: flex; align-items: center;
                       justify-content: center; }
    .home-empty-copy { font-size: 14px; font-weight: 500; line-height: 1.6; }
    /* 색면을 걷은 뒤로는 제목도 다른 타일과 같은 글자색이다(위 .tile.crit 주석). */
    .tile-sub { font-size: 13px; line-height: 1.6; color: var(--text-2); word-break: keep-all; }  /* "초/안"처럼 낱말이 갈라지지 않게 */
    @media (max-width: 720px) { .home-tile-meta { display: none; } }
    .home-recent-row.is-running strong { color: var(--text-2); }
    /* 무엇이든 물어보세요(2026-09-18) — 오른쪽 기둥 셋째 줄의 작은 카드. 입력 한 줄(흰 면·브랜드 테두리) + 칩. */
    .home-ask-tile { gap: 10px; }
    /* 타일 머리 아이콘 원(2026-09-18) — 최근 검토·검토 기준·물어보기가 같은 머리를 쓴다. 시작 타일의
       채운 원(44px)보다 작고 옅어서(26px·브랜드 12%) 누르는 것과 읽는 것이 갈린다. */
    .home-tile-title { display: inline-flex; align-items: center; gap: 8px; }
    .home-tile-ico { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center;
                     border-radius: 50%; background: var(--accent-weak); color: var(--accent-ink); font-size: 14px; }
    .home-ask-note { font-size: 12px; color: var(--text-3); }
    /* 채팅창 느낌(2026-09-18): 두수리 입력창(.chat-composer-box)과 같은 옷 — 옅은 회색 1px 테두리, 16px 모서리,
       작은 그림자. 브랜드색은 들어갔을 때(포커스)만. 보내기는 글자 없는 채운 원. */
    .home-ask { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 16px; min-width: 0;
                background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--sh-3);
                transition: border-color .2s var(--ease-out), box-shadow .2s var(--ease-out), transform .2s var(--ease-out); }
    .home-ask:hover { border-color: rgba(var(--accent-rgb), .45); box-shadow: 0 4px 14px rgba(var(--accent-rgb), .12); transform: translateY(-1px); }
    .home-ask:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-weak); transform: none; }
    .home-ask input { flex: 1; min-width: 0; min-height: 36px; padding: 0; font: inherit; font-size: 14px;
                      border: 0; background: transparent; color: var(--text); }
    .home-ask input::placeholder { color: var(--text-3); }
    .home-ask input:focus { outline: none; }
    .home-ask .btn { flex: none; width: 36px; min-width: 36px; height: 36px; min-height: 36px; padding: 0; justify-content: center;
                     border-radius: 50%; transition: background .2s var(--ease-out), transform .16s var(--ease-out); }
    .home-ask .btn:hover { background: var(--accent-strong); }
    .home-ask .btn:active { transform: scale(.97); }
    .home-ask-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .home-ask-chip { font: inherit; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: var(--r-sm);
                     border: 1px solid var(--line); background: var(--panel); color: var(--accent-ink); cursor: pointer;
                     transition: border-color .2s var(--ease-out), background .2s var(--ease-out), transform .16s var(--ease-out); }
    .home-ask-chip:hover { border-color: var(--accent); background: var(--state-hover-brand); transform: translateY(-1px); }
    @media (prefers-reduced-motion: reduce) { .home-ask, .home-ask-chip { transition: none; } .home-ask:hover, .home-ask-chip:hover { transform: none; } }
    .home-ask-chip:active { transform: scale(.97); }
    .home-spin { display: inline-flex; animation: spin 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .home-spin { animation: none; } }
    /* 첫 방문 — 할 일 자리에 네 단계(도움말 "이렇게 일합니다"와 같은 말). */
    .home-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding: 0 4px 4px; }
    .home-step { min-width: 0; padding: 8px 0; }
    .home-step-n { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .home-step-n span { flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff;
                        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
    .home-step-n::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .home-step b { display: block; font-size: 13px; font-weight: 600; }
    .home-step span:last-child { display: block; margin-top: 4px; font-size: 12px; color: var(--text-2); }
    /* 큰 통계 숫자만 800(ExtraBold) — Wanted 에만 있는 무게라 숫자가 제목과
       다른 목소리를 낸다. 작은 글씨는 600 이 상한(제일 작은 게 제일 굵으면 안 된다). */
    .tile-num { font-size: 28px; font-weight: 800; color: var(--text);
                letter-spacing: var(--tr-display); font-variant-numeric: tabular-nums; line-height: 1; }

    @media (hover: hover) and (pointer: fine) {
      .qs:hover .qs-arrow { opacity: 1; transform: translateX(3px);
                            border-color: var(--accent-ink); background: var(--accent); color: #fff; }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    
    /* 스크롤바. 색은 토큰이어야 한다 — #D1D5DB 를 박아 두면 다크에서 어두운
       바탕 위에 밝은 회색 막대가 남아 화면에서 제일 밝은 것이 스크롤바가 된다.
       --line 계열을 쓰면 테마마다 알아서 뒤집힌다. */
    /* 스크롤바. 8px 는 다른 서비스보다 얇아 잡기 어렵다는 지적(2026-09-08) — 12px.
       thin(파이어폭스)도 auto 로. 손잡이 색은 선보다 한 단 진하게. */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-dashed); border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
    * { scrollbar-width: auto; scrollbar-color: var(--line-dashed) transparent; }
    button { font-family: inherit; }
    /* 브랜드 포인트 서체. 긴 글을 읽히는 본문 서체가 아니라 화면의 방향을 짧게
       알리는 18px 이상 한글 대표 제목용이다. 세부 데이터·버튼·폼 라벨,
       작은 카드·섹션 제목은 계속 Wanted Sans를 쓴다. */
    /* 18px 이상 짧은 제목은 전부 이 클래스다(홈 인사말·로그인·진행 단계명·
       "검토 완료"·시트 제목·기준 카드 제목…). 크기는 자리마다 인라인으로 주고
       서체·굵기·자간만 여기서 진다. 큰 숫자(.tile-num 등)는 제목이 아니라
       본문 서체 800 이다(2026-09-04). */
    .headline { font-family: var(--font-display); font-weight: 800;
                letter-spacing: var(--tr-title); color: var(--text-title); }
    /* 페이지 제목 — 24px · 700 · 한 덩어리(2026-09-04). 26 으로 올렸다가 머리말
       밑줄을 빼고 내용에 붙이면서 24 로 한 단계 내렸다 — 조용한 머리말은 크기가
       아니라 붙어 있음으로 선다(pageHead 주석).
       그전엔 22px 에 앞말 700 / 뒷말 500 으로 굵기를 한 줄 안에서 나눴다.
       22px 에서 "제목 같지 않다"를 메우려던 보정이었는데, 심심했던 진짜 원인은
       본문 14px 대비 1.6배밖에 안 되는 크기였다(레퍼런스들은 2배). 26px 로
       올리니 보정이 필요 없어졌고, 남겨 두면 왜 저기서 굵기가 바뀌는지 설명이
       안 되는 장식이 된다. 세리프·Plex 계열은 특히 한 덩어리여야 제목으로 읽힌다.
       자간은 --tr-display(-.035em) 가 Plex 에선 붙어서 --tr-title 로 한 단계 푼다. */
    /* 시험 중(2026-09-04): 레퍼런스(Untitled UI 설정 화면)처럼 20px. 화면에서
       굵은 글자가 제목뿐이면 크지 않아도 제목으로 읽힌다는 가설. 되돌리기는
       아래 두 줄을 24px / 22px 로. */
    .page-title { font-family: var(--font-display); font-weight: 800; font-size: 22px;
                  letter-spacing: var(--tr-title); color: var(--text-title); }
    @media (max-width: 900px) { .page-title { font-size: 18px; } }
    /* 영문 워드마크는 포인트 서체의 개성을 덜어 제품 UI와 한 가족으로 보이게 한다. */
    .brand-wordmark { font-family: var(--font-display); font-weight: 800;
      letter-spacing: var(--tr-display);
    }
    .mono { font-variant-numeric: tabular-nums; }
    /* micro labels — small, uppercase, wide tracking (Linear/Vercel signature) */
    /* 짧은 꼬리표(수정안·검토 지침·최근 검토…) 전용. 문장 길이의 라벨에는 쓰지
       않는다 — 그건 제 크기와 굵기를 가진 라벨이어야 한다(compareSetup docSlot).

       uppercase 를 뺐다(2026-09-02): 쓰이는 아홉 자리가 전부 한글인데 한글엔
       대문자가 없어 아무 일도 안 했고, 섞여 든 영문만 제멋대로 키웠다.
       자간도 .07 → .02: 양수 자간은 라틴 소형 대문자를 정교하게 보이게 하는
       장치다. 한글에 그대로 걸면 정교한 게 아니라 **헐거워** 보인다
       ("생각보다 작고 얇다"의 절반은 이것이었다). */
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: var(--tr-caps); }

    /* 앱 셸은 화면 실측 그대로 선다. 예전에는 800px 고정 아트보드를 CSS zoom
       으로 확대했는데(목업 이식 흔적), 큰 화면에서 내용이 아니라 글자가
       커졌고 비정수 배율이라 흐릿했다. 세로 스크롤은 안쪽(main-scroll 등)이
       맡으므로 셸은 100vh 에 고정된다. */
    .dr-app { height: 100vh; display: flex; background: var(--bg); overflow: hidden; color: var(--text); }

    /* 앱 셸의 두 머리줄은 높이만 맞춘다. 선까지 이어 붙이면 사이드바의 경계와
       만나 딱딱한 십자 격자가 된다. 사이드바는 선 대신 옅은 오른쪽 음영으로 면을
       나누고, 가로선은 작업 영역의 전역 헤더에만 둔다. */
    .sidebar-brand, .app-header { height: 60px; min-height: 60px; flex: none; }
    /* 로고는 홈으로 가는 손잡이다(서비스 불문율) — 손 모양이 그걸 말한다. */
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 18px;
                     cursor: pointer; }
    .app-sidebar { position: relative; z-index: 2; border-right: 1px solid var(--line); }
    .app-header { display: flex; align-items: center; justify-content: space-between;
                  padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .header-profile { display: flex; align-items: center; gap: 10px; cursor: pointer;
                      padding: 4px 8px; border-radius: var(--r-md);
                      transition: background .15s ease-out; }
    .header-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-surface);
                     color: #fff; display: flex; align-items: center; justify-content: center;
                     font-size: 12px; font-weight: 600; }
    /* 헤더와 열린 프로필 메뉴의 이니셜은 같은 사용자 표식이다. 메뉴 쪽만
       --accent-weak를 쓰면 특히 다크에서 반투명 상태 칩처럼 보여 둘 다 불투명
       브랜드 면으로 맞춘다. */
    .profile-menu-avatar { width: 36px; height: 36px; border-radius: 50%;
                           background: var(--accent-surface); color: #fff;
                           display: flex; align-items: center; justify-content: center;
                           font-size: 14px; font-weight: 700; flex: none; }

    /* 사이드바에서 여는 주요 화면은 같은 시작선·폭·세로 리듬을 쓴다. 화면마다
       padding과 max-width를 다시 정하면 이동할 때 내용이 좌우로 흔들린다. */
    /* 위아래를 같은 값으로 둔다(2026-09-02 지적: "아래 여백만 더 크다").
       예전엔 20/32 였는데, 최상위 화면은 -primary 가 위만 36 으로 덮어써서
       위 36 · 아래 32 로 어긋났다 — 한쪽만 덮어쓰는 규칙은 반드시 이렇게 샌다.
       이제 두 규칙 다 padding 한 줄로 네 면을 함께 정한다. */
    .page-shell { height: 100%; box-sizing: border-box; padding: 20px 24px;
                  overflow: auto; }
    /* 검토 결과 화면(단일·비교)의 껍질. `.page-shell` 을 못 쓰는 이유는 하나뿐이다 —
       좌우 분할(문서 뷰어 + 지적 목록)이라 1360px 에 가두면 큰 모니터에서 문서가
       좁아진다. **폭 제한만 없고 여백은 같다.**

       예전엔 이 클래스가 없어서 두 화면이 여백을 인라인으로 박아 뒀다. 그래서
       좌우가 32px 인데 다른 화면은 24px 였고, 위 여백은 화면마다 10·16·20·36 넷이
       따로 굳어 — 화면을 옮길 때마다 좌우가 8px 움찔하고 제목 높이가 달라졌다
       (2026-09-02 지적). pageHead 를 손으로 베껴 뒀다가 뒤처진 것과 같은 종류다. */
    /* 좌우 여백은 값 하나로 산다. 안쪽 요소는 padding 이 필요한 것과 margin 이
       필요한 것이 섞여 있어(패널 줄 vs 카드) 클래스 대신 변수로 나눠 준다. */
    .results-shell { --results-pad: 24px;
                     height: 100%; box-sizing: border-box; display: flex;
                     flex-direction: column; overflow: hidden; }
    /* 백링크 줄. 아래 내용과 같은 세로선에서 시작해야 화면이 한 판으로 읽힌다. */
    .results-head { flex: none; display: flex; align-items: center;
                    justify-content: space-between; gap: 12px;
                    padding: 20px var(--results-pad) 12px; }
    @media (max-width: 900px) {
      .results-shell { --results-pad: 16px; }
      .results-head { padding-top: 16px; padding-bottom: 10px; }
    }
    /* 좌측 메뉴에서 바로 여는 최상위 화면. 제목이 아래로 처져 보이던 36px을
       28px로 줄여 페이지 전환마다 첫 제목선이 한 박자 빠르게 보이게 한다. */
    .page-shell-primary { padding: 28px 24px; }
    /* 콘텐츠 폭은 홈과 같은 눈금 하나로 — 1180 이던 시절 큰 모니터에서 좌우가
       뭉텅 비어 화면마다 폭이 다른 앱처럼 보였다(2026-09-01 지적).
       1360 → 1600 (2026-09-02): 결과 화면은 폭 제한이 없는데(좌우 분할이라
       가두면 문서가 좁아진다) 나머지는 1360 에서 멈춰, 넓은 모니터에서 홈·업로드
       화면만 좌우가 뭉텅 비었다 — 결과로 넘어갈 때 내용이 바깥으로 벌어졌다.
       **없애지는 않는다.** 한 줄로 읽는 목록(기준·설정)은 폭이 끝없이 늘면
       한 줄이 200 자를 넘어 읽히지 않는다. 눈금은 그 한계지 여백 취향이 아니다. */
    .page-container { width: 100%; max-width: 1600px; margin: 0 auto; }
    /* 진행 화면은 결과를 편집하는 작업대가 아니라 잠시 상태를 확인하는 집중 화면이다.
       실제 modal처럼 내비게이션을 막지는 않고, 큰 modal 정도의 폭만 사용한다. */
    .page-shell-progress { display: flex; flex-direction: column; }
    .progress-page-container { max-width: 620px; }
    .page-shell-progress > .progress-page-container { flex: none; margin-block: auto; }
    .progress-workspace[data-progress-phase="preparing"] { width: min(100%, 480px); padding: 60px 44px; }
    .progress-workspace[data-progress-phase="preparing"] .progress-summary-row { display: contents; }
    .progress-workspace[data-progress-phase="preparing"] .progress-status-mark {
      order: -1; align-self: center; width: 48px; height: 48px; margin-bottom: 18px;
    }
    .progress-workspace[data-progress-phase="preparing"] .progress-status-mark svg { width: 24px; height: 24px; }
    .progress-workspace[data-progress-phase="preparing"] .progress-summary-title { text-align: center; font-size: 22px; }
    .progress-workspace[data-progress-phase="preparing"] .progress-document { margin-top: 12px; }
    .progress-workspace[data-progress-phase="preparing"] .progress-summary-copy { order: 2; flex: none; margin-top: 16px; text-align: center; }
    .progress-workspace[data-progress-phase="preparing"] #pg-prep-desc { text-align: center; }
    @media (max-width: 900px), (max-height: 650px) {
      .progress-workspace[data-progress-phase="preparing"] { padding: 32px 24px; }
    }
    /* 짧은 카드는 자동 여백으로 중앙에 놓는다. 화면을 넘으면 여백이 0이 되어
       상단을 가리지 않고 페이지 전체를 스크롤할 수 있다. */
    .progress-workspace[data-progress-phase="preparing"] .progress-stage-list,
    .progress-workspace[data-progress-phase="preparing"] .progress-step-guide { display: none; }
