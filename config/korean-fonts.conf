<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  한글 문서(hwp·hwpx·docx)를 PDF 로 변환할 때 쓸 대체 폰트.

  왜 필요한가 — 이 파일이 없으면 LibreOffice 가 문서가 요구하는 한글 폰트를
  **하나도 못 찾고** 전부 기본값으로 떨어뜨린다. 실측(2026-09-03, hwpx 6개):

    문서가 요구  : 한컴바탕 90 · 함초롬돋움 78 · 굴림 42 · 맑은 고딕 42
                   함초롬바탕 42 · 휴먼명조 42 · HY헤드라인M 42 · 한양신명조 24 …
    실제로 그려짐: 전부 Noto Sans CJK **JP**(일본어 자형) 하나

  결과는 두 가지로 나타난다.
    1. 명조(바탕) 문서가 고딕으로 그려진다 — 눈에 바로 보인다.
    2. 자폭이 달라져 줄바꿈이 밀리고, 그래서 **쪽 수가 원본과 달라진다.**
       문서가 길수록 누적돼서 뒤로 갈수록 크게 벌어진다.
       뷰어 하이라이트가 엉뚱한 쪽을 가리키는 원인이기도 하다.

  PRJX-DS-014_상세설계서_v1.3.hwpx 로 재 봤다(2026-09-03):
    규칙 없이 64쪽 → 규칙 적용 61쪽. **한글에서 연 원본이 61쪽으로, 일치한다.**
    쪽 수를 맞추는 것이 이 파일의 값어치다 — 하이라이트가 가리키는 쪽이
    원본과 같아진다.

  함초롬체를 맨 앞에 둔 이유 — 지금은 설치돼 있지 않아 건너뛰지만, 나중에
  설치되면 이 파일을 고치지 않아도 자동으로 그쪽이 이긴다(라이선스 판단이
  필요해 보류 중이다). 그때까지는 나눔명조/나눔고딕이 받는다.

  굴림·돋움·맑은 고딕 같은 MS 폰트와 휴먼명조·HY헤드라인M 같은 상용 폰트는
  배포할 수 없다. 원본과 같은 글꼴은 못 되지만, **최소한 명조를 명조로,
  고딕을 고딕으로** 그리게 하는 것이 이 파일의 목적이다.
-->
<fontconfig>

  <!-- 명조·바탕 계열 → serif -->
  <alias binding="same">
    <family>함초롬바탕</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>한컴바탕</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>바탕</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>바탕체</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>명조</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>신명조</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>휴먼명조</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>한양신명조</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>HY신명조</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>궁서</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>궁서체</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>Batang</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>BatangChe</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>Gungsuh</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>GungsuhChe</family>
    <prefer>
      <family>함초롬바탕</family>
      <family>NanumMyeongjo</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- 고딕·돋움 계열 → sans-serif -->
  <alias binding="same">
    <family>함초롬돋움</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>한컴돋움</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>돋움</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>굴림</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>고딕</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>맑은 고딕</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>맑은</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>HY헤드라인M</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>헤드라인</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Dotum</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Gulim</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Malgun Gothic</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>MalgunGothic</family>
    <prefer>
      <family>함초롬돋움</family>
      <family>NanumGothic</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- 고정폭(…체) → monospace -->
  <alias binding="same">
    <family>돋움체</family>
    <prefer>
      <family>NanumGothicCoding</family>
      <family>NanumGothic</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>굴림체</family>
    <prefer>
      <family>NanumGothicCoding</family>
      <family>NanumGothic</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>DotumChe</family>
    <prefer>
      <family>NanumGothicCoding</family>
      <family>NanumGothic</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>GulimChe</family>
    <prefer>
      <family>NanumGothicCoding</family>
      <family>NanumGothic</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
    <default><family>monospace</family></default>
  </alias>

  <!-- 이름을 못 알아본 폰트가 일본어 자형으로 떨어지지 않게. 한국어 문맥에만 건다 —
       Latin 까지 나눔으로 끌고 가면 영문이 나빠진다. -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>NanumMyeongjo</string>
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>NanumGothic</string>
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>NanumGothic</string>
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>
</fontconfig>
